[models]
planner = "openrouter/anthropic/claude-opus-4.6"
executor = "openai/gpt-5.2"
mediator = "google/gemini-3-flash-preview"
judge = "openrouter/openai/gpt-oss-120b"

[budgets]
max_skill_tokens = 4000
max_same_task_prior_tokens = 300
max_transfer_context_tokens = 900
trace_excerpt_tokens = 6000
historical_summary_tokens = 3000
mediator_report_tokens = 1200
planner_context_tokens = 24000
mediator_prompt_tokens = 16000
judge_prompt_tokens = 16000
planner_completion_tokens = 32768
mediator_completion_tokens = 8192
judge_completion_tokens = 4096

[judge]
rubric_version = "rar-v1"

[experiment]
num_iterations = 5
seed = 42
condition_name = "learned_mediator"

[sequence]
length = 10
warmup = 3

[diffusion]
enabled = false
policy = "none"
graph = "none"
max_artifacts = 3
random_policy_max_artifacts = 2
top_k_neighbors = 5
avoid_recheck_max_artifacts = 1

[paths]
skills_dir = "skills"
data_dir = "data"
benchmarks_dir = "benchmarks/skillflow"

[executor_runtime]
jobs_dir = "jobs"
task_dirs = ["tasks"]
agent_name = "claude-code"
dataset = "zhang-ziao/SkillFlow-Task"
dataset_repo_type = "dataset"
harbor_base_image = "skillflow/harbor-cli-base:ubuntu24.04"
legacy_harbor_base_images = ["skillevlove/harbor-cli-openhands:ubuntu24.04"]
harbor_agent_setup_timeout_multiplier = 2.0

[executor_runtime.agent_env]
ANTHROPIC_API_KEY = ""
ANTHROPIC_AUTH_TOKEN = "${OPENROUTER_API_KEY}"
ANTHROPIC_BASE_URL = "https://openrouter.ai/api"
