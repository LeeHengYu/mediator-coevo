[models]
planner = "openrouter/anthropic/claude-opus-4.6"
executor = "google/gemini-3-flash-preview"
mediator = "openrouter/openai/gpt-5.5"
judge = "openrouter/qwen/qwen3.6-27b"

[budgets]
max_skill_tokens = 4000
trace_excerpt_tokens = 6000
historical_summary_tokens = 3000
mediator_report_tokens = 4000
planner_context_tokens = 24000
skill_update_diff_tokens = 6000
mediator_prompt_tokens = 16000
advisor_prompt_tokens = 12000
reflector_prompt_tokens = 16000
judge_prompt_tokens = 16000
planner_completion_tokens = 32768
mediator_completion_tokens = 8192
advisor_completion_tokens = 1024
reflector_completion_tokens = 4096
judge_completion_tokens = 4096

[judge]
rubric_version = "rar-v1"

[experiment]
num_iterations = 5
coevo_interval = 2          # co-evolution reflection every N iterations
advisor_buffer_max = 2     # review+commit executor skill proposals every N iterations
seed = 42
condition_name = "learned_mediator"
allow_cross_task_feedback = true

[experiment.skill_updates]
executor = true
planner = true
mediator = true

[experiment.skill_validation]
min_mean_delta = 0.01
reward_tolerance = 0.000000001
require_all_tasks_usable = true
sample_size = 3
skillsbench_tasks = [
  "spring-boot-jakarta-migration",
  "setup-fuzzing-py",
  "react-performance-debugging",
  "python-scala-translation",
  "fix-druid-loophole-cve",
]
swebench_instances = [
  "django__django-11099",
  "sympy__sympy-12481",
  "scikit-learn__scikit-learn-13241",
  "pytest-dev__pytest-5413",
  "matplotlib__matplotlib-23563",
  "sphinx-doc__sphinx-8282",
]
allow_contributing_fallback = true
min_skillsbench_tag_overlap = 1
# Set true to use configured SWE-bench instances as validation replacements
# for SWE-like SkillsBench proposals.
allow_swebench_replacement_for_skillsbench = false

[diffusion]
enabled = false
policy = "none"
max_artifacts = 3
top_k_neighbors = 3

[paths]
skills_dir = "skills"
data_dir = "data"
benchmarks_dir = "benchmarks/skillsbench"

[executor_runtime]
backend = "skillsbench"
agent_name = "hermes"
jobs_dir = "jobs"
task_dirs = ["tasks"]
injected_skill_name = "executor"
remote_fetch = true
archive_url = "https://github.com/benchflow-ai/skillsbench/archive/refs/heads/main.zip"
# Optional integrity pin for archive_url bytes. Recommended when archive_url is pinned.
# archive_sha256 = "<64 hex chars>"
