# Field framework for the survey "Retrieval-Augmented Methods for LLM Planning,
# Agents, Tool-Use, and Decision-Making".
# Schema: validator-compatible (field_categories: {<cat>: {fields: [...]}}).
# detail_level (极简|简要|详细) is human-facing; `required: true` marks the hard-gate core fields
# (broadly-applicable dims). Conditional tool/CBR/survey-only fields are left optional.
# Deep-research agents must emit EVERY field as a key, marking unknown values [uncertain].

field_categories:
  basic_info:
    fields:
    - name: name
      description: Canonical work / method name.
      detail_level: 极简
      required: true
    - name: year
      description: Publication year.
      detail_level: 极简
      required: true
    - name: venue
      description: Publication venue (conference/journal/arXiv); record the peer-reviewed venue when one exists.
      detail_level: 极简
      required: true
    - name: authors_affiliation
      description: Lead authors and primary affiliation(s).
      detail_level: 简要
      required: true
    - name: paper_url
      description: Primary stable link (arXiv abs / proceedings / DOI / OpenReview).
      detail_level: 极简
      required: true
    - name: code_url
      description: Official code or maintained repo, if any.
      detail_level: 简要
    - name: maintained_repo_url
      description: Continuously-updated GitHub paper list / leaderboard a survey or benchmark maintains (often more current than the frozen PDF).
      detail_level: 简要
  problem_definition:
    fields:
    - name: task_domain
      description: QA / planning / tool-use / embodied / code / web / decision-making.
      detail_level: 简要
      required: true
    - name: problem_setting
      description: Concrete setting and assumptions (offline vs interactive, single- vs multi-agent, supervision available).
      detail_level: 详细
      required: true
    - name: what_is_retrieved
      description: demos / cases / trajectories / skills / tools / docs / experiences / guidelines.
      detail_level: 简要
      required: true
    - name: retrieval_grounding
      description: Whether retrieval targets a STATIC external corpus (docs/KB/APIs), a GROWING/episodic memory the agent writes, or HYBRID.
      detail_level: 简要
      required: true
    - name: completeness_vs_topk_objective
      description: Whether the goal is a fixed top-k ranking, recovery of the complete minimal needed set (multi-tool/multi-demo completeness), or a precision-driven variable-size recommendation.
      detail_level: 简要
      required: true
    - name: cbr_cycle_coverage
      description: 'For CBR items: which canonical phases are implemented (Retrieve / Reuse / Revise / Retain). Use a 4-flag list.'
      detail_level: 简要
    - name: explicit_cbr_grounding
      description: 'Boolean + note: does the work explicitly frame itself as case-based reasoning (cite Aamodt & Plaza / Kolodner) vs realizing CBR mechanisms under another name.'
      detail_level: 简要
  retrieval_mechanism:
    fields:
    - name: retrieval_unit
      description: 'Granularity of the retrieved unit: token/snippet / single demo / full trajectory / sub-trajectory / thought-step / workflow-routine / guideline-rule / case (problem-solution) / skill-or-program / tool-API / (state,reward,action) tuple / KG-subgraph / document.'
      detail_level: 详细
      required: true
    - name: index_source
      description: Static corpus vs growing memory; offline-induced vs online/test-time-induced vs hybrid construction of the retrievable store.
      detail_level: 简要
      required: true
    - name: index_structure_topology
      description: 'Structural organization of the store: flat vector index / metadata-or-context-keyed / dependency or knowledge GRAPH / hierarchical (category->tool, app->API) / cluster-or-toolkit.'
      detail_level: 简要
      required: true
    - name: retriever_type
      description: BM25 / dense / learned / LLM-as-retriever / generative (tool-as-token) / hybrid.
      detail_level: 简要
      required: true
    - name: retriever_learning_signal
      description: 'How the retriever is trained/selected: none (off-the-shelf) / contrastive on similarity labels / LM-feedback / downstream-task-effectiveness or interactive preference (Bradley-Terry) / RL or learned policy / value-based.'
      detail_level: 详细
      required: true
    - name: query_construction
      description: How the query/key is formed (raw input, decomposed sub-queries, thought-conditioned step, synthetic/expanded query, intent extraction).
      detail_level: 简要
      required: true
    - name: query_granularity
      description: 'Level at which the query is constructed: task-level (one-shot at t=0), trajectory-level, step/state-level, or both (two-level retrieval).'
      detail_level: 简要
      required: true
    - name: when_to_retrieve
      description: one-shot / iterative / active (uncertainty-triggered) / adaptive (learned router).
      detail_level: 简要
      required: true
    - name: retrieval_trigger_signal
      description: 'Concrete signal deciding WHEN to retrieve: fixed schedule / token-level confidence / attention+uncertainty / learned complexity classifier / reflection tokens / agent-initiated request.'
      detail_level: 详细
      required: true
    - name: reranking
      description: Whether a reranking stage is applied and its type (cross-encoder, hierarchy-aware, weighted RRF, instruction-tuned).
      detail_level: 简要
      required: true
    - name: retrieved_context_refinement
      description: 'Post-retrieval processing before use: none / rerank / decompose-then-recompose / reason-in-documents distillation / distractor filtering / compression.'
      detail_level: 简要
      required: true
    - name: tool_document_engineering
      description: '(Tool items) How tool/skill descriptions are processed before indexing: raw docstring / synthetic-query augmentation / expanded summaries / weighted-field embeddings / instruction-tuned tool embeddings.'
      detail_level: 简要
    - name: index_content_separation
      description: Whether a lightweight retrievable index is separated from heavy content loaded on demand (progressive disclosure / SOP-index-then-content).
      detail_level: 简要
    - name: dynamic_index_and_protocol
      description: (Tool items) Static vs live-synchronized tool index and integration protocol (none / RapidAPI / RESTful / MCP / function-calling), incl. CRUD auto-sync.
      detail_level: 简要
    - name: tool_dependency_awareness
      description: (Tool items) Whether retrieval models inter-tool dependencies (output-of-A feeds B, shared auth, prerequisites) and how (dependency graph, bipartite KG, dependency-aware reranking).
      detail_level: 简要
  utilization_mechanism:
    fields:
    - name: how_retrieved_used
      description: prompt augmentation / skill reuse / case adaptation / training signal / latent-token injection.
      detail_level: 详细
      required: true
    - name: planning_integration
      description: 'How retrieval interfaces with planning/acting: one-shot exemplars at plan time / per-step interleaved / inside MCTS or tree search / hierarchical subtask-level / plan-then-retrieve / retrieve-then-plan / inside a search loop.'
      detail_level: 详细
      required: true
    - name: reasoning_search_interleaving_granularity
      description: 'Granularity at which retrieval is woven into reasoning: per-answer / per-CoT-step / per-sentence-or-token / per-tool-call within a rollout.'
      detail_level: 简要
      required: true
    - name: adaptation_mechanism
      description: '(CBR) How a retrieved case is adapted/revised: verbatim ICL exemplar / LLM-prompted adaptation / execution-feedback-driven revision / critic-guided revision / RL-reuse-finetuning / latent.'
      detail_level: 简要
    - name: retrieved_item_representation
      description: 'Surface form of what is injected: raw trajectory / distilled strategy-or-guideline / free-text workflow / executable program-or-skill / structured note / latent-soft tokens.'
      detail_level: 简要
      required: true
    - name: abstraction_level_of_retrieved_unit
      description: 'Abstraction of what is retrieved: raw trajectory vs distilled strategy/insight vs state-aware guideline/rule vs reusable workflow vs procedural skill vs single demonstration vs hint.'
      detail_level: 简要
      required: true
    - name: noise_robustness_mechanism
      description: 'How the method guards against irrelevant/incorrect retrieved context: retriever-aware training / relevance evaluator or self-reflection / reason-in-documents refinement / distractor-aware SFT.'
      detail_level: 简要
      required: true
  memory_learning:
    fields:
    - name: memory_type
      description: none / episodic / skill-library / workflow / procedural / graph / latent.
      detail_level: 简要
      required: true
    - name: write_back
      description: Does the system store new experiences/cases/skills into memory? (boolean + brief note).
      detail_level: 简要
      required: true
    - name: online_growth
      description: Does the retrievable store grow during deployment/test-time (vs frozen after offline induction)?
      detail_level: 简要
      required: true
    - name: write_back_trigger
      description: 'What event causes a write: never / on-success only / on-success-and-failure / per-step / reflective (after self-critique) / human-validated.'
      detail_level: 详细
      required: true
    - name: failure_experience_usage
      description: Whether and how FAILED/negative experiences are stored and retrieved (success-only vs success+failure contrastive vs failure-only corrective rules).
      detail_level: 简要
      required: true
    - name: memory_evolution_update
      description: 'Whether stored entries are mutated after writing: append-only / dedup-merge / delta-update / refine-overwrite / forget-prune / link-and-evolve.'
      detail_level: 简要
      required: true
    - name: retrieval_as_learned_policy
      description: Whether retrieval/case-selection is a learned/RL-optimized policy (e.g. M-MDP soft Q-learning, RL retrieval) vs a fixed similarity top-k.
      detail_level: 简要
      required: true
    - name: cross_agent_or_cross_framework_sharing
      description: Whether memory/experience is shared across multiple agents or heterogeneous agent frameworks vs single-agent private memory.
      detail_level: 简要
      required: true
  evaluation:
    fields:
    - name: benchmarks
      description: Datasets/environments used (record raw names).
      detail_level: 简要
      required: true
    - name: benchmark_family
      description: 'Normalized grouping: QA / multi-hop / web (Mind2Web/WebArena/Online-Mind2Web) / embodied (ALFWorld/ScienceWorld/VirtualHome/Minecraft) / tool (ToolBench/ToolRet/API-Bank) / code (SWE-bench/RepoEval) / memory (LoCoMo/LongMemEval) / decision-RL (D4RL).'
      detail_level: 简要
      required: true
    - name: baselines
      description: Key methods compared against.
      detail_level: 简要
      required: true
    - name: key_metrics
      description: Primary metrics (pass/success rate, accuracy, Recall@k/nDCG, win rate, F1, token/latency savings).
      detail_level: 简要
      required: true
    - name: headline_result
      description: Single most-cited headline number with its setting.
      detail_level: 简要
      required: true
    - name: ablations
      description: Notable ablations clarifying which component drives the result.
      detail_level: 详细
      required: true
    - name: evaluation_decoupling
      description: Whether intrinsic retrieval metrics (Recall@k/nDCG/completeness) are reported separately from end-to-end task metrics.
      detail_level: 简要
      required: true
    - name: process_vs_outcome_metrics
      description: Whether evaluation scores final outcome only, or also intermediate process quality (reasoning faithfulness, step-wise retrieval/planning accuracy, trajectory quality).
      detail_level: 简要
      required: true
    - name: cost_efficiency_tradeoff
      description: 'Reported retrieval/inference cost vs accuracy: number of retrieval calls, API cost, latency/speedup, token savings, rollouts needed.'
      detail_level: 简要
      required: true
    - name: context_budget_and_selection_count
      description: 'Token/prompt budget for injected items and how k is set: fixed-k / adaptive-or-precision-driven / budget-capped / reranked-then-truncated.'
      detail_level: 简要
      required: true
    - name: survey_scope_and_axes
      description: (Survey/taxonomy items) The explicit organizing axes used and the reference count / coverage time-window.
      detail_level: 简要
    - name: benchmark_construction_and_size
      description: (Benchmark items) Dataset size, construction method (human-curated / reverse-engineered / LLM-synthesized / transformed), and answer verifiability; plus the best-system score signaling difficulty.
      detail_level: 简要
  relations:
    fields:
    - name: builds_on
      description: Direct predecessors / methods extended.
      detail_level: 简要
      required: true
    - name: contrasts_with
      description: Methods explicitly positioned against.
      detail_level: 简要
      required: true
    - name: lineage
      description: Position in the lineage of the relevant sub-topic (A-F or Surveys).
      detail_level: 简要
      required: true
uncertain:
- reproducibility
- compute_cost
- limitations
- evaluation_protocol_standardization
- provenance_and_leakage_controls
new_fields_from_search:
- 'retrieval_grounding / index_source: promoted static-corpus vs growing-memory vs hybrid to a top-level distinction separating classic RAG planners from experience/case planners.'
- 'retrieval_trigger_signal: separates the concrete WHEN-to-retrieve signal (token confidence, attention, learned classifier, reflection tokens, agent request) beyond the coarse one-shot/iterative/active.'
- 'retriever_learning_signal: captures the shift from similarity-only to LM-feedback, task-effectiveness/preference, and RL-trained retrievers.'
- 'retrieval_as_learned_policy: flags works where retrieval/case-selection IS a trained policy rather than fixed top-k.'
- 'retrieved_context_refinement: adds rerank/distill/compress/decompose operations central to corrective and agentic RAG.'
- 'reasoning_search_interleaving_granularity: distinguishes per-answer vs per-CoT-step vs per-token vs per-tool-call interleaving.'
- 'abstraction_level_of_retrieved_unit + retrieved_item_representation: capture raw-trajectory vs distilled-strategy vs workflow vs program vs latent-token, a major 2024-2026 axis.'
- 'write_back_trigger + failure_experience_usage + memory_evolution_update: refine the coarse boolean write_back into trigger, success-vs-failure storage, and post-write dynamics.'
- 'index_structure_topology + tool_dependency_awareness + dynamic_index_and_protocol: graph/hierarchical indices, inter-tool dependency modeling, and MCP/live tool stores (2024-2025 tool-retrieval sea-change).'
- 'completeness_vs_topk_objective + tool_document_engineering + index_content_separation: completeness vs ranking objective, document-expansion lever, and lightweight-index-then-content efficiency pattern.'
- 'cbr_cycle_coverage + explicit_cbr_grounding + adaptation_mechanism: the defining CBR ontology separating true case-based reasoning from plain retrieval-augmentation.'
- 'evaluation_decoupling + process_vs_outcome_metrics + benchmark_construction_and_size + survey_scope_and_axes: sharpen evaluation for benchmark/survey items.'
- 'cost_efficiency_tradeoff + context_budget_and_selection_count: promote efficiency/budget to first-class evaluation fields beyond the compute_cost uncertainty tag.'
- 'cross_agent_or_cross_framework_sharing: collective/shared memory across agents or frameworks, a distinct 2025 problem.'
- 'evaluation_protocol_standardization + provenance_and_leakage_controls: deferred to uncertain; sharpen reproducibility for agentic-RAG/tool benchmarks and streaming test-time memory.'
