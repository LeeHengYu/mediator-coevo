    venue: "EMNLP 2024"
    group: A_icl_demonstration_retrieval
    secondary_topics: []
    paper_url: "https://arxiv.org/abs/2406.14739"
    is_seed: false
    one_liner: "Frames building an ICL exemplar set as an MDP and trains a stateful iterative retriever via RL with LLM feedback, outperforming one-shot retrieval."
  - id: topk-cone
    name: "TopK + ConE - Revisiting Demonstration Selection Strategies in In-Context Learning"
    year: 2024
    venue: "ACL 2024"
    group: A_icl_demonstration_retrieval
    secondary_topics: []
    paper_url: "https://arxiv.org/abs/2401.12087"
    is_seed: false
    one_liner: "Data- and model-dependent demonstration selection scoring a demo by its contribution to the model's understanding of the test sample, unifying prior similarity-based heuristics."
  - id: traj-bootstrap
