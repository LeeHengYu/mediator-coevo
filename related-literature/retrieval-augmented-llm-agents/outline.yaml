topic: "Retrieval-Augmented Methods for LLM Planning, Agents, Tool-Use, and Decision-Making"
description: >-
  A curated map of methods that RETRIEVE demonstrations, cases, trajectories, skills, tools,
  experiences, or guidelines to augment large language models for task-solving and acting.
  It spans in-context-learning demonstration retrieval, retrieval-augmented reasoning and code
  generation, LM planning, case-based reasoning, tool-use agents, and agent memory / in-context
  RL, deliberately distinct from vanilla single-shot RAG-for-QA.
generated: "2026-06-07"
time_range: "2023-01 to 2026-06 (foundational pre-2023 items included where lineage-critical)"
groups:
  A_icl_demonstration_retrieval:
    title: "Retrieval-augmented in-context learning / demonstration selection"
    description: "Retrieving, selecting, and ordering labeled demonstrations/exemplars to condition an LLM via in-context learning, from similarity kNN to learned, set-level, diversity-aware, and reasoning-aware retrievers."
  B_rag_task_solving:
    title: "Retrieval-augmented reasoning / generation for task-solving"
    description: "Interleaving retrieval with multi-step reasoning and generation (one-shot, iterative, active, self-reflective, RL-trained search) including retrieval-augmented code generation, distinct from vanilla single-shot RAG-for-QA."
  C_rag_planning:
    title: "Retrieval-augmented planning (LM planners)"
    description: "LM planners that retrieve trajectories, sub-goals, instruction graphs, or skills to construct, refine, or critique plans (plan-then-retrieve, retrieve-then-plan, critic/MCTS-guided, embodied and web settings)."
  D_case_based_planning:
    title: "Case-based retrieval for LM planning (CBR + LLM)"
    description: "Case-based reasoning with LLMs: retrieve, reuse, revise, and retain problem-solution cases, reflections, rules, or abstracted insights, including theory-grounded and domain CBR-LLM systems."
  E_tool_use:
    title: "Retrieval-augmented tool-use agents"
    description: "Retrieving, recommending, or generating tools/APIs for LLM agents at scale (dense/graph/generative retrieval, reranking, completeness, MCP-era tool stores) plus the tool-retrieval benchmark landscape."
  F_decision_memory_rl:
    title: "Context retrieval for decision-making / agent memory / RL"
    description: "Retrieval over growing agent memory (episodic, procedural, skill, graph, latent) and retrieval-augmented in-context reinforcement learning for sequential decision-making and self-evolving agents."
  surveys:
    title: "Surveys, taxonomies, and benchmarks"
    description: "Surveys and taxonomies spanning the six sub-topics plus evaluation surveys and memory/tool/agentic-search benchmarks that anchor the field."
items:
  - id: kate
    name: "KATE - What Makes Good In-Context Examples for GPT-3"
    year: 2021
    venue: "DeeLIO@ACL 2022"
    group: A_icl_demonstration_retrieval
    secondary_topics: []
    paper_url: "https://arxiv.org/abs/2101.06804"
    is_seed: true
    one_liner: "kNN retrieval of semantically similar examples (sentence embeddings) as in-context demonstrations, the founding similarity-based demo retriever."
  - id: epr
    name: "EPR - Learning to Retrieve Prompts for In-Context Learning"
    year: 2022
    venue: "NAACL 2022"
    group: A_icl_demonstration_retrieval
    secondary_topics: []
    paper_url: "https://arxiv.org/abs/2112.08633"
    is_seed: true
    one_liner: "Trains a dense prompt retriever with contrastive LM-scored positive/negative demonstrations (efficient prompt retrieval)."
  - id: dr-icl
    name: "Dr.ICL - Demonstration-Retrieved In-Context Learning"
    year: 2023
    venue: "Data Intelligence 2024"
    group: A_icl_demonstration_retrieval
    secondary_topics: []
    paper_url: "https://arxiv.org/abs/2305.14128"
    is_seed: true
    one_liner: "Shows BM25/dense retrieval of demonstrations beats random for instruction-tuned LLMs and CoT, and trains a task-specific demo retriever; covers diverse-coverage selection (Dr.ICL/Cover-LS)."
  - id: llm-r
    name: "LLM-R - Learning to Retrieve In-Context Examples for Large Language Models"
    year: 2024
    venue: "EACL 2024"
    group: A_icl_demonstration_retrieval
    secondary_topics: []
    paper_url: "https://arxiv.org/abs/2307.07164"
    is_seed: true
    one_liner: "Iterative reward-model-distilled dense retriever trained from LLM feedback to select ICL examples across many tasks."
  - id: cbr-kbqa
    name: "CBR-KBQA - Case-Based Reasoning for Natural Language Queries over Knowledge Bases"
    year: 2021
    venue: "EMNLP 2021"
    group: A_icl_demonstration_retrieval
    secondary_topics: [D_case_based_planning]
    paper_url: "https://arxiv.org/abs/2104.08762"
    is_seed: false
    one_liner: "Foundational neuro-symbolic CBR-with-retrieval: nonparametric (question, logical-form) case memory plus retrieve-and-reuse, usable with new cases without retraining (lineage origin for case retrieval)."
  - id: fantastically-ordered
    name: "Fantastically Ordered Prompts and Where to Find Them: Overcoming Few-Shot Prompt Order Sensitivity"
    year: 2021
    venue: "ACL 2022"
    group: A_icl_demonstration_retrieval
    secondary_topics: []
    paper_url: "https://arxiv.org/abs/2104.08786"
    is_seed: false
    one_liner: "Establishes demonstration-order sensitivity in few-shot ICL and selects performant permutations via an entropy statistic over a generated artificial development set (foundational ordering work)."
  - id: selective-annotation-votek
    name: "Selective Annotation Makes Language Models Better Few-Shot Learners (vote-k)"
    year: 2022
    venue: "ICLR 2023"
    group: A_icl_demonstration_retrieval
    secondary_topics: []
    paper_url: "https://arxiv.org/abs/2209.01975"
    is_seed: false
    one_liner: "Unsupervised graph-based selective-annotation method (vote-k) that picks a diverse, representative pool to annotate, then retrieves demonstrations from it at test time (annotation-efficient ICL)."
  - id: ceil
    name: "CEIL - Compositional Exemplars for In-Context Learning"
    year: 2023
    venue: "ICML 2023"
    group: A_icl_demonstration_retrieval
    secondary_topics: []
    paper_url: "https://arxiv.org/abs/2302.05698"
    is_seed: false
    one_liner: "Models demo selection as Determinantal-Point-Process subset selection to jointly optimize relevance and inter-example diversity, trained with contrastive LM preference."
  - id: self-adaptive-icl
    name: "Self-Adaptive In-Context Learning: An Information Compression Perspective for Example Selection and Ordering"
    year: 2023
    venue: "ACL 2023"
    group: A_icl_demonstration_retrieval
    secondary_topics: []
    paper_url: "https://arxiv.org/abs/2212.10375"
    is_seed: false
    one_liner: "Per-sample select-then-rank framework (MDL/information-compression criterion) that jointly chooses and orders in-context examples for each query."
  - id: udr
    name: "UDR - Unified Demonstration Retriever for In-Context Learning"
    year: 2023
    venue: "ACL 2023"
    group: A_icl_demonstration_retrieval
    secondary_topics: []
    paper_url: "https://arxiv.org/abs/2305.04320"
    is_seed: false
    one_liner: "Single multi-task learned retriever across 30+ tasks via list-wise ranking from LM feedback with iterative hard-negative mining; generalizes to unseen datasets and LMs."
  - id: graphic
    name: "GraphIC - Graph-based Reasoning-Aware ICL Example Retrieval"
    year: 2024
    venue: "arXiv 2410.02203"
    group: A_icl_demonstration_retrieval
    secondary_topics: []
    paper_url: "https://arxiv.org/abs/2410.02203"
    is_seed: false
    one_liner: "Retrieves demonstrations via thought-graph representations and a reasoning-aware similarity metric, capturing reasoning structure for multi-step tasks."
  - id: mod
    name: "MoD - Mixture of Demonstrations for In-Context Learning"
    year: 2024
    venue: "NeurIPS 2024"
    group: A_icl_demonstration_retrieval
    secondary_topics: []
    paper_url: "https://papers.nips.cc/paper_files/paper/2024/hash/a0da098e0031f58269efdcba40eedf47-Abstract-Conference.html"
    is_seed: false
    one_liner: "Partitions the demonstration pool among expert retrievers and trains them to suppress unhelpful demos, modeling set-level interaction for large/noisy pools."
  - id: reticl
    name: "RetICL / Learning to Retrieve Iteratively for In-Context Learning"
