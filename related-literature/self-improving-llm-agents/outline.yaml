# outline.yaml — Items + execution config for the survey
# Topic: Self-improving LLM agents — automatic prompt optimization, textual policy
#        optimization, and LLM-agent skill acquisition.
# Built from 9 parallel Opus-4.8 supplement agents (literature MCP + exa + firecrawl),
# all items cross-verified against primary sources (arXiv / venue / repo).
# Structure: 11 clusters (C1–C11) + a Survey/Position anchor layer (S).
# Time range: foundational (2020/2021) → 2026. See fields.yaml for the A–H schema.

topic: "Self-improving LLM agents: automatic prompt optimization, textual policy optimization, and skill acquisition"
topic_slug: self-improving-llm-agents

# ────────────────────────────────────────────────────────────────────────────
clusters:

  C1_automatic_prompt_optimization:
    label: "Automatic Prompt Optimization (instruction induction & discrete/black-box search)"
    items:
      - name: AutoPrompt
        year: 2020
        venue: "EMNLP 2020"
        authors: "Shin et al."
        paper_url: https://arxiv.org/abs/2010.15980
        note: "Gradient-guided discrete token search; foundational."
      - name: APE (Automatic Prompt Engineer)
        year: 2022
        venue: "ICLR 2023"
        authors: "Zhou et al."
        paper_url: https://arxiv.org/abs/2211.01910
        note: "LLM proposes + selects instructions via instruction induction."
      - name: GrIPS
        year: 2022
        venue: "EACL 2023"
        authors: "Prasad et al."
        paper_url: https://arxiv.org/abs/2203.07281
        note: "Gradient-free edit-based phrase search."
      - name: RLPrompt
        year: 2022
        venue: "EMNLP 2022"
        authors: "Deng et al."
        paper_url: https://arxiv.org/abs/2205.12548
        note: "RL over discrete prompt tokens."
      - name: TEMPERA
        year: 2022
        venue: "ICLR 2023"
        authors: "Zhang et al."
        paper_url: https://arxiv.org/abs/2211.11890
        note: "Test-time prompt editing via RL."
      - name: OPRO
        year: 2023
        venue: "ICLR 2024"
        authors: "Yang et al. (Google DeepMind)"
        paper_url: https://arxiv.org/abs/2309.03409
        note: "'LLMs as optimizers' via meta-prompt optimization trajectory."
      - name: ProTeGi / APO
        year: 2023
        venue: "EMNLP 2023"
        authors: "Pryzant et al. (Microsoft)"
        paper_url: https://arxiv.org/abs/2305.03495
        note: "Textual 'gradients' + beam search ('Automatic Prompt Optimization with Gradient Descent and Beam Search')."
      - name: PromptWizard
        year: 2024
        venue: "Microsoft Research (TR)"
        authors: "Agarwal et al."
        paper_url: https://arxiv.org/abs/2405.18369
        note: "Feedback-driven self-evolving critique+synthesis; joint instruction+demo. Degrades on small models (Llama3-8B)."
      - name: SAMMO
        year: 2024
        venue: "EMNLP 2024"
        authors: "Schnabel & Neville (Microsoft)"
        paper_url: https://arxiv.org/abs/2404.02319
        note: "Structure-aware symbolic prompt-program search; generalizes DSPy. Primary in C3, cross-ref here."
      - name: SPO (Self-Supervised Prompt Optimization)
        year: 2025
        venue: "EMNLP 2025 Findings"
        authors: "Xiang et al. (MetaGPT/FoundationAgents)"
        paper_url: https://arxiv.org/abs/2502.06855
        note: "Reference-free; pairwise LLM output comparison (~$0.15/dataset)."
      # — supplement —
      - name: PromptAgent
        year: 2023
        venue: "ICLR 2024"
        authors: "Wang et al."
        paper_url: https://arxiv.org/abs/2310.16427
        note: "MCTS 'strategic planning' view of APO; top-3 cited APO baseline."
      - name: PE2 (Prompt Engineering a Prompt Engineer)
        year: 2023
        venue: "ACL 2024"
        authors: "Ye, Pryzant et al."
        paper_url: https://arxiv.org/abs/2311.05661
        note: "Enriched meta-prompt design; successor to APE/ProTeGi."
      - name: GReaTer
        year: 2024
        venue: "Salesforce/PSU"
        authors: "Das et al."
        paper_url: https://arxiv.org/abs/2412.09722
        note: "Gradients over reasoning tokens so SMALL open models self-optimize prompts."
      - name: StablePrompt
        year: 2024
        venue: "EMNLP 2024"
        authors: "Kwon et al."
        paper_url: https://arxiv.org/abs/2410.07652
        note: "RL prompt tuning with Adaptive PPO + anchor model for stability."
      - name: DLN (Deep Language Networks)
        year: 2023
        venue: "NeurIPS 2023"
        authors: "Sordoni et al."
        paper_url: https://arxiv.org/abs/2306.12509
        note: "Joint prompt opt of stacked LLM layers via variational inference."
      - name: Plum
        year: 2023
        venue: "arXiv"
        authors: "Pan et al."
        paper_url: https://arxiv.org/abs/2311.08364
        note: "Metaheuristics (hill-climb, annealing, GA, tabu, harmony) for prompt learning."
      - name: CAPO (Cost-Aware Prompt Optimization)
        year: 2025
        venue: "arXiv"
        authors: "Zehle et al."
        paper_url: https://arxiv.org/abs/2504.16005
        note: "GA optimizer + racing/early-stopping + length penalty; joint instruction+few-shot."
      - name: PACE
        year: 2024
        venue: "AAAI"
        authors: "Dong et al."
        paper_url: https://arxiv.org/abs/2308.10088
        note: "Actor-critic RL applied to prompt editing."
      - name: StraGo
        year: 2024
        venue: "arXiv"
        authors: "Wu et al."
        paper_url: https://arxiv.org/abs/2410.08601
        note: "Strategic guidance from BOTH correct and incorrect predictions (vs ProTeGi error-only)."
      - name: PREFER
        year: 2024
        venue: "AAAI"
        authors: "Zhang et al."
        paper_url: https://arxiv.org/abs/2308.12033
        note: "Feedback-reflect-refine with prompt ensembling/boosting."
      - name: SPRIG
        year: 2024
        venue: "arXiv"
        authors: "Zhang et al."
        paper_url: https://arxiv.org/abs/2410.14826
        note: "Optimizes SYSTEM prompts from a 300-component corpus via token-level genetic edits."
      - name: SCULPT
        year: 2024
        venue: "arXiv"
        authors: "Kumar et al."
        paper_url: https://arxiv.org/abs/2410.20964
        note: "Hierarchical tree structure for tuning long, unstructured prompts."

