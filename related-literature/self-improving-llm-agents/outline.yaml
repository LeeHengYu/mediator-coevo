# ────────────────────────────────────────────────────────────────────────────
execution:
  batch_size: 16              # concurrent deep-research agents (harness cap ~min(16, cores-2))
  items_per_agent: 1          # max fan-out — one Opus 4.8 agent per item
  model: opus                 # Opus 4.8, max reasoning effort
  tools: [academic-search-mcp, exa, firecrawl]
  output_dir: ./related-literature/self-improving-llm-agents/results
  disable_task_output: true   # per /research-deep convention
  notes: >
    ~100 method items across C1–C11 plus 9 survey anchors (S, not deep-researched
    as methods — used for taxonomy/cross-checking). Survey-layer items may instead
    be read once to calibrate fields. Deep phase fills the A–H schema in fields.yaml,
    skipping uncertain values and flagging the items in `uncertain` for verification.

# Cross-cluster boundary map (items deliberately appearing in / linked across clusters):
boundaries:
  - "GEPA: C2 (primary) ↔ C3 ↔ C6 — reflective genetic-Pareto prompt evolution vs RL."
  - "SAMMO: C3 (primary) ↔ C1 — symbolic prompt-program search."
  - "Agent Symbolic Learning: C3 (primary) ↔ C8 — textual backprop over agent system."
  - "ADAS / AFlow / AgentSquare: C5/C7 listed ↔ C8 — really multi-agent/topology design."
  - "Retroformer / ETO / SCoRe / Reflect-Retry-Reward: C4 ↔ C6 — verbal reflection w/ gradient updates."
  - "AgentFly-Memento / ACE: C5 (primary) ↔ C7/C9 — memory-as-policy, no weight updates."
  - "Memory-R1: C6 (primary) ↔ C5 — RL trains a memory manager."
  - "DGM: C11 (primary) ↔ C2 — evolutionary archive of self-modifying agents."
  - "TTRL / Absolute Zero: C9 (primary) ↔ C6 — test-time / self-play RL."
