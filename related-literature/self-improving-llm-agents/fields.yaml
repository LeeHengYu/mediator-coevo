# fields.yaml — Field/dimension schema for the survey
# Topic: Self-improving LLM agents — automatic prompt optimization, textual policy
#        optimization, and LLM-agent skill acquisition
# Schema: Survey-grounded A–H (restructured from the original A–G framework).
# Grounded in: Gao et al. 2025 (What/When/How/Where, arXiv:2507.21046),
#   Fang et al. 2025 (Inputs/Agent/Env/Optimisers, arXiv:2508.07407),
#   Ramnath et al. 2025 (AWS APO 5-stage pipeline, arXiv:2502.16923),
#   Cui et al. 2025 (APO heuristic search, arXiv:2502.18746),
#   Du et al. 2025 (agentic memory taxonomy), the Compound-AI-Systems-Optimization
#   survey (arXiv:2506.08234), the Agentic-RL survey (arXiv:2509.02547), and the
#   Credit-Assignment-in-RL survey (arXiv:2604.09459).
#
# detail_level legend (per /research skill):
#   极简  = one enum value / short token
#   简要  = short phrase or small set
#   详细  = sentence(s) / structured paragraph

topic: "Self-improving LLM agents: automatic prompt optimization, textual policy optimization, and skill acquisition"

detail_levels:
  极简: "single enum value or short token"
  简要: "short phrase or small set of values"
  详细: "one or more sentences / structured detail"

# NOTE: top-level key is `field_categories` for compatibility with
# ~/.claude/skills/research/validate_json.py (it reads data["field_categories"]).
field_categories:

  A_identity_provenance:
    label: "Identity & Provenance"
    description: "Who/what/when — citation hygiene and adoption signal."
    fields:
      - name: name
        description: "Canonical method name."
        detail_level: 极简
      - name: aliases
        description: "Other names / acronym expansions / name-collision warnings (e.g. GPO vs GRPO)."
        detail_level: 极简
      - name: year
        description: "First public (arXiv) year."
        detail_level: 极简
      - name: venue
        description: "Publication venue + year (arXiv / conference / journal)."
        detail_level: 极简
      - name: authors
        description: "First author + notable co-authors."
        detail_level: 极简
      - name: institution
        description: "Lead lab / organization."
        detail_level: 极简
      - name: paper_url
        description: "arXiv / DOI / proceedings link."
        detail_level: 极简
      - name: code_url
        description: "Official repo, if any (presence is an adoption signal)."
        detail_level: 极简
      - name: cluster
        description: "Assigned cluster bucket (C1–C11 / S)."
        detail_level: 极简
      - name: citation_count
        description: "Approximate citation count at survey time (relative impact signal)."
        detail_level: 极简

  B_problem_scope:
    label: "Problem & Scope — what gets improved"
    description: "Gao 'What to evolve' + Fang component axis + APO target granularity."
    fields:
      - name: optimization_target
        description: "Which component is optimized. THE primary axis."
        detail_level: 极简
        enum: [discrete_prompt, soft_prompt, few_shot_demos, full_prompt, reasoning_structure,
               agent_workflow, multi_agent_topology, model_weights, memory, skills_tools,
               curriculum_tasks, own_source_code]
      - name: target_granularity
        description: "For prompt targets: instruction-only / demos / full-prompt / system-vs-user prompt."
        detail_level: 极简
      - name: system_scope
        description: "single-agent node / single-agent holistic / multi-agent system."
        detail_level: 极简
      - name: task_setting
        description: "Task family the method is evaluated on."
        detail_level: 简要
        enum: [single_turn_qa, reasoning_math, multi_step_agent, tool_use, web_browsing,
               gui_os, embodied, code_swe, scientific_discovery, multimodal]
      - name: access_model
        description: "Degree of model access required."
        detail_level: 极简
        enum: [white_box_weights, black_box_api, gray_box, textual_gradient, gradient_free_bo]
      - name: agent_formalism
        description: "Underlying decision formalism (separates reasoning tricks from sequential agents)."
        detail_level: 极简
        enum: [single_step_mdp, multi_turn_pomdp, none]

  C_mechanism:
    label: "Mechanism — how it improves"
    description: "Method family + the APO/compound-system pipeline stages + RL credit machinery."
    fields:
      - name: paradigm
        description: "Top-level method family."
        detail_level: 极简
        enum: [reward_rl, imitation_demonstration, population_evolutionary, textual_gradient,
               reflection_verbal, search_planning, bayesian_bandit, self_play, hybrid]
      - name: feedback_type
        description: "Form of the learning signal."
        detail_level: 极简
        enum: [scalar_reward, natural_language, execution_result, self_critique,
               comparative_preference, fitness_score, verifiable_reward]
      - name: feedback_source
        description: "Where feedback originates."
        detail_level: 极简
        enum: [internal_self, self_vs_self_contrast, external_env, external_tool,
               other_agent, human, ai_judge_rlaif]
      - name: reward_granularity
        description: "Resolution of the reward/feedback signal."
        detail_level: 极简
        enum: [outcome_only, turn_level, step_level, token_level, hybrid, na]
      - name: update_operator
        description: "How new candidates / updates are produced."
        detail_level: 简要
        enum: [meta_prompt_edit, llm_rewriter, textual_gradient_backprop, genetic_mutation_crossover,
               mcts, beam_search, bandit_ucb, bayesian, rl_policy_gradient, code_rewrite, reflection_note]
      - name: search_selection_strategy
        description: "How candidates are kept/filtered (distinct pipeline stage from generation)."
        detail_level: 简要
        enum: [topk_greedy, beam, ucb_bandit, tournament_elo, pareto_frontier,
               archive_threshold, evolutionary_population, na]
      - name: optimizer_role
        description: "Who drives optimization & the optimizer-vs-target relationship."
        detail_level: 简要
        enum: [same_llm_self_referential, separate_optimizer_llm, smaller_optimizer_ok,
               meta_agent, evolutionary_controller, meta_optimized]
      - name: credit_assignment
        description: "How blame/credit is routed across modules/turns (Nie 'credit horizon')."
        detail_level: 简要
      - name: handles_cyclic_loops
        description: "Acyclic/single-pass only vs supports loops/repeated nodes."
        detail_level: 极简

  D_memory_skills:
    label: "Memory & Skills"
    description: "Split into its own category — two dedicated surveys (Du et al. memory; SoK Agentic Skills) taxonomize only this."
    fields:
      - name: memory_form
        description: "Representation of memory."
        detail_level: 极简
        enum: [none, parametric, contextual_structured, contextual_unstructured, graph, hybrid]
      - name: memory_taxonomy
        description: "Cognitive memory types implemented."
        detail_level: 简要
        enum: [episodic, semantic, procedural, working_core, none]
      - name: memory_operations
        description: "Lifecycle verbs supported (Du et al. 6 ops)."
        detail_level: 简要
        enum: [add, update_refine, delete_prune, merge, link, retrieve, compress, consolidate]
      - name: memory_temporal_scope
        description: "Transience of memory."
        detail_level: 极简
        enum: [none, episodic_within_task, session, cross_task_persistent, cross_domain]
      - name: skill_representation
        description: "Form of a stored skill."
        detail_level: 极简
        enum: [none, natural_language, executable_code_tool, policy, structured_template, hybrid]
      - name: skill_executability
        description: "Executable code/tool vs NL guidance vs template (drives reusability/verifiability claims)."
        detail_level: 极简
      - name: skill_lifecycle
        description: "Which skill phases are covered."
        detail_level: 简要
        enum: [discovery, distillation, storage, composition, reuse, update]
      - name: retrieval_mechanism
        description: "How stored memory/skill is recalled."
        detail_level: 极简
        enum: [na, embedding_similarity, llm_as_retriever, context_state_conditional, graph_traversal]

  E_learning_properties:
    label: "Temporal & Learning Properties — when it improves"
    description: "Gao 'When' axis + lifelong properties + on/off-policy."
    fields:
      - name: evolve_timing
        description: "When optimization happens."
        detail_level: 极简
        enum: [intra_test_time, inter_test_time, offline_training, pre_deployment]
      - name: learning_paradigm
        description: "Online / offline / both."
        detail_level: 极简
        enum: [online, offline, both]
      - name: policy_consistency
        description: "On-policy / off-policy / both / na."
        detail_level: 极简
        enum: [on_policy, off_policy, both, na]
      - name: lifelong_continual
        description: "Explicitly designed for sequential-task continual learning?"
        detail_level: 极简
      - name: self_referential
        description: "Does it modify its own optimization process / scaffold / code? (RSI, Gödel/DGM)"
        detail_level: 极简
      - name: self_modification_scope
        description: "Spectrum of what the agent can rewrite."
        detail_level: 简要
        enum: [none, memory_only, prompts_context, tools_skills, workflow_topology, own_source_code]
      - name: data_dependence
        description: "Training-data requirement (surfaces the self-play / zero-data frontier)."
        detail_level: 极简
        enum: [human_labeled, self_generated, zero_data, mixed]
      - name: needs_labels_or_reward
        description: "Requires labels / requires reward fn / label-free self-supervised."
        detail_level: 极简
      - name: parameter_update
        description: "Does the base LLM's weights change? (load-bearing cross-cluster axis)"
        detail_level: 极简
        enum: [none_in_context_only, frozen_llm_external_store, sft_distillation,
               rl_trained_aux_policy, rl_trained_base_weights]
      - name: autonomy_level
        description: "proto-evolution (feedback prompting) → strong-evolution (autonomous diagnosis + reconfig)."
        detail_level: 简要
      - name: transfer_axes
        description: "Demonstrated generalization dimensions."
        detail_level: 简要
        enum: [cross_task, cross_domain_website, cross_model_backbone, cross_framework, none_reported]
      - name: sample_compute_efficiency
        description: "Rollouts / LLM-calls / wall-time / query budget (the most-emphasized 2025 differentiator)."
        detail_level: 简要

  F_evaluation:
    label: "Evaluation"
    description: "Gao §7 five-goal eval framework + concrete benchmarks/results."
    fields:
      - name: benchmarks
        description: "Datasets/environments used (BBH, GSM8K, MMLU, HotpotQA, ALFWorld, WebShop, WebArena, GAIA, SWE-bench, AgentBench, Minecraft, HumanEval, ...)."
        detail_level: 简要
      - name: eval_goals_covered
        description: "Which of Gao's goals the paper measures."
        detail_level: 简要
        enum: [adaptivity, retention, generalization, efficiency, safety, self_directedness]
      - name: eval_paradigm
        description: "static / short-horizon-adaptive / long-horizon-lifelong."
        detail_level: 极简
      - name: baselines
        description: "Key methods compared against."
        detail_level: 简要
      - name: headline_result
        description: "Best reported gain vs baseline (with metric)."
        detail_level: 简要
      - name: ablations
        description: "Which components were ablated and what was learned."
        detail_level: 简要

  G_significance_relations:
    label: "Significance & Relations"
    description: "Novelty, lineage, limitations, adoption."
    fields:
      - name: key_innovation
        description: "One- or two-sentence statement of the core novelty."
        detail_level: 详细
      - name: builds_on
        description: "Lineage / influenced-by (e.g. builds on Reflexion / STaR / Voyager / TextGrad / DGM)."
        detail_level: 简要
      - name: cross_cluster_links
        description: "Related items in other clusters (boundary/hybrid notes)."
        detail_level: 简要
      - name: limitations
        description: "Stated failure modes / scope limits."
        detail_level: 简要
      - name: negative_result_caveat
        description: "Whether gains survive the Huang-2023 / Kamoi-2024 self-correction critiques (oracle stopping, unfair baselines, intrinsic-only feedback)."
        detail_level: 简要
      - name: adoption
        description: "Open-source maturity / downstream use / framework integration."
        detail_level: 简要

  H_uncertain_deep_phase:
    label: "Uncertain (deep-phase fill)"
    description: "Reserved fields filled opportunistically during deep research; skip if unknown."
    fields:
      - name: reproducibility
        description: "Reproduced by others? Does released code run? Known repro issues."
        detail_level: 简要
      - name: true_compute_cost
        description: "Disclosed GPU-hours / API $ / wall-clock for the headline result."
        detail_level: 简要
      - name: follow_ups
        description: "2025–2026 successors / extensions."
        detail_level: 简要
      - name: safety_mechanisms
        description: "rollback / sandbox / dual-audit / human gate (load-bearing for self-modifying methods)."
        detail_level: 简要

# Items flagged uncertain at outline time (deep phase resolves):
uncertain:
  - "Math-Shepherd exact arXiv ID (2312.08935 inferred from citing works — confirm by direct fetch)."
  - "Several 2026 items (TEP, TextResNet, ADPO, Skill1, MemSkill, Mem-pi, Evolving-RL) are very recent / low-citation — verify existence, venue, and maturity in deep phase."
  - "DynaSaur did not surface in Semantic Scholar (referenced via CodeMem) — confirm arXiv:2411.01747."
