# Field Definitions — LLM Agents Memory research
# Generated: 2026-06-07
# 6 approved categories + 8 supplemented dimensions (from web-search Step 2)
# detail_level tiers:  minimal (极简) -> brief (简要) -> detailed (详细)
#   minimal  = one token/label, for fast scan tables
#   brief    = one sentence
#   detailed = full paragraph w/ specifics, formulas, numbers

topic: "LLM Agents Memory"
fields_version: "1.0"

# NOTE: top-level key is `field_categories` to match the skill validator
# (~/.claude/skills/research/validate_json.py) and downstream research-report skill.
field_categories:

  # ── 1. Basic / provenance ────────────────────────────────────────────
  - category: provenance
    label: "Basic / Provenance"
    fields:
      - name: name
        description: "Canonical system/method name (+ aliases if the framework name differs from the paper title)."
        detail_level: minimal
      - name: year
        description: "First public year (arXiv preprint). Note venue year separately if different."
        detail_level: minimal
      - name: authors_institution
        description: "Lead authors and primary affiliation(s)."
        detail_level: brief
      - name: venue
        description: "Publication venue + year (conference/journal), or 'industry/open-source' for non-academic systems."
        detail_level: minimal
      - name: paper_url
        description: "Primary link: arXiv abstract page or official venue DOI."
        detail_level: minimal
      - name: code_url
        description: "Official code/repo URL + (if notable) star count."
        detail_level: minimal
      - name: citations_approx
        description: "Approximate citation count (Semantic Scholar, live). Marks influence/maturity."
        detail_level: minimal

  # ── 2. Memory taxonomy ───────────────────────────────────────────────
  - category: taxonomy
    label: "Memory Taxonomy"
    fields:
      - name: memory_type
        description: "Episodic / semantic / procedural / working — which CoALA category/categories the memory implements."
        detail_level: brief
      - name: memory_structure
        description: "Underlying data structure: raw buffer / vector store / knowledge graph / note-graph (Zettelkasten) / hierarchical tiers / parametric weights."
        detail_level: brief
      - name: storage_backend
        description: "Concrete backend (in-context window, vector DB e.g. FAISS/Chroma, graph DB e.g. Neo4j, files, model parameters)."
        detail_level: brief
      - name: persistence
        description: "Where memory lives across the agent lifecycle: in-context (ephemeral) vs external (durable store) vs parametric (baked into weights)."
        detail_level: brief

  # ── 3. Core mechanisms ───────────────────────────────────────────────
  - category: mechanisms
    label: "Core Mechanisms"
    fields:
      - name: write_encoding
        description: "How raw experience is captured and encoded into memory (verbatim trajectory, summarized insight, extracted facts, embeddings, graph triples)."
        detail_level: detailed
      - name: retrieval_mechanism
        description: "How memory is read back: similarity search, recency·importance·relevance scoring (give the formula if any), graph traversal / PPR, surprise-based segmentation, learned retrieval."
        detail_level: detailed
      - name: reflection_consolidation
        description: "Raw→insight transformation: does it reflect/summarize/abstract experience into higher-level knowledge? When and how triggered."
        detail_level: detailed
      - name: forgetting_update
        description: "How memory decays / is edited / merged / deduplicated / invalidated over time (e.g. Ebbinghaus decay, ADD/UPDATE/DELETE ops, conflict resolution)."
        detail_level: brief
      - name: experience_replay
        description: "CORE THEME — how past trajectories/episodes are reused to improve future behavior (exemplar prompting, skill reuse, replay buffer, distilled strategies)."
        detail_level: detailed

  # ── 4. Learning dimension ────────────────────────────────────────────
  - category: learning
    label: "Learning Dimension"
    fields:
      - name: learning_paradigm
        description: "Non-parametric (in-context, prompt-level) / parametric (gradient updates) / hybrid."
        detail_level: brief
      - name: failure_learning
        description: "CORE THEME — how failures are detected and used (self-reflection on failed episodes, failure-pattern memory, negative exemplars, error-driven rules)."
        detail_level: detailed
      - name: skill_procedural_induction
        description: "Does it induce reusable skills/workflows/procedures from experience? How are they represented and invoked?"
        detail_level: brief
      - name: online_vs_offline
        description: "Memory built online (during deployment, per-episode) vs offline (batch over a training corpus of trajectories) vs both."
        detail_level: brief

  # ── 5. Evaluation ────────────────────────────────────────────────────
  - category: evaluation
    label: "Evaluation"
    fields:
      - name: task_domains
        description: "Domains evaluated: web navigation / embodied (ALFWorld, Minecraft) / QA / multi-session dialogue / games / GUI / coding / enterprise."
        detail_level: brief
      - name: benchmarks
        description: "Specific benchmarks/datasets used (LoCoMo, LongMemEval, WebArena, ALFWorld, HotpotQA, etc.)."
        detail_level: brief
      - name: reported_gains
        description: "Headline quantitative results: exact scores + delta vs baseline (and which baseline). Include cost/latency/token deltas if reported."
        detail_level: detailed
      - name: baselines
        description: "What it is compared against (no-memory, full-context, RAG, prior memory systems)."
        detail_level: brief

  # ── 6. Analysis ──────────────────────────────────────────────────────
  - category: analysis
    label: "Analysis"
    fields:
      - name: key_innovation
        description: "The single most important contribution / what it does that prior work did not."
        detail_level: brief
      - name: limitations
        description: "Stated or evident limitations (scalability, cost, narrow domain, no real forgetting, reproducibility gaps)."
        detail_level: brief
      - name: relation_to_others
        description: "How it relates to / builds on / differs from other items in this study (cite ids, e.g. 'extends A1 Reflexion with parametric retro-model')."
        detail_level: detailed
      - name: reproducibility
        description: "Code availability, dataset availability, ease of reproduction, community adoption signals."
        detail_level: brief

  # ── 7. Supplemented dimensions (from Step-2 web search) ──────────────
  - category: supplemented
    label: "Supplemented Dimensions (2025-26 frontier)"
    fields:
      - name: learned_memory_control
        description: "Does it use RL/training to learn the memory-management POLICY itself (what/when to store/update/retrieve), vs heuristic pipeline? Key 2025-26 generational divide (Memory-R1, Mem-α, SkillOS, CODESKILL, UI-Mem)."
        detail_level: brief
      - name: memory_subject
        description: "User-centric (remember user info to personalize — Mem0/Zep/LongMemEval) vs agent-centric (remember own experience to self-improve — ReasoningBank/Voyager). Different mechanisms & evaluation."
        detail_level: brief
      - name: multi_agent_memory
        description: "Single-agent vs multi-agent shared/routed memory (G-Memory, MIRIX): insight/query/interaction layering, memory routing across agents."
        detail_level: brief
      - name: temporal_reasoning_support
        description: "Does it explicitly model time validity / event ordering (fact-validity windows, event calendars — Zep/Graphiti)? Among the hardest evaluated abilities."
        detail_level: brief
      - name: modality
        description: "Text-only vs multimodal/visual/embodied memory (MIRIX screenshots, visual skills, video)."
        detail_level: minimal
      - name: over_personalization_risk
        description: "Memory-safety / negative dimension: handling of harmful/stale/intrusive/sycophantic memory; privacy governance (OP-Bench, Causal-LoCoMo). 'More memory' is not always better."
        detail_level: brief
      - name: conflict_contradiction_handling
        description: "How conflicting/contradictory facts are resolved or merged on update — distinct from forgetting (MEMTRACK, Memory-R1 UPDATE)."
        detail_level: brief
      - name: token_cost_latency_evidence
        description: "Quantified efficiency: latency / token-cost savings vs full-context or other memory layers (Mem0 -91% p95 / -90% tokens; Zep -90% latency; MemMachine -80% input tokens)."
        detail_level: brief

# ── Reserved / uncertain fields (auto-fill during deep phase if evidence found) ──
uncertain:
  - name: compute_cost
    description: "Training + inference compute footprint (GPU-hours, model size). Promote to first-class if quantified evidence exists."
  - name: scalability_evidence
    description: "Demonstrated behavior at scale (memory size, #episodes, context length, #users)."
  - name: theoretical_grounding
    description: "Formal/theoretical analysis (convergence guarantees, decision-process formulation, info-theoretic density)."
  - name: biological_inspiration_detail
    description: "Specific neuroscience/cognitive analogy claimed (hippocampus, Ebbinghaus curve, complementary learning systems) and how faithfully implemented."
  - name: information_density
    description: "Compression ratio / information density of stored memory (PlugMem info-theoretic analysis; A-MEM/Mem0 token-count comparisons)."
