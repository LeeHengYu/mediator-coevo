    - mcp__firecrawl__*         # full-content scrape of papers / repos / docs
  notes: >
    Each agent populates the full fields.yaml schema for its single item.
    Anchor on the arxiv id below; verify citation counts live; cross-check
    every claim against >=1 primary source (arXiv / venue / official repo).

