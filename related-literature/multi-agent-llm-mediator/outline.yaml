# outline.yaml — Research items for "Multi-Agent LLM Mediator & Mediated Communication"
# Synthesized from 8 specialist research agents (max-reasoning Opus + exa/firecrawl/academic-search).
# Items deduped across slices; hub papers placed in their primary cluster with cross_refs noted.
# relevance_tier ∈ {core, strong, contextual}:
#   core       = direct prior art for a CO-EVOLVING information-filtering MEDIATOR
#   strong     = strongly relevant mechanism/result (filtering, routing, topology, aggregation)
#   contextual = foundational background, applied instance, or broad reference
# ★ in notes = an agent flagged this among the MOST relevant to mediator-coevo.

topic: "Multi-Agent LLM Mediator & Mediated Communication"
topic_slug: multi-agent-llm-mediator
time_range: "2023–present (LLM-era focus); seminal classical works as foundations"
generated: 2026-06-07

execution:
  batch_size: 25          # max parallelism per user directive ("spawn as many as possible, no cost concern")
  items_per_agent: 1      # one deep-research agent per item (user-specified)
  output_dir: ./results
  model: opus             # max reasoning effort for every deep agent
  tools: [exa, firecrawl, academic-search]   # extensive external reference use

clusters:
  A: "Multi-Agent LLM Debate & Information Filtering/Aggregation"
  B: "Agent Frameworks / Orchestration Systems"
  C: "Agent Communication Protocols (standardized + emergent/learned)"
  D: "Mediators & Mediated Communication (game-theoretic / MARL / LLM)"
  E: "Blackboard Architecture (shared-memory mediated coordination)"
  F: "Stigmergy (environment-mediated indirect coordination)"
  G: "Learned MARL Communication (gating / sparsity / IB-constrained)"
  H: "Cutting-Edge 2025–26 (topology learning, latent comm, co-evolution) + Surveys"

