# fields.yaml — Research field framework for "Multi-Agent LLM Mediator / Mediated Communication"
# Merged from the initial 11-dimension framework + ~50 fields proposed by 8 specialist agents.
# detail_level: 极简 (one phrase) -> 简要 (1-2 sentences) -> 详细 (full paragraph w/ evidence).
# Not every field applies to every item; the deep phase fills only the relevant ones and
# leaves the rest blank. `uncertain` fields are reserved placeholders filled during deep research.

topic: "Multi-Agent LLM Mediator & Mediated Communication"
description: >
  A field schema for surveying how information is filtered, routed, aggregated, summarized,
  or gated between (co-evolving) agents — spanning LLM debate, agent frameworks/protocols,
  game-theoretic & MARL mediators, blackboard architectures, stigmergy, and learned MARL
  communication. The KEY axis throughout is the *mediation / information-filtering mechanism*.

field_categories:

  # ----------------------------------------------------------------------------
  basic:
    description: "Identity / provenance of the item."
    detail_level: 极简
    fields:
      - name: name
        description: "Canonical name / title of the work or concept."
      - name: year
        description: "arXiv/first-appearance year. Note arXiv-year vs venue-year offsets."
      - name: authors
        description: "Author list (or originating org for protocols/industry systems)."
      - name: venue
        description: "Publication venue (conf/journal) or 'industry blog' / 'preprint'."
      - name: paper_url
        description: "Primary source URL (prefer arXiv abs / DOI / official spec)."
      - name: code_url
        description: "Repo / implementation URL if any."

  classification:
    description: "Where the item sits in the taxonomy."
    detail_level: 极简
    fields:
      - name: paradigm
        description: >
          One of: llm-debate / agent-framework / comm-protocol / emergent-language /
          game-theoretic-mediator / marl-mediator / llm-mediator / blackboard /
          stigmergy / learned-marl-comm / topology-learning / coevolution / survey.
      - name: era_lineage
        description: "classical-foundation / MARL-era / LLM-era (2023+) / cutting-edge (2025-26)."
      - name: cluster
        description: "Primary cluster A–H (see outline.yaml clusters)."

  core_mechanism:
    description: "How it works, in one line; the central design idea."
    detail_level: 简要
    fields:
      - name: core_mechanism
        description: "One-sentence description of the mechanism."
      - name: communication_topology
        description: >
          fully-connected / ring / star(mediator-centered) / hierarchical /
          graph-optimized / indirect-shared-medium / dynamic-per-query.
      - name: coordination_medium
        description: >
          direct-messaging / shared-message-pool / blackboard / ledger / state-object /
          handoff-token / environment-trace(pheromone) / shared-latent-memory / KV-cache / market.
      - name: information_shared
        description: "full-reasoning / summaries / votes / actions / abstract-signals / latent-vectors / typed-mutations."

  # ----------------------------------------------------------------------------  KEY axis
  mediation:
    description: "THE KEY category — the explicit mediator / information-filtering mechanism."
    detail_level: 详细
    fields:
      - name: mediation_and_information_filtering_mechanism
        description: >
          KEY. Is there an explicit mediator/filter? What information is
          selected / aggregated / routed / gated / summarized / suppressed, and by whom?
      - name: mediation_locus
        description: >
          Where filtering happens: none(full-broadcast) / orchestrator-manager-agent /
          handoff-boundary-filter / topology-pruning / dedicated-compression-model /
          shared-latent-memory / market-mechanism / blackboard-control-shell / environment-medium.
      - name: mediation_architecture
        description: "broker / registry / P2P-decentralized / host-mediated / distributed-directory / hub-and-spoke."
      - name: mediation_granularity
        description: "agent-level(who participates) / edge-level(who→whom) / message-level(what content) / token-level / context-level."
      - name: control_locus
        description: "centralized-controller / distributed-self-selection / broadcast-competition / emergent."
      - name: mediator_power
        description: "recommend-only / act-on-behalf-of / pay-or-contract / inform-only(signal) / route-and-gate."
      - name: information_loss_vs_fidelity
        description: "lossy-extractive-summary / lossless / representation-level(KV/hidden-state)."
      - name: error_vs_insight_propagation
        description: "Does it explicitly trade off suppressing error propagation against preserving beneficial insight?"

  aggregation_consensus:
    description: "Debate/ensemble-specific: how per-agent positions become a decision."
    detail_level: 简要
    fields:
      - name: aggregation_rule
        description: >
          majority-vote / confidence-weighted / judge-LLM / trajectory-score /
          opinion-pool+conformal / embedding-geometric / layered-aggregator.
      - name: judge_or_mediator_role
        description: "none / passive-extractor / active-moderator(selects speakers, sets topic) / weaker-than-debaters / third-party-reweighter."
      - name: judge_capability_relative_to_debaters
        description: "weak / equal / strong (central to scalable-oversight)."
      - name: agreement_modulation
        description: "none / contentiousness-knob / agreement-level-prompt / anti-conformity / disagree-or-commit."
      - name: confidence_signal_used
        description: "none / verbalized-confidence / token-logprob / semantic-entropy / uncertainty-estimate."
      - name: termination_criterion
        description: "fixed-rounds / consensus / importance-early-stop / SPRT(Wald) / KS-stability / adaptive-break."
      - name: failure_mode_addressed
        description: "sycophancy / conformity / hallucination-propagation(Woozle) / degeneration-of-thought / cognitive-islands / redundancy / prompt-injection."

  communication_efficiency:
    description: "Cost / bandwidth / compression — the 'is mediation worth it' axis."
    detail_level: 简要
    fields:
      - name: communication_medium
        description: "token / structured-message / hidden-state / KV-cache / latent-vector / economic-signal / pheromone-trace."
      - name: bandwidth_constraint
        description: "none / soft-penalty / hard-budget / scheduled-medium."
      - name: message_cost
        description: "Is comm penalized? auxiliary-loss / entropy-penalty / CMDP-constraint / return-gap-bound / token-$ term."
      - name: when_to_communicate_mechanism
        description: "always-on / learned-gate / event-trigger-threshold / scheduler / handshake."
      - name: whom_to_communicate_mechanism
        description: "broadcast / learned-targeting-attention / causal-inference-prior / graph-edge-pruning / scheduling."
      - name: message_compression_objective
        description: "IB min I(m;X)+max I(m;Y) / entropy-min / variance-control / contrastive-MI-max / clustering / none."
      - name: discrete_vs_continuous_message
        description: "discrete-tokens(interpretable, bit-budget) / continuous-vectors / typed-schema."
      - name: receiver_side_filtering
        description: "Is filtering at the receiver/aggregation step (vs sender side)?"
      - name: efficiency_evidence
        description: "Quantified token/cost/latency reduction with numbers (e.g. −90% tokens, 2.8× acc)."
      - name: context_isolation
        description: "shared-pool(all see all) vs isolated-windows-handing-back-summaries."

  game_theoretic:
    description: "Mediator / mechanism-design properties (Cluster D + theory)."
    detail_level: 简要
    fields:
      - name: incentive_compatibility_obedience
        description: "Are agents incentivized to follow recommendations? none / ex-post-IC / approximate / Lagrangian-soft."
      - name: commitment_assumption
        description: "ex-ante-commit(persuasion/info-design) / cheap-talk(no-commit) / emergent-via-reputation."
      - name: information_asymmetry
        description: "What the mediator knows: omniscient / report-dependent / observation-only."
      - name: voluntariness_participation
        description: "mandatory-routing vs voluntary-delegation (agents opt in)."
      - name: truthfulness
        description: "binding/verifiable(certification) / cheap-talk(non-binding) / payment-backed."
      - name: welfare_objective
        description: "social-welfare-max / fairness / sender-optimal / Pareto-improvement-constrained / task-accuracy."
      - name: theoretical_guarantees
        description: "convergence / equilibrium-class(CE/CCE/EFCE) / optimality / IB-bound / return-gap-bound / potential-game."
      - name: non_stationarity_handling
        description: "How it copes with agents adapting to the mediator (signaling-gradient / bi-level-RL / online-CV)."

  coordination_medium_detail:
    description: "Blackboard- & stigmergy-specific medium mechanics (Clusters E, F)."
    detail_level: 简要
    fields:
      - name: write_arbitration
        description: "Who may commit and in what order: scheduler / LLM-selector / deterministic-validator-kernel / baton-lock / focus-of-control."
      - name: read_selection_context_gating
        description: "How agents pick what subset of the medium to read (subscribe-by-profile / relevance-retrieval / factor-graph membership)."
      - name: conflict_resolution
        description: "Handling contradictory contributions (conflict-resolver agent / categorization / invariants)."
      - name: board_persistence_and_gc
        description: "append-only / mutable / compaction / cleaner-agent / STM-LTM bifurcation."
      - name: board_structure_typing
        description: "free-text / typed-schema-bound / leveled-abstraction-hierarchy."
      - name: auditability_provenance
        description: "Are contributions attributable / replayable / content-hashed?"
      - name: trace_persistence_and_decay
        description: "evaporation / TTL / half-life / permanent — the stale-info filter (pheromone decay)."
      - name: indirect_vs_direct_coordination
        description: "purely-trace-based(true stigmergy) vs hybrid(blackboard+scheduler) vs direct-messaging."
      - name: medium_modifiability_trace_type
        description: "sematectonic(work-product IS the signal) vs marker-based(separate deposited signals/pheromones)."
      - name: signal_granularity
        description: "quantitative(scalar intensity/gradient) vs qualitative(discrete typed signals)."
      - name: activation_mechanism
        description: "agent-polling(ReAct) / declarative-predicate-threshold / clock-tick / external-scheduler."
      - name: boundary_enforcement_governance
        description: "deterministic guard enforcing scope/identity/conflict/schema/provenance at the medium boundary."
      - name: convergence_dynamics
        description: "positive-feedback(amplification) + negative-feedback(evaporation); any formal guarantee."

  protocol_interop:
    description: "Standardized-protocol-specific dimensions (Cluster C)."
    detail_level: 简要
    fields:
      - name: interoperability_layer
        description: "tool-access(vertical) / agent-coordination(horizontal) / internet-discovery(global)."
      - name: discovery_mechanism
        description: "manual-static / Agent-Card(.well-known) / registry-API / DID+DHT / capability-based-semantic-query."
      - name: identity_trust_model
        description: "none/API-key / OAuth2-OIDC-mTLS / W3C-DIDs / verifiable-credentials / Sigstore / ZK-proofs."
      - name: security_threat_surface
        description: "prompt-injection-across-chains / registry-poisoning / auth-bypass / covert-channels / collusion."
      - name: human_interpretability_covertness
        description: "human-readable(standardized) vs covert/non-readable(emergent language) — transparency/governance risk."

  coevolution:
    description: "Adaptivity & co-evolution — the 'coevo' half of mediator-coevo."
    detail_level: 简要
    fields:
      - name: adaptivity
        description: "fixed / heuristic / learned-offline / query-adaptive / co-evolved."
      - name: adaptivity_timescale
        description: "per-query / test-time-online / offline-trained / continual; if co-evolved, the relative timescales of components."
      - name: topology_generator_class
        description: "hand-crafted / search(MCTS) / GNN-VGAE / graph-diffusion / RL-policy(QMIX/GRPO) / LLM-meta-designer."
      - name: learnability_of_mediator
        description: "fixed-hand-designed / learned-jointly-with-agents / learned-vs-best-responder(zero-sum) / co-evolved."
      - name: credit_assignment_mechanism
        description: "RL-advantage / economic-wealth / evolutionary-fitness / importance-score."
      - name: robustness_to_adversarial
        description: "Defends against malicious/erroneous/strategic messages? (pruning-as-defense, IB-robustness)."

  outcome:
    description: "Empirical results, scope, and limitations."
    detail_level: 详细
    fields:
      - name: tasks_domains
        description: "Benchmarks / application domains evaluated."
      - name: key_results
        description: "Headline quantitative findings (with the comparison baseline)."
      - name: limitations
        description: "Known weaknesses, failure modes, negative results, or caveats (incl. withdrawn/placeholder flags)."

  relevance:
    description: "Explicit linkage to the mediator-coevo project."
    detail_level: 详细
    fields:
      - name: relevance_to_mediator_coevo
        description: >
          What this implies for a co-evolving mediator that filters/routes/summarizes
          information between coevolving LLM agents. Why is it prior art, baseline, or contrast?
      - name: relevance_tier
        description: "core / strong / contextual (mirrors the tier in outline.yaml)."

# ------------------------------------------------------------------------------
uncertain:
  description: >
    Reserved fields whose values are best filled during deep research per item.
    Kept here so the deep phase knows to look for them.
  fields:
    - name: citation_count
      description: "Approx. citations (Semantic Scholar / Google Scholar) as an impact proxy — fill in deep phase."
    - name: most_relevant_5_flag
      description: "Boolean — is this among the items MOST critical to mediator-coevo? (agents flagged a top-5)."
    - name: cross_cluster_refs
      description: "Other clusters/items this overlaps with (it was surfaced by multiple agents)."
    - name: status_caveat
      description: "e.g. OpenReview-withdrawn / placeholder-model-name-in-abstract / merged-into-another-protocol — verify before citing."
    - name: medium_choice_for_coevo
      description: "If adopted, which mediation medium/locus would this suggest for the project's design."
