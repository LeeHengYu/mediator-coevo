# ============================================================================
# Research Outline — items + execution config
# Generated by /research (Step 1 internal framework + Step 2 Opus-4.8 supplement)
# ============================================================================

topic: "Graph-based & learned-similarity retrieval for task / skill / case transfer in (LLM) agents"
topic_slug: graph-similarity-task-retrieval
date: 2026-06-07

research_question: >
  How do you retrieve relevant prior tasks / skills / examples / cases by similarity —
  especially via graph structure and *learned* similarity metrics — to drive transfer,
  prompting, curriculum, and memory for (LLM) agents? Anchored to the mediator-coevo / OPD
  project: a mediator that retrieves similar tasks/skills/cases to steer agent coevolution.

subareas:
  A: "Task similarity & transferability estimation (which prior task helps which?)"
  B: "Nearest-neighbor / learned-retriever based in-context example (demonstration) selection"
  C: "Graph-based retrieval + LLM (GraphRAG, GNN+LLM, KG/subgraph retrieval, graph-structured memory)"
  D: "Curriculum / skill libraries / task-graphs / similarity-driven task selection for agents"
  E: "Case-based reasoning + agent experience / episodic memory retrieval"
  F: "Metric / representation-learning retrieval backbones (the retrieval substrate)"

# ----------------------------------------------------------------------------
execution:
  batch_size: 5            # concurrent deep-research agents
  items_per_agent: 1       # one Opus-4.8 dossier per item
  output_dir: ./results
  model: opus              # Opus 4.8, max reasoning effort
  external_tools:          # agents must lean hard on these
    - firecrawl            # firecrawl_search / firecrawl_scrape
    - exa                  # web_search_exa / web_fetch_exa
    - academic-search      # search_papers / explore_citations / search_by_author
  notes: >
    Disable task output streaming per /research-deep. Each agent verifies venue/year/authors
    via academic-search MCP before filling fields. Items flagged needs_verification are
    2025-late / 2026 preprints surfaced from primary arXiv listings — confirm existence,
    authors and venue first; if unverifiable, mark the item itself as uncertain in results.

# ----------------------------------------------------------------------------
