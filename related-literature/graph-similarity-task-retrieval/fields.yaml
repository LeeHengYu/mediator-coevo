# ============================================================================
# Field Definitions — what to fill for each item during /research-deep
# detail_level: minimal → brief → detailed (deep phase escalates as evidence allows)
# ============================================================================

topic_slug: graph-similarity-task-retrieval
date: 2026-06-07

# ----------------------------------------------------------------------------
# NOTE: top-level key is `field_categories` to match validate_json.py's contract.
field_categories:

  basic:
    description: "Identity and pointers."
    fields:
      - {name: name,        description: "Canonical name + aliases",        detail_level: minimal}
      - {name: year,        description: "Publication / preprint year",     detail_level: minimal}
      - {name: authors,     description: "Author list (verify via academic-search MCP)", detail_level: brief}
      - {name: venue,       description: "Conference/journal/preprint venue", detail_level: minimal}
      - {name: paper_url,   description: "Primary URL (arXiv/ACL/proceedings)", detail_level: minimal}
      - {name: code_url,    description: "Official code/repo if any",        detail_level: brief}

  positioning:
    description: "Where the work sits and what it solves."
    fields:
      - {name: subarea,           description: "A/B/C/D/E/F (+cross-cutting flags)", detail_level: minimal}
      - {name: problem_addressed, description: "The retrieval/transfer/selection problem it targets", detail_level: brief}
      - {name: key_idea,          description: "One-sentence core contribution", detail_level: brief}

  method_mechanics:
    description: "How retrieval / similarity actually works — the analytical core of this survey."
    fields:
      - {name: retrieval_mechanism, description: "How candidates are fetched: kNN/ANN, GNN message-passing, PageRank/spreading-activation, beam/path search, PCST/Steiner-tree, iterative/agentic traversal, sparse inverted-index, none", detail_level: detailed}
      - {name: similarity_metric,   description: "What 'similar' means: cosine, late-interaction MaxSim, FIM distance, OT/Wasserstein, Bhattacharyya, energy, graph-topology (distance/PageRank), DPP kernel, learned scorer", detail_level: detailed}
      - {name: representation,      description: "How the task/case/example/skill is encoded: text embedding, FIM, executable program/API, structured note, trajectory, subgraph, tree, multimodal", detail_level: detailed}
      - {name: graph_structure_used, description: "Whether/which graph is involved and its role (none / KG / passage-proximity / influence / execution-transition / heterogeneous / hypergraph / Zettelkasten links)", detail_level: detailed}
      - {name: learned_vs_fixed,    description: "Is the similarity metric/retriever LEARNED (and how trained) or fixed/heuristic/training-free?", detail_level: detailed}
      - {name: training_signal,     description: "Supervision source: frozen-LLM log-likelihood, RL reward from task success, contrastive pos/neg, knowledge distillation, proxy scores, none", detail_level: detailed}

  application:
    description: "Where it is used."
    fields:
      - {name: target_use,         description: "transfer / ICL prompting / RAG / curriculum / agent-memory / model-selection", detail_level: brief}
      - {name: modality,           description: "text / vision / multimodal / embodied / code / KG", detail_level: brief}
      - {name: llm_agent_relevance, description: "Direct relevance to LLM-agent settings", detail_level: brief}

  evaluation:
    description: "Evidence quality."
    fields:
      - {name: datasets_benchmarks, description: "Benchmarks evaluated on", detail_level: brief}
      - {name: key_results,         description: "Headline numbers vs baselines", detail_level: brief}
      - {name: baselines,           description: "What it is compared against", detail_level: brief}

  project_relevance:
    description: "Porting into OPD / mediated-coevolution task/skill/case retrieval (the reason for this survey)."
    fields:
      - {name: relevance_to_task_retrieval, description: "How it informs retrieving similar prior tasks/skills/cases to steer coevolution", detail_level: detailed}
      - {name: adaptable_components,        description: "Concrete pieces that could be ported/forked/wrapped", detail_level: detailed}
      - {name: limitations,                 description: "Weaknesses, failure modes, cost ceilings", detail_level: brief}

  connections:
    description: "Map within the field."
    fields:
      - {name: related_methods,        description: "Sibling/competing methods", detail_level: brief}
      - {name: builds_on_extended_by,  description: "Lineage: predecessors and successors", detail_level: brief}

  # ---- New cross-cutting dimensions surfaced by the Opus-4.8 supplement -----
  cross_cutting_dimensions:
    description: "Discriminating axes added from the Step-2 supplement; fill where applicable to the item's subarea."
    fields:
      # similarity & transferability (A/F)
      - {name: transferability_signal_type, description: "A/F: label-based vs embedding/feature-based vs fine-tuning-dynamics/evolution-based", detail_level: detailed}
      - {name: requires_target_labels,      description: "A: none / few-shot / full — can it retrieve before any target supervision (cold start)?", detail_level: brief}
      - {name: reference_or_anchor_task_used, description: "A: is similarity computed directly to target, or MEDIATED via a reference/anchor task? (maps to mediator-coevo)", detail_level: detailed}
      - {name: negative_transfer_awareness, description: "A/E: does it model/mitigate harmful (negative) transfer or retrieval noise?", detail_level: brief}
      - {name: label_set_handling,          description: "A: needs shared label space vs handles disjoint/partial labels (OTDD-family)", detail_level: brief}
      - {name: instruction_conditioned,     description: "F: are embeddings conditioned on a task instruction (task-aware) vs fixed?", detail_level: brief}
      - {name: embedding_pooling_strategy,  description: "F: mean / CLS / last-token / latent-attention / layer-mean", detail_level: brief}
      - {name: rank_correlation_metric_used, description: "A: weighted Kendall τw / Pearson / Spearman / top-k recall used to validate", detail_level: brief}
      - {name: adaptable_index_structure,   description: "C/F: single-vector ANN / multi-vector late-interaction / sparse inverted / nested (Matryoshka)", detail_level: brief}
      - {name: computational_cost,          description: "A/B/C/F: indexing & query cost, added params, wall-clock speedup", detail_level: brief}
      # demonstration selection (B)
      - {name: dependency_modeling,         description: "B: scores examples independently vs models inter-example / set-level dependency", detail_level: brief}
      - {name: ordering_permutation_handling, description: "B: none / heuristic / learned-sequential / search-based ordering", detail_level: brief}
      - {name: set_selection_objective,     description: "B: top-k similarity / MMR-diversity / submodular coverage / DPP / influence / RL portfolio", detail_level: brief}
      - {name: generalization_scope,        description: "B/D: transfer across unseen tasks / unseen inference LLMs / cross-lingual / cross-domain", detail_level: brief}
      - {name: query_transformation,        description: "B: query rewritten before retrieval (skill desc, CoT path, hypothetical doc) vs raw", detail_level: brief}
      - {name: example_granularity,         description: "B/D/E: input-output pair / full trajectory / sub-trajectory / state / abstracted insight / skill-API", detail_level: brief}
      # graph retrieval & memory (C)
      - {name: graph_construction_method,   description: "C: LLM open-IE triples / pre-existing KG / proximity graph / heterogeneous / hypergraph", detail_level: detailed}
      - {name: graph_granularity_node_types, description: "C: entity / chunk / community-summary / tree / mixed-heterogeneous nodes", detail_level: brief}
      - {name: retrieval_traversal_strategy, description: "C: one-shot / iterative-multihop / agentic-multiturn / PageRank / GNN / PCST / beam-path", detail_level: detailed}
      - {name: structure_vs_semantic_signal, description: "C: relevance from graph topology vs dense semantic vs learned fusion", detail_level: detailed}
      - {name: hybrid_retrieval_fusion,     description: "C: whether/how graph retrieval is combined with vector/BM25", detail_level: brief}
      - {name: interpretability_output,     description: "C: relation paths / reasoning chains / subgraph / community report / provenance", detail_level: brief}
      # memory / skill-library / curriculum (C/D/E)
      - {name: memory_role,                 description: "C/D/E: static knowledge index vs persistent writable agent memory", detail_level: brief}
      - {name: incremental_update_support,  description: "C/D/E: online graph/library update without full rebuild?", detail_level: brief}
      - {name: temporal_dynamics,           description: "C/E: time-valid edges / memory evolution / recency modeling", detail_level: brief}
      - {name: memory_lifecycle_operations, description: "D/E: which of Build/Add, Retrieve, Reuse/Adapt, Revise, Update, Forget, Retain (CBR 4R)", detail_level: detailed}
      - {name: case_or_skill_representation, description: "D/E: free-text / structured note / executable program-API / parameterized procedure / multimodal", detail_level: detailed}
      - {name: abstraction_level,           description: "D/E: raw instance vs induced routine vs hierarchical skill tree", detail_level: brief}
      - {name: transfer_scope_evaluated,    description: "D/E: in-domain / cross-task / cross-website / cross-domain / cross-agent (strong→weak)", detail_level: brief}
      - {name: verification_of_retrieved_item, description: "D/E: is a reused skill/case validated before use (program exec / self-verify / judge)?", detail_level: brief}
      - {name: parametric_vs_nonparametric_reuse, description: "D/E: in-context retrieval (no weight update) vs RL/SFT distillation vs latent memory", detail_level: brief}
      - {name: shared_vs_private_library,   description: "D: self-generated per-agent vs shared/community corpus across agents", detail_level: brief}
      # curriculum & coevolution (D) — project core
      - {name: task_proposal_mechanism,     description: "D: none / fixed-curriculum / LLM-proposed / adversarial-coevolution / learning-progress-gated", detail_level: detailed}
      - {name: difficulty_learning_gain_signal, description: "D: how a task is selected — uncertainty, edge-of-solvability (~50%), absolute advantage, novelty/diversity", detail_level: detailed}
      - {name: co_evolution_dynamics,       description: "D: do two+ components update against each other; how is collapse/instability mitigated? (mediator-coevo core)", detail_level: detailed}
      - {name: similarity_pitfalls,         description: "ALL: documented cases where similarity retrieval misleads (SkillGraph ordering, CTIM-Rover noise)", detail_level: brief}

# ----------------------------------------------------------------------------
# Uncertain / reserved fields — left blank in the outline; the deep phase
# auto-fills or drops them per item once evidence is gathered.
uncertain:
  - reproducibility_status        # is code runnable / results reproduced by third parties?
  - scalability_ceiling           # largest corpus/graph/task-count demonstrated
  - opd_integration_sketch        # concrete sketch of how to wire this into mediator-coevo (synthesized in deep phase)
  - citation_count                # pull at deep time via academic-search (volatile; do not hardcode now)
