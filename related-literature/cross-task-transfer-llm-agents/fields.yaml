# =============================================================================
# Field Definitions — Cross-Task Transfer & Generalization in LMs & LLM Agents
# =============================================================================
# Merges Step 1 internal framework with differentiation-axis fields recommended
# by all 4 Step-2 search agents (A-C / D+G / E / F+bench+survey).
# detail_level: 极简 (minimal) → 简要 (brief) → 详细 (detailed)
#   - 极简: one phrase / single value; always fill
#   - 简要: 1-2 sentences; fill in standard deep pass
#   - 详细: full paragraph w/ specifics; fill for high-priority items
# uncertain: reserved fields auto-filled during /research-deep when evidence found.
# =============================================================================

topic: "Cross-Task Transfer & Generalization in Language Models and LLM Agents"

field_categories:

  # ---------------------------------------------------------------------------
  基本信息:  # Basic info
    description: "Identification & provenance"
    fields:
      - name: name
        description: "Canonical name / title of the method, benchmark, or survey"
        detail_level: 极简
      - name: year
        description: "First public year (arXiv); note venue-publication year separately if different"
        detail_level: 极简
      - name: authors
        description: "Author list (abbreviated) + key institution(s)"
        detail_level: 极简
      - name: venue
        description: "Publication venue + year (and arXiv id if preprint-only)"
        detail_level: 极简
      - name: url
        description: "Primary paper URL (arXiv / ACL / proceedings)"
        detail_level: 极简
      - name: code_url
        description: "Open-source repo / project page if available"
        detail_level: 简要
      - name: item_type
        description: "method | benchmark | survey | both — classifies the entry's role"
        detail_level: 极简

  # ---------------------------------------------------------------------------
  问题定位:  # Problem framing
    description: "What transfer problem the work addresses and its setup"
    fields:
      - name: transfer_paradigm
        description: "multi-task tuning | meta-learning | prompt-transfer | ICL-mechanism | agent-experience-reuse | case-based-reasoning | transferability-prediction"
        detail_level: 极简
      - name: source_target_setup
        description: "How source knowledge and target task are defined (e.g., seen→unseen tasks, high-resource→low-resource, train tasks→test tasks)"
        detail_level: 简要
      - name: generalization_taxonomy
        description: "Which OPT-IML-style level(s): held-out instances within seen tasks / held-out tasks within seen categories / fully held-out categories. (Sharper than a single generalization_target.)"
        detail_level: 简要
      - name: domain
        description: "NLP | agent (web/GUI/embodied/tool-use) | code | multimodal | RL | robotics"
        detail_level: 极简
      - name: problem_motivation
        description: "Core problem the work targets and why existing approaches fall short"
        detail_level: 详细

  # ---------------------------------------------------------------------------
  技术方法:  # Technical method
    description: "Core mechanism and how knowledge is carried & adapted"
    fields:
      - name: core_mechanism
        description: "One-paragraph description of how the method works"
        detail_level: 详细
      - name: knowledge_carrier
        description: "What carries the transferable knowledge — weights | soft-prompts | demonstrations | skill-library | memory | task/function-vectors | rules/manuals | thought-templates | logical-forms"
        detail_level: 极简
      - name: carrier_locus
        description: "Where the transferable representation lives — activation/hidden-state | weight-space | soft-prompt/parameter-space | external-memory/text. (Sub-types knowledge_carrier; key for comparing D/G carriers.)"
        detail_level: 简要
      - name: skill_representation
        description: "For skill/memory systems: natural-language | structured-rule | pseudocode | executable-code-API | finite-automaton-pipeline | soft-prompt. (The NL-vs-code axis: AWM/AutoGuide NL vs ASI/SkillWeaver code.)"
        detail_level: 简要
      - name: knowledge_granularity
        description: "Unit stored/reused — raw trajectory | success-only routine | contrastive(success+failure) insight | reasoning strategy | state-conditional guideline | rule | executable skill. (Single biggest differentiator, e.g. ReasoningBank vs AWM.)"
        detail_level: 简要
      - name: abstraction_level
        description: "Abstraction degree of the reused unit — raw trajectory | abstracted workflow | high-level insight rule | programmatic skill | thought-template"
        detail_level: 简要
      - name: adaptation_mechanism
        description: "How source knowledge lands on target — gradient-based (MAML) | in-context no-update (MetaICL/ICT) | prompt-init transfer (SPoT/PANDA) | retrieve-and-compose (ATTEMPT/TPT) | activation steering"
        detail_level: 简要
      - name: parameter_update
        description: "weight-frozen (memory/prompt only) | RL/SFT fine-tuned | hybrid. (Cleanly splits frozen ReasoningBank/AgentFly/Memp from GRPO SEAgent/SAGE — central to skill-learning-without-fine-tuning.)"
        detail_level: 极简
      - name: memory_lifecycle_operations
        description: "Which of {build/induce, retrieve, update, refine, prune/deprecate, consolidate} are supported. (Active update/prune vs append-only memory.)"
        detail_level: 简要
      - name: retrieval_mechanism
        description: "semantic embedding | LLM-as-retriever | hybrid | program/structural matching | no-retrieval self-generation"
        detail_level: 简要
      - name: verification_mechanism
        description: "How reused knowledge/skills are validated — none | self-reflection | program execution | test cases | typed-contract verifier"
        detail_level: 简要
      - name: cbr_cycle_coverage
        description: "(CBR items) Which of CBR's 4Rs — Retrieve / Reuse / Revise / Retain. Separates retrieve-only from adaptation/retain."
        detail_level: 简要
      - name: training_strategy
        description: "Pretraining/finetuning/meta-training recipe; data scale & composition"
        detail_level: 简要
      - name: inference_strategy
        description: "Test-time procedure (zero/few-shot, retrieval, steering, test-time scaling)"
        detail_level: 简要
      - name: base_model
        description: "Backbone model(s) used (e.g., T5, GPT-4, Llama-3, Gemma-2, Qwen)"
        detail_level: 极简
      - name: base_model_paradigm
        description: "encoder-decoder (T5/T0) | decoder-only (GPT/Llama) | encoder-only (RoBERTa) — affects prompt/soft-prompt transfer effectiveness"
        detail_level: 极简
      - name: mechanism_type
        description: "(D items) Explanatory lens — induction-head | task/function-vector | mesa-optimizer/implicit-GD | Bayesian-inference/posterior-sampling | task-recognition-vs-task-learning | kernel-regression"
        detail_level: 简要
      - name: transferability_predictor_type
        description: "(G items) Signal that predicts source→target benefit — gradient/Fisher embedding | PEFT-parameter embedding | connectivity/sparse-mask | text/data similarity | pairwise-transfer graph | token-wise similarity | OT/Wasserstein | task-encoding quality"
        detail_level: 简要

  # ---------------------------------------------------------------------------
  评测:  # Evaluation
    description: "Benchmarks, metrics, results, baselines"
    fields:
      - name: benchmarks
        description: "Evaluation benchmarks/datasets used"
        detail_level: 简要
      - name: metrics
        description: "Primary metrics (success rate, accuracy, regret, pass^k, tokens, steps)"
        detail_level: 简要
      - name: key_results
        description: "Headline quantitative results vs baselines (with numbers)"
        detail_level: 详细
      - name: baselines
        description: "What it is compared against"
        detail_level: 简要
      - name: transfer_axis_tested
        description: "Which transfer axis was EMPIRICALLY evaluated — cross-task | cross-website | cross-domain | cross-model-scale | cross-model-family | cross-agent | OOD | temporal-continual. (Many claim generalization; few test each axis — Trace2Skill/PolySkill notable.)"
        detail_level: 简要
      - name: strong_to_weak_transfer
        description: "Can skills/memory built by a strong model boost a weaker model? (Selling point of Memp/Trace2Skill/SkillWeaver.)"
        detail_level: 简要
      - name: benchmark_type
        description: "(benchmark items) cross-task NLP | agentic-interactive | tool-use | web-navigation | embodied | capability-diagnostic; + whether seen/unseen splits standardized"
        detail_level: 简要

  # ---------------------------------------------------------------------------
  分析:  # Analysis
    description: "Strengths, limitations, efficiency, failure modes"
    fields:
      - name: strengths
        description: "Key advantages / what it does better than prior work"
        detail_level: 简要
      - name: limitations
        description: "Stated/observed limitations"
        detail_level: 简要
      - name: failure_modes
        description: "Sharp known failure modes — e.g., task vectors fail on high-rank mappings; global task vector absent for some tasks; transient OOD generalization needing early stopping; negative transfer"
        detail_level: 简要
      - name: scalability
        description: "How it scales w/ model size, #tasks, library size"
        detail_level: 简要
      - name: library_scaling_mechanism
        description: "(skill-library items) How a growing/large library is handled — retrieval method, dependency handling, context-budgeting, maintenance. (GoS/SkillOps/Skill-Drift/SaP center on this.)"
        detail_level: 简要
      - name: data_compute_efficiency
        description: "Data/compute/parameter efficiency (e.g., % params tuned, selection-cost reduction vs brute-force, token/step savings)"
        detail_level: 简要
      - name: composability
        description: "Can stored skills/vectors be composed/nested into higher-level units? (FV/ICV arithmetic; ASI/PolySkill/Odyssey compositional skills.)"
        detail_level: 简要
      - name: learns_from_failure
        description: "Does it distill from FAILED trajectories, not only successes? (ReasoningBank/AutoGuide/AgentFly/SEAgent vs success-only Voyager/AWM.) Increasingly emphasized robustness axis."
        detail_level: 极简
      - name: task_diversity_role
        description: "(A/B items) Stance & evidence on 'number of tasks vs task diversity' (MUPPET ~15-task critical point; Only-IF cross-domain diversity)."
        detail_level: 简要
      - name: negative_transfer_handling
        description: "Whether source-target mismatch / negative transfer is measured or mitigated (PANDA transferability metric + KD; SPoT similarity retrieval)."
        detail_level: 简要

  # ---------------------------------------------------------------------------
  关系:  # Relations
    description: "Lineage and bridge to agent skill-learning (the report's throughline)"
    fields:
      - name: builds_on
        description: "Predecessor work it extends"
        detail_level: 简要
      - name: followups
        description: "Notable works that build on it"
        detail_level: 简要
      - name: relation_to_CBR
        description: "Relationship to classic CBR — explicit CBR | implicit case reuse | non-CBR but functionally equivalent. (Unifies ExpeL/AWM/Synapse under the case-reuse lens.)"
        detail_level: 简要
      - name: relation_to_agent_skill_learning
        description: "KEY BRIDGE FIELD. How this informs LLM-agent skill/experience reuse and specifically mediator-coevo / OPD agent-skill-learning design (e.g., portable SKILL.md artifacts, skill-library maintenance, failure-aware distillation)."
        detail_level: 详细
      - name: shareability_across_agents
        description: "Are skills exportable/auditable/shareable artifacts vs model-internal? (CASCADE/SkillWeaver/SkillOps 'agent skills as portable SKILL.md' — directly bridges multi-agent skill-learning.)"
        detail_level: 简要
      - name: relation_to_test_time_scaling
        description: "Whether experience reuse is coupled with test-time scaling / compute allocation (ReasoningBank+MaTTS)."
        detail_level: 简要

  # ---------------------------------------------------------------------------
  survey_specific:  # Only for SURVEY items
    description: "Fields specific to survey entries"
    fields:
      - name: survey_taxonomy_axes
        description: "Core classification axes the survey uses (e.g., self-evolving what/when/how/where; memory object/form/time)"
        detail_level: 简要
      - name: survey_coverage_scope
        description: "What the survey covers and notable gaps it identifies"
        detail_level: 简要

# =============================================================================
# Uncertain fields — reserved; auto-filled during /research-deep when evidence found
# =============================================================================
uncertain:
  - name: reproducibility
    description: "Is the work reproducible? Released code/data/configs, reported seeds, independent replications"
    detail_level: 简要
  - name: open_source
    description: "License + completeness of released artifacts (code, weights, skill libraries, benchmark data)"
    detail_level: 简要
  - name: compute_cost
    description: "Training + inference compute cost (GPU-hours, $ estimate, #LLM calls, token budget)"
    detail_level: 简要
  - name: adoption_citations
    description: "Citation count + notable adoption/extensions (signals influence; verify for 2025-2026 preprints)"
    detail_level: 简要
  - name: localization
    description: "(D items) Layer depth / specific heads where task representation is encoded (early vs late layers, OV circuits, key heads)"
    detail_level: 简要
  - name: causal_evidence_method
    description: "(D items) How mechanistic claim is validated — activation patching/causal mediation | head ablation | steering/injection | training-dynamics | theoretical proof"
    detail_level: 简要
  - name: evidence_setting
    description: "(D items) Synthetic from-scratch transformers vs pretrained LLMs at scale (and which models). Gates external validity."
    detail_level: 简要
  - name: prediction_cost_vs_bruteforce
    description: "(G items) Compute/storage savings of the transferability predictor vs exhaustive source-target fine-tuning (e.g., ESM 10–278x)"
    detail_level: 简要
