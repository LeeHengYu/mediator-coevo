# Framing: BRIDGE-TO-AGENT-SKILL-LEARNING — the classic NLP transfer-learning
# lineage (A/B/C/D/G) is framed as foundations for modern LLM-agent experience /
# skill reuse (E/F), informing mediator-coevo / OPD agent skill-learning design.
# Time emphasis: 2024-present (foundational seeds retained).
