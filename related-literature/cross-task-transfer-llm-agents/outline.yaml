# =============================================================================

topic: "Cross-Task Transfer & Generalization in Language Models and LLM Agents"
topic_slug: cross-task-transfer-llm-agents
date_generated: "2026-06-07"
framing: bridge-to-agent-skill-learning
time_emphasis: "2024-present (foundational seeds retained)"

clusters:
  A: "Training-time cross-task generalization (instruction / multi-task tuning)"
  B: "Meta-learning for language models"
  C: "Prompt / soft-prompt transfer"
  D: "In-context learning mechanism & cross-task ICL (why/how transfer works)"
  E: "LLM agents: experience reuse & skill libraries (CORE bridge cluster)"
  F: "Case-based reasoning & memory-augmented transfer"
  G: "Task representation & transferability prediction"
  BENCH: "Benchmarks for cross-task generalization & agent transfer"
  SURVEY: "Surveys (cross-task transfer, agent memory, lifelong/self-evolving)"

execution:
  batch_size: 4              # max parallel deep-research agents (steady)
  items_per_agent: 3         # deep — ~43 agents over ~11 waves, max per-item verification
  model: opus                # Opus 4.8, max reasoning
  tools: [academic-search-mcp, exa, firecrawl]
  output_dir: ./results
  disable_task_output: true  # per research-deep skill

