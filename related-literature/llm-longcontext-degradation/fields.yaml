# =============================================================================
# Field Definitions — LLM Long-Context Performance Degradation
# =============================================================================
# Merges the Step-1 framework with fields recommended by 4 Opus-4.8 supplement
# agents. detail_level layers each field: 极简 (one phrase) → 简要 (1-2 sentences)
# → 详细 (full paragraph w/ numbers). The deep phase fills to the level the
# source supports; values that cannot be verified against the PRIMARY source go
# to `uncertain` (never fabricated).
#
# Not every field applies to every item. `applies_to` lists the categories
# (A=foundational, B=benchmark, C=mechanism/mitigation, D=frontier) where a
# field is expected; agents skip non-applicable fields rather than guessing.
# =============================================================================

topic: "LLM Long-Context Performance Degradation"

# NOTE: key is `field_categories` (consumed by validate_json.py to measure
# per-item field coverage). detail_level is a string layer (极简/简要/详细);
# no field is hard-`required`, so validation passes on required-coverage while
# the deep phase aims to fill as many as the source supports.
field_categories:

  # ---------------------------------------------------------------------------
  basic:
    description: "Identity & provenance — fill for every item."
    fields:
      - name: name
        description: "Canonical title (paper / benchmark / report)."
        detail_level: 极简
        applies_to: [A, B, C, D]
      - name: authors
        description: "Author list (or org for industry/blog items)."
        detail_level: 简要
        applies_to: [A, B, C, D]
      - name: year
        description: "Publication / release year."
        detail_level: 极简
        applies_to: [A, B, C, D]
      - name: venue
        description: "Conference/journal, or 'arXiv preprint' / 'industry report' / 'blog' / 'leaderboard' / 'dataset'."
        detail_level: 简要
        applies_to: [A, B, C, D]
      - name: url
        description: "Primary source URL (arXiv/DOI/GitHub/official page). Used for adversarial verification."
        detail_level: 极简
        applies_to: [A, B, C, D]
      - name: source_type
        description: "Provenance for weighting claims: paper (peer-reviewed) / preprint / industry_report / blog / leaderboard / dataset. CRITICAL for category D which mixes provenance."
        detail_level: 极简
        applies_to: [A, B, C, D]
        origin: "agent: 2025-frontier"
      - name: type
        description: "Role in the literature: phenomenon / benchmark / mechanism / mitigation / survey / leaderboard."
        detail_level: 极简
        applies_to: [A, B, C, D]
      - name: influence_citations
        description: "Approx citation count or qualitative influence (cite source & as-of date; ages fast)."
        detail_level: 简要
        applies_to: [A, B, C, D]

  # ---------------------------------------------------------------------------
  core_findings:
    description: "What the work claims about degradation."
    fields:
      - name: phenomenon_described
        description: "The degradation phenomenon documented (e.g., U-shaped positional bias, length-only decay, distractor interference, multi-turn unreliability)."
        detail_level: 简要
        applies_to: [A, B, C, D]
      - name: key_finding
        description: "Headline result, with the most important number(s) (verified against primary source)."
        detail_level: 详细
        applies_to: [A, B, C, D]
      - name: hypothesized_mechanism
        description: "Posited cause (attention sink, over-squashing, recency bias, RoPE OOD, retrieval-head sparsity, intent mismatch, thinking-length collapse, facts exhaustion)."
        detail_level: 详细
        applies_to: [A, C, D]
      - name: failure_mode_taxonomy
        description: "Tag against named modes: context distraction / poisoning / confusion / clash (Breunig); under-thinking / thinking-length-collapse (NeedleBench, MNIAH-R); unreliability-vs-aptitude (Lost in Conversation); facts-exhaustion. Enables cross-item synthesis."
        detail_level: 简要
        applies_to: [A, C, D]
        origin: "agent: 2025-frontier"

  # ---------------------------------------------------------------------------
  methodology:
    description: "How the work was conducted / what it tests."
    fields:
      - name: models_evaluated
        description: "Models tested (name + generation)."
        detail_level: 简要
        applies_to: [A, B, C, D]
      - name: model_generation
        description: "Model ERA evaluated (GPT-4o-class / GPT-4.1–4.5 / GPT-5.x; Gemini 1.5 / 2.x / 3; Claude 3.5–3.7 / 4.x; Llama-4; Qwen3; DeepSeek-R1/V3/V4). Separates aging evidence from current-frontier."
        detail_level: 简要
        applies_to: [A, B, D]
        origin: "agent: 2025-frontier"
      - name: reasoning_vs_base
        description: "Whether reasoning / extended-thinking models (o1/o3, R1, Claude-thinking, QwQ) are isolated vs base/instruct. Many 2025 papers show reasoning helps but doesn't eliminate decay."
        detail_level: 简要
        applies_to: [A, B, D]
        origin: "agent: 2025-frontier"
      - name: task_or_benchmark
        description: "Task(s)/benchmark(s) used."
        detail_level: 简要
        applies_to: [A, B, C, D]
      - name: context_lengths_tested
        description: "Range of input lengths probed (e.g., 1K–128K; 4K–1M; up to 8M)."
        detail_level: 简要
        applies_to: [A, B, C, D]
      - name: degradation_metric
        description: "How degradation is measured (accuracy@length, recall, F1, AUC@length, % drop vs short baseline)."
        detail_level: 简要
        applies_to: [A, B, C, D]
      - name: context_distribution
        description: "Contiguous single-prompt / multi-document / multi-turn-sharded (Laban et al.) / agentic-history. Multi-turn is a distinct emerging axis."
        detail_level: 简要
        applies_to: [A, B, C, D]
        origin: "agent: foundational"
      - name: agentic_vs_single_turn
        description: "single-prompt long input / multi-turn conversation / agentic tool-loop. Agentic degradation is distinct from single-prompt NIAH decay."
        detail_level: 极简
        applies_to: [A, B, D]
        origin: "agent: 2025-frontier"

  # ---------------------------------------------------------------------------
  analysis:
    description: "Quantitative & structural characterization of the degradation."
    fields:
      - name: degradation_pattern
        description: "Shape of accuracy-vs-length: U-shape / monotonic decay / threshold-cliff / inverted-U (RAG #chunks). With onset point if stated."
        detail_level: 详细
        applies_to: [A, B, C, D]
      - name: degradation_curve_shape
        description: "Benchmark-reported curve (gentle decay / sharp cliff / threshold collapse). Lets the survey compare quantitative patterns across benchmarks."
        detail_level: 简要
        applies_to: [B]
        origin: "agent: benchmarks"
      - name: aggravating_factors
        description: "What worsens degradation: position, distractor count/type, needle-question dissimilarity, #needles, hop count, turn count, #tools."
        detail_level: 详细
        applies_to: [A, B, C, D]
      - name: degradation_onset_length
        description: "Length where degradation begins, ABSOLUTE and RELATIVE-to-window (e.g., '32K, ~50% of window'). Captures the recurring 'effective ≈ ½ claimed' finding (STRING, NoLiMa, RULER)."
        detail_level: 简要
        applies_to: [A, B, D]
        origin: "agent: foundational"
      - name: effective_vs_advertised_gap
        description: "Quantified gap between claimed window and length where quality holds (e.g., '1M advertised, ~16–64k effective'; '30–60 pt drop 200K→1M'). Recurring 2025-2026 headline metric."
        detail_level: 简要
        applies_to: [B, D]
        origin: "agent: 2025-frontier"
      - name: distractor_type_noise_taxonomy
        description: "Noise studied: random vs hard/semantically-related vs counterfactual/conflicting vs whitespace/length-only padding. Different types → opposite conclusions (Power of Noise, Wu, RGB, Du)."
        detail_level: 简要
        applies_to: [A, C]
        origin: "agent: foundational"
      - name: needle_type_retrieval_difficulty
        description: "lexical-match NIAH / semantic-latent (NoLiMa, Context Rot) / multi-needle / multi-hop threading (MRCR, NeedleChain). Degradation magnitude depends heavily on this."
        detail_level: 简要
        applies_to: [A, B, D]
        origin: "agent: 2025-frontier"
      - name: needle_question_similarity
        description: "Whether degradation is conditioned on needle-question lexical/semantic similarity (Context Rot & NoLiMa: lower similarity → faster decay). Distinct from position."
        detail_level: 简要
        applies_to: [A, B, D]
        origin: "agent: foundational"
      - name: retrieval_vs_reasoning_isolation
        description: "Whether the work disentangles retrieval failure from reasoning/length failure (Du et al. mask tokens; NoLiMa removes lexical shortcuts). Central methodological dividing line."
        detail_level: 简要
        applies_to: [A, C, D]
        origin: "agent: foundational"

  # ---------------------------------------------------------------------------
  mitigation:
    description: "If the work proposes a fix — how/where it intervenes. (Mainly C; some A/D.)"
    fields:
      - name: mitigation_proposed
        description: "The fix proposed, if any (else 'diagnostic-only')."
        detail_level: 简要
        applies_to: [A, C, D]
      - name: mitigation_type
        description: "training-free/inference-time vs training-based/fine-tuning vs architectural vs data-centric vs prompting vs agent-delegation. Single most useful axis for category C."
        detail_level: 简要
        applies_to: [A, C, D]
        origin: "agent: mechanisms"
      - name: where_in_pipeline
        description: "Intervention point: pre/continued-pretraining / fine-tuning / prompt construction (compression, reordering) / prefill / decoding-KV-management / positional-encoding layer / attention-logit intervention / agent context-engineering."
        detail_level: 简要
        applies_to: [C, D]
        origin: "agent: mechanisms"
      - name: mechanism_targeted
        description: "Specific cause the fix addresses: attention sink / massive activation / U-shaped or recency bias / over-squashing / RoPE OOD / KV-cache memory / distractor interference / lexical-vs-latent matching. Lets you cross-tabulate mechanism × mitigation."
        detail_level: 简要
        applies_to: [C]
        origin: "agent: mechanisms"
      - name: compute_overhead
        description: "Direction + magnitude of cost change: reduces (compression/KV-eviction: '22x decode speedup') or adds (auxiliary compressor, calibration passes, re-decoding)."
        detail_level: 简要
        applies_to: [C]
        origin: "agent: mechanisms"
      - name: requires_model_internals
        description: "Needs attention-map/hidden-state access (PASTA, ZeroTuning, Found-in-Middle, H2O, SnapKV) vs black-box/API-only (LLMLingua, Self-Route). Determines applicability to closed models."
        detail_level: 极简
        applies_to: [C]
        origin: "agent: mechanisms"

  # ---------------------------------------------------------------------------
  benchmark_specific:
    description: "Dimensions only meaningful for benchmark items (category B)."
    fields:
      - name: task_taxonomy
        description: "Sub-tasks defined: retrieval / multi-hop tracing / aggregation / QA / summarization / generation / ICL / code."
        detail_level: 简要
        applies_to: [B]
        origin: "agent: benchmarks"
      - name: synthetic_vs_realistic
        description: "Synthetic (NIAH, RULER, HashHop, BABILong) vs naturalistic (LongBench, Loong, NoCha, SummHay). HELMET's key finding: synthetic ≠ predictive of realistic."
        detail_level: 极简
        applies_to: [B]
        origin: "agent: benchmarks"
      - name: max_context_length
        description: "Maximum tested length (32K / 128K / 256K / 1M / 2M / 8M / 100M+)."
        detail_level: 极简
        applies_to: [B]
        origin: "agent: benchmarks"
      - name: length_controllability
        description: "Can it generate cases at arbitrary/parametric lengths (RULER, BABILong, Ada-LEval, Counting-Stars) vs fixed-length corpora (LongBench, L-Eval)? Determines reusability."
        detail_level: 极简
        applies_to: [B]
        origin: "agent: benchmarks"
      - name: shortcut_resistance
        description: "Whether it suppresses literal needle-question matching / other shortcuts (NoLiMa, HashHop, LV-Eval, MLRBench). Key for distinguishing reasoning from surface retrieval."
        detail_level: 简要
        applies_to: [B]
        origin: "agent: benchmarks"
      - name: leakage_mitigation
        description: "Measures vs training-data contamination (post-cutoff docs, synthetic-only, keyword replacement): LooGLE, LV-Eval, NoCha, MLRBench."
        detail_level: 极简
        applies_to: [B]
        origin: "agent: benchmarks"
      - name: output_type
        description: "Short-span retrieval / multiple-choice / long-form generation. Separates input-comprehension (NIAH, RULER) from output-generation (LongProc, LongGenBench, SummHay)."
        detail_level: 极简
        applies_to: [B]
        origin: "agent: benchmarks"
      - name: evaluation_metric_type
        description: "Rule-based/exact-match / n-gram (ROUGE/F1) / LLM-as-judge / recall-of-citations. HELMET & L-Eval: n-gram correlates poorly with humans."
        detail_level: 简要
        applies_to: [B]
        origin: "agent: benchmarks"
      - name: needle_count
        description: "single-needle / multi-needle / all-context-relevant (Loong, NeedleChain). Multi-evidence aggregation difficulty axis."
        detail_level: 极简
        applies_to: [B]
        origin: "agent: benchmarks"
      - name: position_sensitivity_reported
        description: "Whether depth/position curves are reported (NIAH heatmaps, Counting-Stars, Context Rot). Ties benchmark to the lost-in-the-middle phenomenon."
        detail_level: 极简
        applies_to: [B]
        origin: "agent: benchmarks"
      - name: public_leaderboard_live
        description: "Maintained live leaderboard? (ZeroSCROLLS, LongBench, RULER, Fiction.liveBench, HELMET, Context Arena). Affects ongoing relevance."
        detail_level: 极简
        applies_to: [B, D]
        origin: "agent: benchmarks"
      - name: modality
        description: "text-only / multimodal-document / code / audio. Needed once MMLongBench-Doc, RepoQA in scope."
        detail_level: 极简
        applies_to: [B]
        origin: "agent: benchmarks"

  # ---------------------------------------------------------------------------
  meta:
    description: "Cross-cutting positioning & evidence quality."
    fields:
      - name: model_class_coverage
        description: "Whether base/instruct, position-extended (RoPE/YaRN/ALiBi), and reasoning/CoT models are separately evaluated. Several 2025 papers test whether reasoning models escape the phenomenon (they don't)."
        detail_level: 简要
        applies_to: [A, B, C, D]
        origin: "agent: foundational"
      - name: mechanism_evidence_level
        description: "Mechanism hypothesized / correlationally probed (attention weights, entropy) / causally tested (token masking, position scaling, channel ablation). Distinguishes behavioral from causal claims."
        detail_level: 简要
        applies_to: [A, C]
        origin: "agent: foundational"
      - name: limitations
        description: "Stated limitations / scope caveats / threats to validity."
        detail_level: 简要
        applies_to: [A, B, C, D]
      - name: relation_to_other_works
        description: "How it extends/contradicts/complements other items (use item ids, e.g., 'extends A1; contradicted by A12')."
        detail_level: 简要
        applies_to: [A, B, C, D]
      - name: relevance_to_mediator_coevo
        description: "OPTIONAL — relevance to this repo's mediator/coevolution work (esp. D6 Mediator-Assistant, D7 MT-OSC, A10 Lost-in-Conversation, D16 agentic failure taxonomy). Note any directly-usable design lesson."
        detail_level: 简要
        applies_to: [A, C, D]
        origin: "user-context (mediator-coevo repo)"

# -----------------------------------------------------------------------------
# Uncertain fields — RESERVED. Deep phase fills these per-item when the primary
# source supports them; otherwise left blank (NEVER fabricated). Adversarial
# verification: each value must be traceable to a quote/figure/table in the
# primary source.
# -----------------------------------------------------------------------------
uncertain:
  - name: exact_effect_sizes
    description: "Precise % drops / accuracy deltas at specific lengths, verbatim from tables/figures."
  - name: reproduction_status
    description: "Whether results have been independently reproduced / contested (and by whom)."
  - name: exact_numbers
    description: "Specific benchmark scores, citation counts (as-of date), context-length thresholds — only if confirmed against the source."
  - name: contested_claims
    description: "Claims later challenged or qualified by subsequent work (link the challenger item)."

# -----------------------------------------------------------------------------
detail_level_legend:
  极简: "One phrase / single value — minimum viable."
  简要: "1–2 sentences with the key specifics."
  详细: "Full paragraph including verified numbers, conditions, and caveats."

verification_protocol:
  - "Each deep-phase agent FETCHES the primary `url` (firecrawl/exa) before recording analysis/findings."
  - "Every number in key_finding / exact_* must be traceable to a quote, table, or figure in that source."
  - "Unverifiable or second-hand values → `uncertain`, never invented."
  - "Industry/blog/leaderboard items (source_type ≠ paper/preprint): flag claims as non-peer-reviewed; prefer corroboration by a second source."
