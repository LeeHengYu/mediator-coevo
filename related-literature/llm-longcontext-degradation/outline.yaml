    authors: "An, Zhang, Chen, Lin, et al."
    year: 2024
    venue: "ICLR 2025"
    url: "https://arxiv.org/abs/2410.18745"
    note: "Effective length << claimed length; shifted RoPE position (training-free) mitigation."
  - id: A7
    name: "The Power of Noise: Retrieval-Augmented Generation under hard negatives"
    authors: "Cuconasu, Trappolini, Siciliano, et al."
    year: 2024
    venue: "SIGIR 2024"
    url: "https://arxiv.org/abs/2401.14887"
    note: "Hard negatives hurt; random noise can paradoxically help. Retrieval-noise foundation (~398 cites)."
  - id: A8
    name: "Long-context LLMs Struggle with Long In-context Learning (LongICLBench)"
    authors: "Li, Zhang, Do, Yue, Chen"
    year: 2025
    venue: "TMLR 2025"
    url: "https://arxiv.org/abs/2404.02060"
    note: "Extreme-label-space ICL collapses as demonstration set lengthens."
  - id: A9
    name: "Context Length Alone Hurts LLM Performance Despite Perfect Retrieval"
    authors: "Du, Tian, Ronanki, Rongali, Bodapati, Galstyan, Wells, Schwartz, Huerta, Peng"
    year: 2025
    venue: "EMNLP 2025 Findings"
    url: "https://arxiv.org/abs/2510.05381"
    note: "13.9–85% drop with length EVEN with perfect retrieval (irrelevant tokens masked/whitespaced). Cleanly isolates length effect from distraction. Recite-then-solve mitigation."
  - id: A10
    name: "LLMs Get Lost in Multi-Turn Conversation"
    authors: "Laban, Hayashi, Zhou, Neville (MSR / Salesforce)"
    year: 2025
    venue: "arXiv (200k+ simulated conversations)"
    url: "https://arxiv.org/abs/2505.06120"
    note: "Avg 39% single→multi-turn drop; aptitude-loss + large unreliability-increase. 'When LLMs take a wrong turn, they get lost.' Sharded-context foundation (~286 cites)."
  - id: A11
    name: "Distance between Relevant Information Pieces Causes Bias (LongPiBench)"
    authors: "Tian, Li, Fu, Deng, Luo, Qian, Wang, Cong, Zhang, et al."
    year: 2024
    venue: "arXiv"
    url: "https://arxiv.org/abs/2410.14641"
    note: "Extends lost-in-the-middle to MULTIPLE relevant pieces; bias driven by spacing between them."
  - id: A12
    name: "Positional Biases Shift as Inputs Approach Context Window Limits"
    authors: "Veseli, Chibane, Toneva, Koller"
    year: 2025
    venue: "arXiv"
    url: "https://arxiv.org/abs/2508.07479"
    note: "Reframes LiM by RELATIVE length: U-shape only to ~50% of window, then recency bias dominates."
  - id: A13
    name: "Benchmarking LLMs in Retrieval-Augmented Generation (RGB)"
    authors: "Chen, Lin, Han, Sun"
    year: 2024
    venue: "AAAI 2024"
    url: "https://arxiv.org/abs/2309.01431"
