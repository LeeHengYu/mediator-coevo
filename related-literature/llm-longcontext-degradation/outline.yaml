  - id: A5
    name: "Make Your LLM Fully Utilize the Context (FILM / IN2 training)"
    authors: "An, Ma, Lin, Chen, Gong, et al."
    year: 2024
    venue: "NeurIPS 2024"
    url: "https://arxiv.org/abs/2404.16811"
