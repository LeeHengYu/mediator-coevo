  # --- D.a Reasoning-model long-context degradation ---
  - id: D1
    name: "Context Rot: How Increasing Input Tokens Impacts LLM Performance"
    authors: "Hong, Troynikov, et al. (Chroma)"
    year: 2025
    venue: "Industry technical report"
    url: "https://www.trychroma.com/research/context-rot"
    source_type: "industry_report"
    note: "ANCHOR of category D. 18 LLMs; semantic (non-lexical) needles; non-uniform decay even on trivial tasks; lower needle-question similarity → faster decay. Code: github.com/chroma-core/context-rot"
  - id: D2
    name: "Reasoning on Multiple Needles In A Haystack (MNIAH-R)"
    authors: "Yidong Wang"
    year: 2025
    venue: "arXiv"
    url: "https://arxiv.org/abs/2504.04150"
    source_type: "preprint"
    note: "Long-context decline driven by THINKING/CoT shortening as input grows, not needle placement. Multi-round reflection; transfers to AIME2024."
  - id: D3
    name: "LongReason: Synthetic Long-Context Reasoning via Context Expansion"
    authors: "Ling et al."
    year: 2025
    venue: "arXiv"
    url: "https://arxiv.org/abs/2501.15089"
    source_type: "preprint"
    note: "794 MCQs expanded from short questions; 21 LLMs degrade steeply even when NIAH is saturated."
  - id: D4
    name: "Longer Context, Deeper Thinking: Role of Long-Context Ability in Reasoning"
    authors: "(2025)"
    year: 2025
    venue: "arXiv"
    url: "https://arxiv.org/abs/2505.17315"
    source_type: "preprint"
    note: "Insufficient long-context ability undermines long-CoT RL/SFT gains; can't use full input → can't benefit from longer reasoning."
  - id: D5
    name: "Long-context LMs Fail in Basic Retrieval Without Sufficient Reasoning Steps"
    authors: "Yu (Yijiong) et al."
    year: 2025
    venue: "EMNLP 2025 Findings"
    url: "https://aclanthology.org/2025.findings-emnlp.301.pdf"
    source_type: "paper"
    note: "Multi-matching & logic-based retrieval nearly unsolvable without long-CoT; models sensitive to question FORM > context length."
  # --- D.b Agentic / multi-turn context degradation ---
  - id: D6
    name: "Intent Mismatch Causes LLMs to Get Lost in Multi-Turn Conversation (Mediator-Assistant)"
    authors: "Liu, Zhu, Feng, Ma, Wang, Meng (CASIA)"
    year: 2026
    venue: "arXiv"
    url: "https://arxiv.org/abs/2602.07338"
    source_type: "preprint"
    note: "★ HIGH RELEVANCE TO THIS REPO (mediator-coevo). 'Lost in Conversation' = intent-alignment gap, not capability; scaling/training alone can't fix. Proposes a MEDIATOR-ASSISTANT architecture explicating vague inputs into structured instructions. Directly mitigates multi-turn degradation."
  - id: D7
    name: "MT-OSC: Path for LLMs that Get Lost in Multi-Turn Conversation"
    authors: "Singh, Tu, Ballesteros, Sun, Ghoshal, Yuan, Benajiba, Ravi, Roth (Amazon)"
    year: 2026
    venue: "arXiv"
    url: "https://arxiv.org/abs/2604.08782"
    source_type: "preprint"
    note: "Mitigation: One-off Sequential Condensation (Condenser Agent + Decider) condenses history in background; up to 72% token cut in 10-turn dialogues; 13 SOTA LLMs."
  - id: D8
    name: "LongFuncEval: Long Context Models for Function Calling"
