topic: In-Context Learning & Test-Time Adaptation in LLMs
topic_slug: icl-test-time-adaptation
generated: 2026-06-07

# detail_level tiers (per research skill):
#   minimal  -> one phrase / enum value
#   brief    -> 1-2 sentences
#   detailed -> full paragraph with specifics, numbers, caveats
#
# Fields organized by the 4 confirmed research dimensions:
#   (1) Mechanism & theory
#   (2) Empirical findings & task transfer
#   (3) Reasoning & agent effects
#   (4) Limitations & open problems
# plus Basic bibliographic metadata.

field_groups:

  # ---------------------------------------------------------------------------
  - group: Basic
    description: Bibliographic + impact metadata for landmark filtering.
    fields:
      - name: name
        description: Canonical paper / work title.
        detail_level: minimal
      - name: authors
        description: First authors (+ lab/affiliation where it signals provenance, e.g. DeepMind, Anthropic, Meta).
        detail_level: minimal
      - name: year
        description: Publication / preprint year.
        detail_level: minimal
      - name: venue
        description: Venue and status (NeurIPS / ICML / ICLR / ACL / EMNLP / Nature / arXiv-only).
        detail_level: minimal
      - name: citation_signal
        description: Citation count or impact signal (approx, with as-of date if available).
        detail_level: minimal
      - name: core_claim
        description: One-line thesis — the single most important contribution.
        detail_level: brief

  # ---------------------------------------------------------------------------
  - group: "Dimension 1 — Mechanism & theory"
    description: How / why context-based adaptation works.
    fields:
      - name: mechanism
        description: >-
          The proposed mechanism, in prose: implicit Bayesian inference / implicit
          gradient descent (mesa-optimizer) / statistical algorithm implementation +
          selection / induction heads & circuits / task-or-function vectors /
          data-distribution-driven emergence / Task-Recognition-vs-Task-Learning.
        detail_level: detailed
      - name: theory_school
        description: >-
          [NEW] Enum tag for the mechanistic camp this work belongs to or argues
          against — bayesian | implicit-GD | statistical-algo-selection |
          circuits/induction-head | task/function-vector | data-driven-emergence |
          TR-vs-TL | empirical-only. Used to map inter-paper debates.
        detail_level: minimal
      - name: adaptation_type
        description: >-
          What carries the adaptation: few-shot examples | instructions |
          CoT/reasoning trace | retrieval | latent-thought | test-time gradient
          training | test-time RL.
        detail_level: minimal
      - name: parameter_updates_required
        description: The central binary axis — does adaptation modify weights? yes | no | partial.
        detail_level: minimal
      - name: parameter_locus
        description: >-
          [NEW] Finer than the binary — WHERE/what updates: none (pure prompt) |
          soft-prompt/prefix | BN-affine (Tent) | LoRA | full-weights |
          RL-policy-update (TTRL/R1). Resolves the test-time spectrum.
        detail_level: minimal

  # ---------------------------------------------------------------------------
  - group: "Dimension 2 — Empirical findings & task transfer"
    description: Headline results and whether context induces transfer to unseen tasks.
    fields:
      - name: task_transfer
        description: >-
          Does the method induce transfer to unseen tasks/distributions, and how
          strong? Note OOD behavior and whether transfer is to genuinely novel tasks
          vs. recognition of pretrained tasks.
        detail_level: detailed
      - name: key_findings
        description: Headline empirical results — the 2-4 most important numbers/observations.
        detail_level: detailed
      - name: benchmark_evidence
        description: >-
          [NEW] Specific benchmarks + deltas (e.g. AIME / MATH / GPQA / ARC-AGI /
          BBH / GINC / GSM8K) for cross-item comparison of empirical strength.
        detail_level: brief
      - name: empirical_scale_dependence
        description: >-
          [NEW] How the effect changes with model scale — emerges / vanishes /
          reverses / monotonic (ties together emergent abilities, flipped-label
          override, TR-vs-TL, the Mirage critique).
        detail_level: brief
      - name: distribution_shift_robustness
        description: >-
          [NEW] Whether the method targets or benefits from train/test distribution
          shift (core motivation of TTT/Tent; relevant to ICL OOD generalization).
        detail_level: brief

  # ---------------------------------------------------------------------------
  - group: "Dimension 3 — Reasoning & agent effects"
    description: Effect on reasoning quality and on agent performance.
    fields:
      - name: effect_on_reasoning
        description: >-
          Impact on multi-step reasoning quality (CoT, self-consistency, search,
          self-correction) — with the mechanism of improvement where known.
        detail_level: detailed
      - name: effect_on_agent_performance
        description: >-
          Impact on agentic behavior — tool use, planning, self-reflection, in-context
          RL, long-horizon tasks; benchmarks like ALFWorld / WebShop / HotpotQA if used.
        detail_level: detailed
      - name: supervision_signal
        description: >-
          [NEW] What signal drives adaptation: gold-label | self-generated/reinforced
          rationale | majority-vote pseudo-reward | entropy/perplexity (self-sup) |
          verifier/PRM | none (unsupervised). Key differentiator across test-time methods.
        detail_level: minimal
      - name: system1_vs_system2
        description: >-
          [NEW] Positioning on the fast-vs-slow axis — intuitive single-pass vs.
          deliberate repeated-sampling/search/self-correction. Used by 2025 TTS surveys
          to organize the field.
        detail_level: minimal
      - name: inference_cost_tradeoff
        description: >-
          [NEW] Does it trade inference-time compute for training-time cost?
          (many-shot ICL, TTS, TTT, long-context ICL). Note compute profile.
        detail_level: brief

  # ---------------------------------------------------------------------------
  - group: "Dimension 4 — Limitations & open problems"
    description: Critiques, failure modes, and the no-update vs. test-time-training boundary.
    fields:
      - name: limitations
        description: >-
          Known failure modes, fragility (order/selection/calibration sensitivity),
          contested claims, and what the work does NOT show.
        detail_level: detailed
      - name: relation_to_tta
        description: >-
          The bridge column — how this work relates to test-time adaptation/training:
          is it pure-context (no update), a TTA/TTT/TTRL method, or a conceptual link
          between them? Position it on the parameter-update spectrum.
        detail_level: detailed
      - name: open_problems
        description: Open questions / future-work directions the paper raises or implies.
        detail_level: brief
      - name: reproducibility_signal
        description: >-
          [NEW] Open-source code? formal peer-reviewed venue vs. arXiv-only? Supports
          landmark filtering and trustworthiness assessment.
        detail_level: minimal

# Uncertain fields — reserved; deep-research phase auto-fills if evidence found.
uncertain_fields:
  - name: contemporary_consensus_2026
    description: >-
      As of 2026, where does the field stand on this work's central claim? (e.g. is
      the implicit-GD view still held? did the Mirage critique stick? is TTRL's
      pseudo-reward gain robust?). Fill only if strong secondary evidence exists.
    detail_level: brief
  - name: connection_to_skill_learning
    description: >-
      Optional bridge to the user's broader interest — context-based skill
      acquisition / coevolution without weight updates. Fill if the work directly
      informs that framing.
    detail_level: brief
