topic: >-
  In-Context Learning & Test-Time Adaptation in LLMs — how language models adapt
  behavior and transfer to new tasks via context (examples, instructions, reasoning
  traces, retrieved content) without parameter updates, and how this shapes reasoning
  quality and agent performance; bridging to test-time training/RL where adaptation
  does touch weights.
topic_slug: icl-test-time-adaptation
generated: 2026-06-07
time_range: "no limit (2020-2026)"

execution:
  batch_size: 4          # parallel deep-research agents
  items_per_agent: 1     # deepest per-item treatment; one paper per agent across all fields
  model: opus            # Opus 4.8, max reasoning
  external_tools:        # agents MUST use these extensively
    - firecrawl_search
    - firecrawl_scrape
    - exa_web_search
    - exa_web_fetch
    - academic-search MCP (search_papers / explore_citations / get_paper_stats / search_by_author)
  output_dir: ./results

