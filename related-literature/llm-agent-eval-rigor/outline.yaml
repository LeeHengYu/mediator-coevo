    category: reproducibility_nondeterminism
    tier: core
    note: "Greedy+fixed-seed still diverges via batch-size/GPU-count/GPU-model (BF16 drift up to 9% accuracy, 9000-token length gap)."
    key_refs:
      - https://arxiv.org/abs/2506.09501
      - https://github.com/nanomaoli/llm_reproducibility

  - id: batch-invariance
    name: "Thinking Machines — batch-invariance root cause"
    category: reproducibility_nondeterminism
    tier: core
    note: "temp=0 nondeterminism is missing batch-invariance (server-load-driven batch size), NOT 'concurrency+floating-point'; batch_invariant_ops fixes it."
    key_refs:
      - https://thinkingmachines.ai/blog/defeating-nondeterminism-in-llm-inference/
      - https://github.com/thinking-machines-lab/batch_invariant_ops

  - id: tbik-tensor-parallel
    name: "TBIK — determinism across tensor-parallel sizes"
    category: reproducibility_nondeterminism
    tier: extended
    note: "Batch-invariance insufficient: differing TP size also nondeterministic; RL train(TP=1)/rollout(TP>1) mismatch collapses training."
    key_refs:
      - https://arxiv.org/abs/2511.17826

  - id: deterministic-engines
    name: "SGLang / vLLM deterministic inference"
    category: reproducibility_nondeterminism
    tier: extended
    note: "Engine-level batch-invariant kernels → 100% reproducible RL training (Qwen3-8B); SGLang 34% overhead w/ CUDA graphs."
    key_refs:
      - https://lmsys.org/blog/2025-09-22-sglang-deterministic/
      - https://docs.vllm.ai/en/latest/features/batch_invariance/

  - id: nondeterminism-empirical
    name: "Empirical run-to-run variance (Atil / Ouyang / config-impact)"
    category: reproducibility_nondeterminism
    tier: extended
    orig: true
    note: "temp=0 still ~15% accuracy spread (Atil); ChatGPT codegen 47–76% non-identical (Ouyang); top-p impacts variance more than temperature."
    key_refs:
      - https://arxiv.org/abs/2408.04667
      - https://arxiv.org/abs/2308.02828

  - id: rollout-cards
    name: "Rollout Cards (agent reproducibility standard)"
    category: reproducibility_nondeterminism
    tier: extended
    note: "Audited 50 repos: none report failed/errored/skipped runs; reporting-rule changes flip frontier rankings by up to 20.9pp."
    key_refs:
      - https://arxiv.org/abs/2605.12131

  - id: model-snapshot-pinning
    name: "Model snapshot pinning / silent versioning + ChatGPT drift"
    category: reproducibility_nondeterminism
    tier: core
    note: "Use dated snapshots not aliases; even pinned snapshots drift via infra/safety layers; GPT-4 84%→51% prime test Mar→Jun 2023."
    key_refs:
      - https://arxiv.org/abs/2307.09009
      - https://platform.claude.com/docs/en/about-claude/models/model-ids-and-versions

  - id: metr-task-standard
    name: "METR Task Standard + content-addressed task images"
    category: reproducibility_nondeterminism
    tier: core
    orig: true
    note: "Versioned pre-built Docker task images via OCI artifacts; self-contained envs; the content-addressed-image best practice."
    key_refs:
      - https://github.com/METR/task-standard/blob/main/STANDARD.md
      - https://github.com/METR/public-tasks

  - id: betterbench
    name: "BetterBench (+ NeurIPS repro checklist)"
    category: reproducibility_nondeterminism
    tier: extended
    note: "46 best-practices across benchmark lifecycle; 17/24 benchmarks lack one-click repro scripts; roots in ML Reproducibility Checklist."
    key_refs:
      - https://arxiv.org/html/2411.12990
      - https://betterbench.stanford.edu/

  - id: core-bench
    name: "CORE-Bench (computational reproducibility agent bench)"
    category: reproducibility_nondeterminism
    tier: extended
    note: "270 tasks / 90 papers; tests agents reproducing published computational results — reproducibility AS the eval target."
    key_refs:
      - https://tmlr.infinite-conf.org/paper_pages/BsMMc4MEGS.html

  # === I. Statistical evaluation methodology & metrics ================
  - id: significance-testing
    name: "Statistical significance testing (bootstrap/McNemar/permutation)"
    category: statistics_metrics
    tier: core
    orig: true
    note: "Umbrella hub: bootstrap CIs, paired permutation, McNemar, sign test, clustered/hierarchical SEs."
    key_refs:
      - https://arxiv.org/abs/1806.08295

  - id: adding-error-bars
    name: "Adding Error Bars to Evals (Miller, Anthropic)"
    category: statistics_metrics
    tier: core
    note: "Seminal: super-population framing, CLT-SEM, paired-difference inference, variance reduction, clustered SEs (up to 3x), power analysis."
    key_refs:
      - https://arxiv.org/abs/2411.00640
      - https://www.anthropic.com/research/statistical-approach-to-model-evals

  - id: dont-use-clt
    name: "Don't Use the CLT (<few-hundred datapoints)"
    category: statistics_metrics
    tier: extended
    note: "CLT intervals underestimate uncertainty at small-N / non-mean metrics; recommends Wilson + Beta-Bernoulli Bayesian; bootstrap also weak."
    key_refs:
      - https://proceedings.mlr.press/v267/bowyer25a.html

  - id: swebench-60k-variance
    name: "SWE-bench-Verified 60k-trajectory variance/power study"
    category: statistics_metrics
    tier: core
    note: "THE agent stats paper: single-run pass@1 varies 2.2–6.0pp; SD>1.5pp at temp 0; ~9 runs to detect 2pp@80% power; report pass@1+pass@k+pass^k."
    key_refs:
      - https://arxiv.org/pdf/2602.07150

  - id: nist-ai-800-3
    name: "NIST AI 800-3 — statistical models / GLMM"
    category: statistics_metrics
    tier: extended
    note: "Authoritative estimand distinction: benchmark accuracy vs generalized accuracy; GLMMs for efficient uncertainty + variance decomposition."
    key_refs:
      - https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.800-3.pdf

  - id: variance-decomposition
    name: "Variance decomposition / Hidden Measurement Error"
    category: statistics_metrics
    tier: extended
    note: "LMM over item×prompt×temp×judge×model; most benchmarks report no uncertainty; the 4 that do capture only item-sampling variance."
    key_refs:
      - https://arxiv.org/html/2604.11581v6
      - https://arxiv.org/html/2406.10229v1

  - id: passk-vs-passhatk
    name: "pass@k vs pass^k (capability vs reliability)"
    category: statistics_metrics
    tier: core
    orig: true
    note: "Capability (any-of-k) vs reliability (all-of-k); τ-bench GPT-4o 61% pass@1 → 25% pass^8 reliability gap."
    key_refs:
      - https://www.philschmid.de/agents-pass-at-k-pass-power-k

  - id: g-pass-at-k
    name: "G-Pass@k / Cover@τ (consistency-threshold metrics)"
    category: statistics_metrics
    tier: extended
    note: "Interpolate pass@k↔pass^k via consistency threshold τ; Cover@τ strictly more informative than pass@k, avoids large-k degeneracy."
    key_refs:
      - https://aclanthology.org/2025.findings-acl.905.pdf
      - https://openreview.net/pdf?id=iCb9Fq4PBe

  - id: bradley-terry-ranking
    name: "Bradley-Terry / Elo ranking statistics"
    category: statistics_metrics
    tier: extended
    note: "Chatbot Arena MLE Bradley-Terry + bootstrap CIs, Rao-Kupper ties; Agent Arena ranks models/tools/frameworks jointly."
    key_refs:
      - https://lmsys.org/blog/2023-12-07-leaderboard/
      - https://arxiv.org/html/2605.15761v1

  - id: leaderboard-illusion
    name: "The Leaderboard Illusion (+ leaderboard significance)"
    category: statistics_metrics
    tier: core
    note: "Systematic Chatbot Arena critique: data-access asymmetry, selective disclosure; leaderboards show ranks with no significance."
    key_refs:
      - https://arxiv.org/abs/2504.20879
      - https://arxiv.org/pdf/2501.18243

  - id: llm-judge-reliability
    name: "LLM-as-judge reliability statistics"
    category: statistics_metrics
    tier: core
    orig: true
    note: "Position/self-preference bias; chance-corrected agreement (Krippendorff α / Scott π) over Cohen κ; distributional vs forced-choice; temp sensitivity."
    key_refs:
      - https://arxiv.org/html/2406.12624v6
      - https://aclanthology.org/2025.findings-emnlp.1361.pdf

  # === J. Ablation methodology & agent-component findings =============
  - id: ablation-design
    name: "Agent ablation study design (methodology hub)"
    category: ablation_methodology
    tier: core
    orig: true
    note: "How to cleanly ablate memory/tools/planning/reflection/rollouts; leave-one-out vs confounded change; cost-normalized comparison."
    key_refs:
      - https://arxiv.org/abs/2407.01502

  - id: react
    name: "ReAct (reasoning-vs-acting ablation)"
    category: ablation_methodology
    tier: core
    note: "Canonical scaffolding ablation template: ReAct vs Act-only vs CoT-only vs CoT-SC; isolates reasoning trace vs action interface."
    key_refs:
      - https://arxiv.org/abs/2210.03629

  - id: reflexion
    name: "Reflexion (reflection/self-critique ablation)"
    category: ablation_methodology
    tier: core
    note: "Reference reflection-component ablation: varies feedback signal/incorporation/agent type; 91% pass@1 HumanEval."
    key_refs:
      - https://arxiv.org/abs/2303.11366

  - id: generative-agents
    name: "Generative Agents (clean module ablation)"
    category: ablation_methodology
    tier: extended
    note: "Textbook additive remove-one-module ablation: observation/planning/reflection memory each critical to believability."
    key_refs:
      - https://arxiv.org/abs/2304.03442

  - id: cannot-self-correct
    name: "LLMs Cannot Self-Correct Reasoning Yet (negative result)"
    category: ablation_methodology
    tier: core
    note: "Intrinsic self-correction DEGRADES accuracy; prior reflection gains came from oracle stopping signals — a confound ablations must control."
    key_refs:
      - https://arxiv.org/abs/2310.01798

  - id: mast-multiagent
    name: "MAST — Why Do Multi-Agent LLM Systems Fail?"
    category: ablation_methodology
    tier: core
    note: "Multi-agent vs single ablation: 14 failure modes (41.8% spec/design, 36% inter-agent); MAS gains often minimal & architectural."
    key_refs:
      - https://arxiv.org/abs/2503.13657

  - id: swe-agent-aci
    name: "SWE-agent — Agent-Computer Interface ablation"
    category: ablation_methodology
    tier: core
    note: "Scaffolding/tooling ablation: ACI design (edit/navigate/search tools, lint feedback) drives gains more than base-model swaps."
    key_refs:
      - https://arxiv.org/abs/2405.15793

  - id: large-language-monkeys
    name: "Large Language Monkeys (repeated-sampling ablation)"
    category: ablation_methodology
    tier: extended
    note: "Coverage (pass@k) scales log-linearly with sample count; verifier is the bottleneck — the rollout-count ablation reference."
    key_refs:
      - https://arxiv.org/abs/2407.21787

  - id: coala
    name: "CoALA + Agentic-RL taxonomy (component vocabulary)"
    category: ablation_methodology
    tier: extended
    note: "Defines modular decomposition (working/episodic/semantic/procedural memory, action space, decision proc) ablations remove one-at-a-time."
    key_refs:
      - https://arxiv.org/abs/2309.02427
      - https://arxiv.org/abs/2509.02547

  - id: memory-ablation
    name: "Memory-component ablation (filesystem vs specialized)"
    category: ablation_methodology
    tier: extended
    note: "gpt-4o-mini 74% LoCoMo via plain files, beating Mem0/Zep/LangMem; 'memory is context management, not retrieval'; MemoryAgentBench."
    key_refs:
      - https://www.letta.com/blog/benchmarking-ai-agent-memory
      - https://openreview.net/forum?id=DT7JyQC3MR

