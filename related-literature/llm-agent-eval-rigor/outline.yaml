# =====================================================================
# Research Outline — Rigorous Evaluation Methodology for LLM Agents
# (reproducibility · contamination/leakage controls · statistics · ablations)
# Generated by /research  |  Step 1 (model) + Step 2 (8 parallel Opus web-search agents)
# Time range: 2023–present  |  Date: 2026-06-07
# =====================================================================

topic: "Rigorous evaluation methodology for LLM agents"
topic_slug: llm-agent-eval-rigor
description: >
  How to measure LLM-agent performance so results are reproducible,
  contamination/leakage-free, statistically sound, and ablation-backed.
  Spans (a) the agent benchmarks where rigor problems manifest, (b) the
  detection/control methods, (c) the statistical & reproducibility
  machinery, and (d) the landmark frameworks/position papers.

# ---------------------------------------------------------------------
# Execution config for /research-deep (one independent agent per item)
# ---------------------------------------------------------------------
execution:
  batch_size: 16            # parallel deep-research agents at a time
  items_per_agent: 1        # deepest focus — one item per agent
  model: opus               # Opus 4.8, max reasoning
  tools: [firecrawl, exa, academic-search]   # extensive external references
  output_dir: ./results     # one markdown file per item: results/<id>.md
  tier_order: [core, extended]   # run `core` tier first, then `extended`
  task_output: disabled     # per skill: deep agents must not stream task output
  notes: >
    Each agent fills every applicable field from fields.yaml (universal core +
    the conditional groups whose `applies_to` includes the item's category).
    Skip-and-flag uncertain values (do NOT fabricate); record them under the
    item's `uncertain` list for a later pass.

# ---------------------------------------------------------------------
# ITEMS — 114 across 12 categories. tier ∈ {core, extended}
# `orig` marks one of the originally-approved 26 items.
# ---------------------------------------------------------------------
