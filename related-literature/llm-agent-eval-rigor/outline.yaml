  # === E. Contamination detection methods =============================
  - id: ngram-overlap
    name: "N-gram / substring overlap decontamination"
    category: contamination_detection
    tier: core
    orig: true
    note: "Classic OpenAI-style 8–13-gram overlap; baseline, easily evaded by rephrasing."
    key_refs:
      - https://github.com/EleutherAI/lm-evaluation-harness/blob/master/docs/decontamination.md

  - id: min-k-prob
    name: "Min-K% Prob (+ Min-K%++)"
    category: contamination_detection
    tier: core
    orig: true
    note: "Reference-free pretraining-data detection; introduced WikiMIA; Min-K%++ adds local-maxima theory (AUROC +6–10%)."
    key_refs:
      - https://arxiv.org/abs/2310.16789
      - https://arxiv.org/abs/2404.02936

  - id: recall
    name: "ReCaLL (relative conditional log-likelihood)"
    category: contamination_detection
    tier: extended
    note: "Adds non-member prefix, observes conditional-LL shift; WikiMIA SOTA; 'conditional likelihood' family."
    key_refs:
      - https://aclanthology.org/2024.emnlp-main.493/

  - id: exchangeability-test
    name: "Exchangeability test (Oren et al.)"
    category: contamination_detection
    tier: core
    note: "Provable-FPR black-box test: contaminated models favor canonical ordering; detects in 1.4B models / 1000-item sets."
    key_refs:
      - https://arxiv.org/abs/2310.17623

  - id: guided-instruction
    name: "Guided Instruction / Time Travel in LLMs"
    category: contamination_detection
    tier: extended
    note: "Give dataset name+partition+half-instance, ask completion; GPT-4 ICL classifier; 92–100% accuracy."
    key_refs:
      - https://arxiv.org/abs/2308.08493

  - id: data-contamination-quiz
    name: "Data Contamination Quiz (DCQ)"
    category: contamination_detection
    tier: extended
    note: "Multi-choice (original + 3 perturbations + none); first to ESTIMATE verbatim contamination fully black-box."
    key_refs:
      - https://arxiv.org/abs/2311.06233

  - id: ts-guessing
    name: "TS-Guessing (testset slot guessing)"
    category: contamination_detection
    tier: extended
    note: "Mask wrong option / low-prob word, ask completion; ChatGPT/GPT-4 exact-match 52%/57% on MMLU."
    key_refs:
      - https://aclanthology.org/2024.naacl-long.482/

  - id: cdd-ted
    name: "CDD / TED (output-distribution)"
    category: contamination_detection
    tier: extended
    note: "Detect via output peakedness using only sampled text; TED corrects distribution to mitigate (−66.9% inflation)."
    key_refs:
      - https://arxiv.org/abs/2402.15938

  - id: performance-based-detection
    name: "ConStat / PaCoST (performance- & confidence-based)"
    category: contamination_detection
    tier: extended
    note: "Redefine contamination as non-generalizing inflated performance vs reference benchmarks/models; statistical, evasion-resistant, quantifiable."
    key_refs:
      - https://arxiv.org/abs/2405.16281
      - https://arxiv.org/abs/2406.18326

  - id: mia-failure-evidence
    name: "MIA failure evidence (MIMIR / EAL / Test-of-Time / cross-lingual)"
    category: contamination_detection
    tier: core
    note: "CRITICAL negatives: MIAs ≈ random on LLM pretraining (AUC<0.6); evasion 'too easy'; temporal signal fragile; cross-lingual blind spot."
    key_refs:
      - https://arxiv.org/abs/2402.07841
      - https://arxiv.org/abs/2402.02823
      - https://arxiv.org/abs/2509.00072

  - id: rl-rlvr-contamination
    name: "RL / RLVR-stage contamination detection"
    category: contamination_detection
    tier: extended
    note: "Self-Critique (entropy-collapse, AUC +30%) + Min-kNN distance for RLVR; fills post-training detection gap."
    key_refs:
      - https://arxiv.org/abs/2510.09259
      - https://arxiv.org/abs/2602.11792

  # === F. Contamination controls — prevent / mitigate / govern ========
  - id: canary-guid
    name: "BIG-bench canary GUID"
    category: contamination_controls
    tier: core
    note: "Canary string lets creators filter benchmarks from corpora + probe via canary-vs-random GUID log-prob p-test; used by GPQA/HLE."
    key_refs:
      - https://github.com/google/BIG-bench/blob/main/bigbench/benchmark_tasks/training_on_test_set/README.md

  - id: encryption-publishing
    name: "Encryption / 'Stop Uploading Test Data in Plain Text'"
    category: contamination_controls
    tier: core
    note: "Public-key encryption + No-Derivatives license; demand training-exclusion from APIs; avoid answer-on-web."
    key_refs:
      - https://aclanthology.org/2023.emnlp-main.308/

  - id: llm-decontaminator
    name: "LLM-Decontaminator / rephrased samples"
    category: contamination_controls
    tier: core
    note: "Shows n-gram decontam insufficient (rephrase/translate evades); 8–18% HumanEval overlap in RedPajama/StarCoder."
    key_refs:
      - https://arxiv.org/abs/2311.04850

  - id: conda-db
    name: "CONDA Data Contamination Database (governance)"
    category: contamination_controls
    tier: extended
    note: "Community registry (566 entries / 91 contaminated sources); query as a known-contaminated checklist pre-eval."
    key_refs:
      - https://conda-workshop.github.io/
      - https://aclanthology.org/2024.conda-1.4.pdf

  - id: clean-eval-mitigation
    name: "Clean-Eval / LNE-Blocking (score recovery)"
    category: contamination_controls
    tier: extended
    note: "Mitigation family: paraphrase+back-translate to clean set, or block-perturb to recover pre-contamination performance."
    key_refs:
      - https://aclanthology.org/2024.findings-naacl.53.pdf
      - https://arxiv.org/abs/2509.15218

  - id: kieval
    name: "KIEval (interactive dynamic eval)"
    category: contamination_controls
    tier: extended
    note: "Multi-turn knowledge-focused dialogue distinguishes recall from understanding; shows detectors miss SFT-stage contamination."
    key_refs:
      - https://arxiv.org/abs/2402.15043

  - id: livebench
    name: "LiveBench (+ LiveCodeBench)"
    category: contamination_controls
    tier: core
    note: "Rolling/dynamic contamination-limited benchmarks: frequent fresh questions, verifiable ground truth, date-stamped coding tasks."
    key_refs:
      - https://arxiv.org/abs/2406.19314
      - https://livecodebench.github.io/

  - id: mmlu-cf
    name: "MMLU-CF (contamination-free design)"
    category: contamination_controls
    tier: extended
    note: "200B+ web pool + 3 decontam rules incl. shuffle choices; closed test set vs open val set, gap measures future contamination."
    key_refs:
      - https://aclanthology.org/2025.acl-long.656/

  - id: gpqa-hle
    name: "GPQA + Humanity's Last Exam (private held-out design)"
    category: contamination_controls
    tier: core
    orig: true
    note: "Google-proof difficulty + private unreleased held-out set + embedded canary; HLE maintains private set to test gaming."
    key_refs:
      - https://arxiv.org/abs/2311.12022
      - https://arxiv.org/abs/2501.14249

