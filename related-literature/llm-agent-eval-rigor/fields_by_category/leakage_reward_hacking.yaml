topic_slug: llm-agent-eval-rigor
category: leakage_reward_hacking
field_categories:
- category: core_basic
  fields:
  - name: name
    description: Canonical name + aliases / variants.
    detail_level: 极简
    required: true
  - name: type
    description: benchmark | detection_method | control | leakage_case | repro_protocol | statistical_method | metric | ablation_study
      | framework | position_paper | survey.
    detail_level: 极简
    required: true
  - name: year
    description: First release / publication year (and major-version dates if applicable).
    detail_level: 极简
    required: true
  - name: venue
    description: Conference / journal / blog / repo / gov agency.
    detail_level: 极简
    required: true
  - name: org_authors
    description: Originating org and lead authors.
    detail_level: 简要
    required: true
  - name: url_repo
    description: 'Primary URL(s): paper, official repo, leaderboard/site.'
    detail_level: 极简
    required: true
- category: core_core
  fields:
  - name: definition
    description: 'One-paragraph: what it is and what problem it addresses.'
    detail_level: 简要
    required: true
  - name: domain_task_type
    description: Domain / task type / what capability or property it targets.
    detail_level: 简要
    required: true
  - name: how_it_works
    description: Mechanism / methodology — how it operates or is computed.
    detail_level: 详细
    required: true
- category: core_rigor
  fields:
  - name: contamination_risk
    description: Exposure to training-data contamination; known or suspected, with evidence.
    detail_level: 简要
    required: true
  - name: leakage_findings
    description: Documented in-eval leakage / answer-reachability findings (link to category G where relevant).
    detail_level: 简要
    required: true
  - name: reproducibility_properties
    description: Determinism, version/seed pinning, containerization, env-drift exposure.
    detail_level: 简要
    required: true
  - name: statistical_treatment
    description: CIs, significance tests, error bars, repeated runs — what it reports/recommends.
    detail_level: 简要
    required: true
  - name: seed_variance_sensitivity
    description: 'Reported run-to-run / seed variance; # seeds used; quantified spread if any.'
    detail_level: 简要
    required: true
  - name: ablation_practices
    description: Component ablations performed or required; confound controls.
    detail_level: 简要
    required: true
- category: core_critical
  fields:
  - name: known_pitfalls_criticisms
    description: Documented flaws, criticisms, failure modes, retractions.
    detail_level: 详细
    required: true
  - name: recommended_mitigations
    description: Fixes / best-practices the source (or critics) prescribe.
    detail_level: 简要
    required: true
- category: core_meta
  fields:
  - name: adoption_influence
    description: Uptake, citations, derived work, leaderboard usage.
    detail_level: 简要
    required: true
  - name: key_citations
    description: 2–5 canonical references (papers/repos/issues) with URLs.
    detail_level: 简要
    required: true
  - name: relevance_to_mediator_coevo
    description: How this bears on evaluating the mediator-coevo agent/coevolution system.
    detail_level: 简要
    required: true
- category: core_actionable
  fields:
  - name: actionable_checklist
    description: 'Concrete do/don''t recommendations directly applicable to mediator-coevo''s own evaluation harness (the
      user-requested universal field). Bullet list.

      '
    detail_level: 详细
    required: true
- category: leakage_case_properties
  fields:
  - name: leakage_vector_type
    description: 'git-history · same-container-no-isolation · answer-shipped-with-config · public-web-answer · environment-state-residue
      · eval-awareness-decryption · inter-agent-trace.

      '
    detail_level: 简要
    required: true
  - name: answer_accessibility_in_env
    description: Are gold answer/tests/config reachable inside the sandbox (path/URL/git-ref)?
    detail_level: 简要
    required: true
  - name: internet_access_during_eval
    description: Network access during eval and its constraints (pip-only vs open).
    detail_level: 极简
    required: true
  - name: documented_incident
    description: Reporter, date, affected models, instance IDs, before/after scores.
    detail_level: 详细
    required: true
  - name: leakage_magnitude_quantified
    description: Quantified magnitude (% trajectories affected, score inflation, decontam drop).
    detail_level: 简要
    required: true
  - name: eval_awareness_susceptibility
    description: Does the model actively infer 'being evaluated' and reverse the answer-key?
    detail_level: 简要
    required: true
  - name: patch_status_fix_pr
    description: Fixed? Fix PR / version. Known-unfixed vs patched.
    detail_level: 简要
    required: true
  - name: grader_gaming_surface
    description: Manipulable scorer surface (LLM-judge injection, weak match, trusts container test output).
    detail_level: 简要
    required: true
