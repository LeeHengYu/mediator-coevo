topic_slug: llm-agent-eval-rigor
category: reproducibility_nondeterminism
field_categories:
- category: core_basic
  fields:
  - name: name
    description: Canonical name + aliases / variants.
    detail_level: 极简
    required: true
  - name: type
    description: benchmark | detection_method | control | leakage_case | repro_protocol | statistical_method | metric | ablation_study
      | framework | position_paper | survey.
    detail_level: 极简
    required: true
  - name: year
    description: First release / publication year (and major-version dates if applicable).
    detail_level: 极简
    required: true
  - name: venue
    description: Conference / journal / blog / repo / gov agency.
    detail_level: 极简
    required: true
  - name: org_authors
    description: Originating org and lead authors.
    detail_level: 简要
    required: true
  - name: url_repo
    description: 'Primary URL(s): paper, official repo, leaderboard/site.'
    detail_level: 极简
    required: true
- category: core_core
  fields:
  - name: definition
    description: 'One-paragraph: what it is and what problem it addresses.'
    detail_level: 简要
    required: true
  - name: domain_task_type
    description: Domain / task type / what capability or property it targets.
    detail_level: 简要
    required: true
  - name: how_it_works
    description: Mechanism / methodology — how it operates or is computed.
    detail_level: 详细
    required: true
- category: core_rigor
  fields:
  - name: contamination_risk
    description: Exposure to training-data contamination; known or suspected, with evidence.
    detail_level: 简要
    required: true
  - name: leakage_findings
    description: Documented in-eval leakage / answer-reachability findings (link to category G where relevant).
    detail_level: 简要
    required: true
  - name: reproducibility_properties
    description: Determinism, version/seed pinning, containerization, env-drift exposure.
    detail_level: 简要
    required: true
  - name: statistical_treatment
    description: CIs, significance tests, error bars, repeated runs — what it reports/recommends.
    detail_level: 简要
    required: true
  - name: seed_variance_sensitivity
    description: 'Reported run-to-run / seed variance; # seeds used; quantified spread if any.'
    detail_level: 简要
    required: true
  - name: ablation_practices
    description: Component ablations performed or required; confound controls.
    detail_level: 简要
    required: true
- category: core_critical
  fields:
  - name: known_pitfalls_criticisms
    description: Documented flaws, criticisms, failure modes, retractions.
    detail_level: 详细
    required: true
  - name: recommended_mitigations
    description: Fixes / best-practices the source (or critics) prescribe.
    detail_level: 简要
    required: true
- category: core_meta
  fields:
  - name: adoption_influence
    description: Uptake, citations, derived work, leaderboard usage.
    detail_level: 简要
    required: true
  - name: key_citations
    description: 2–5 canonical references (papers/repos/issues) with URLs.
    detail_level: 简要
    required: true
  - name: relevance_to_mediator_coevo
    description: How this bears on evaluating the mediator-coevo agent/coevolution system.
    detail_level: 简要
    required: true
- category: core_actionable
  fields:
  - name: actionable_checklist
    description: 'Concrete do/don''t recommendations directly applicable to mediator-coevo''s own evaluation harness (the
      user-requested universal field). Bullet list.

      '
    detail_level: 详细
    required: true
- category: reproducibility_properties_ext
  fields:
  - name: nondeterminism_source
    description: sampling · batch-invariance(server-load) · TP/parallel-config · kernel/FP · provider-drift · agent-scaffold-compounding.
    detail_level: 简要
    required: true
  - name: determinism_level
    description: bitwise-identical · sequence-level · distribution-level (aggregate within CI).
    detail_level: 简要
    required: true
  - name: variance_magnitude_quantified
    description: Measured spread (std/range, e.g. ±5%, 9% accuracy drift, 75.76% non-identical).
    detail_level: 简要
    required: true
  - name: determinism_controllability
    description: Eliminable by engineering (batch-invariant kernels/TBIK/greedy/seed) vs irreducible (provider drift).
    detail_level: 简要
    required: true
  - name: inference_settings_disclosure
    description: temperature/top-p/top-k/seed/max_tokens/engine/precision exposure expected.
    detail_level: 简要
    required: true
  - name: harness_version_stamping
    description: Harness git-commit/version + content-addressed eval-image digest.
    detail_level: 简要
    required: true
  - name: model_version_pinning_policy
    description: Dated snapshot vs alias; retirement window; drift-recalibration plan.
    detail_level: 简要
    required: true
  - name: repeats_seeds_recommended
    description: 'Recommended # repeats/seeds and how pass@1 is estimated from them.'
    detail_level: 简要
    required: true
