topic_slug: llm-agent-eval-rigor
category: statistics_metrics
field_categories:
- category: core_basic
  fields:
  - name: name
    description: Canonical name + aliases / variants.
    detail_level: 极简
    required: true
  - name: type
    description: benchmark | detection_method | control | leakage_case | repro_protocol | statistical_method | metric | ablation_study
      | framework | position_paper | survey.
    detail_level: 极简
    required: true
  - name: year
    description: First release / publication year (and major-version dates if applicable).
    detail_level: 极简
    required: true
  - name: venue
    description: Conference / journal / blog / repo / gov agency.
    detail_level: 极简
    required: true
  - name: org_authors
    description: Originating org and lead authors.
    detail_level: 简要
    required: true
  - name: url_repo
    description: 'Primary URL(s): paper, official repo, leaderboard/site.'
    detail_level: 极简
    required: true
- category: core_core
  fields:
  - name: definition
    description: 'One-paragraph: what it is and what problem it addresses.'
    detail_level: 简要
    required: true
  - name: domain_task_type
    description: Domain / task type / what capability or property it targets.
    detail_level: 简要
    required: true
  - name: how_it_works
    description: Mechanism / methodology — how it operates or is computed.
    detail_level: 详细
    required: true
- category: core_rigor
  fields:
  - name: contamination_risk
    description: Exposure to training-data contamination; known or suspected, with evidence.
    detail_level: 简要
    required: true
  - name: leakage_findings
    description: Documented in-eval leakage / answer-reachability findings (link to category G where relevant).
    detail_level: 简要
    required: true
  - name: reproducibility_properties
    description: Determinism, version/seed pinning, containerization, env-drift exposure.
    detail_level: 简要
    required: true
  - name: statistical_treatment
    description: CIs, significance tests, error bars, repeated runs — what it reports/recommends.
    detail_level: 简要
    required: true
  - name: seed_variance_sensitivity
    description: 'Reported run-to-run / seed variance; # seeds used; quantified spread if any.'
    detail_level: 简要
    required: true
  - name: ablation_practices
    description: Component ablations performed or required; confound controls.
    detail_level: 简要
    required: true
- category: core_critical
  fields:
  - name: known_pitfalls_criticisms
    description: Documented flaws, criticisms, failure modes, retractions.
    detail_level: 详细
    required: true
  - name: recommended_mitigations
    description: Fixes / best-practices the source (or critics) prescribe.
    detail_level: 简要
    required: true
- category: core_meta
  fields:
  - name: adoption_influence
    description: Uptake, citations, derived work, leaderboard usage.
    detail_level: 简要
    required: true
  - name: key_citations
    description: 2–5 canonical references (papers/repos/issues) with URLs.
    detail_level: 简要
    required: true
  - name: relevance_to_mediator_coevo
    description: How this bears on evaluating the mediator-coevo agent/coevolution system.
    detail_level: 简要
    required: true
- category: core_actionable
  fields:
  - name: actionable_checklist
    description: 'Concrete do/don''t recommendations directly applicable to mediator-coevo''s own evaluation harness (the
      user-requested universal field). Bullet list.

      '
    detail_level: 详细
    required: true
- category: statistics_properties
  fields:
  - name: estimand_definition
    description: Targets benchmark accuracy (fixed items) vs generalized accuracy (super-population)?
    detail_level: 简要
    required: true
  - name: uncertainty_interval_method
    description: Wald/CLT-SEM · Wilson · Clopper-Pearson · Agresti-Coull/Jeffreys · bootstrap · Bayesian Beta-Bernoulli.
    detail_level: 简要
    required: true
  - name: variance_source_decomposition
    description: Which variance components separated (item/prompt/temp/judge/scaffold/seed/run).
    detail_level: 简要
    required: true
  - name: clustering_structure
    description: Is question/turn/session clustering corrected (design-effect, hierarchical bootstrap)?
    detail_level: 简要
    required: true
  - name: paired_vs_unpaired_inference
    description: Question-level paired diffs (McNemar/permutation) vs naive independent proportions.
    detail_level: 简要
    required: true
  - name: multiplicity_correction
    description: Family-wise/FDR correction for multi-model/metric/leaderboard (Bonferroni/Holm/BH).
    detail_level: 极简
    required: true
  - name: power_and_sample_size
    description: Power / minimum-detectable-effect / required-runs reported.
    detail_level: 简要
    required: true
  - name: reliability_metric_family
    description: pass@1 / pass@k / pass^k / G-Pass@k_τ / Cover@τ; is the pass@k–pass^k gap quantified?
    detail_level: 简要
    required: true
  - name: cost_controlled_reporting
    description: Accuracy×cost Pareto with significance on both axes?
    detail_level: 极简
    required: true
  - name: ranking_uncertainty_treatment
    description: Bradley-Terry/Elo bootstrap CIs + rank stability (Kendall τ, top-k under perturbation).
    detail_level: 简要
    required: true
