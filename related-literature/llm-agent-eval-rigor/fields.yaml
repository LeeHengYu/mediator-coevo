# =====================================================================
# Field definitions — Rigorous Evaluation Methodology for LLM Agents
# Layered schema: universal `core` fields apply to EVERY item;
# `conditional` field groups apply only to items whose category is in
# the group's `applies_to`. detail_level: 极简 → 简要 → 详细.
# Generated by /research  |  Step 4
# =====================================================================

topic_slug: llm-agent-eval-rigor

# ---------------------------------------------------------------------
# Categories (must match outline.yaml `category` values)
# ---------------------------------------------------------------------
categories:
  - benchmarks_coding_swe          # A. SWE / code / ML-eng agent benchmarks
  - benchmarks_web_computeruse     # B. web & computer-use agent benchmarks
  - benchmarks_tooluse_general     # C. tool-use, conversational & generalist
  - benchmarks_safety_adversarial  # D. safety & adversarial-robustness benchmarks
  - contamination_detection        # E. contamination detection methods
  - contamination_controls         # F. prevent / mitigate / govern controls
  - leakage_reward_hacking         # G. documented leakage & reward-hacking cases
  - reproducibility_nondeterminism # H. reproducibility & nondeterminism
  - statistics_metrics             # I. statistical methodology & metrics
  - ablation_methodology           # J. ablation design & component findings
  - frameworks_tooling             # K. eval frameworks / harnesses / tooling
  - position_meta_surveys          # L. position / meta papers & surveys

# Convenience group: all four benchmark categories
_groups:
  all_benchmarks: &all_benchmarks
    - benchmarks_coding_swe
    - benchmarks_web_computeruse
    - benchmarks_tooluse_general
    - benchmarks_safety_adversarial

# ---------------------------------------------------------------------
# CORE FIELDS — filled for every item regardless of category
# ---------------------------------------------------------------------
core_fields:

  basic:
    - name: name
      description: "Canonical name + aliases / variants."
      detail_level: 极简
    - name: type
      description: "benchmark | detection_method | control | leakage_case | repro_protocol | statistical_method | metric | ablation_study | framework | position_paper | survey."
      detail_level: 极简
    - name: year
      description: "First release / publication year (and major-version dates if applicable)."
      detail_level: 极简
    - name: venue
      description: "Conference / journal / blog / repo / gov agency."
      detail_level: 极简
    - name: org_authors
      description: "Originating org and lead authors."
      detail_level: 简要
    - name: url_repo
      description: "Primary URL(s): paper, official repo, leaderboard/site."
      detail_level: 极简

  core:
    - name: definition
      description: "One-paragraph: what it is and what problem it addresses."
      detail_level: 简要
    - name: domain_task_type
      description: "Domain / task type / what capability or property it targets."
      detail_level: 简要
    - name: how_it_works
      description: "Mechanism / methodology — how it operates or is computed."
      detail_level: 详细

  rigor:  # the originally-approved rigor-specific dimensions, on every item
    - name: contamination_risk
      description: "Exposure to training-data contamination; known or suspected, with evidence."
      detail_level: 简要
    - name: leakage_findings
      description: "Documented in-eval leakage / answer-reachability findings (link to category G where relevant)."
      detail_level: 简要
    - name: reproducibility_properties
      description: "Determinism, version/seed pinning, containerization, env-drift exposure."
      detail_level: 简要
    - name: statistical_treatment
      description: "CIs, significance tests, error bars, repeated runs — what it reports/recommends."
      detail_level: 简要
    - name: seed_variance_sensitivity
      description: "Reported run-to-run / seed variance; # seeds used; quantified spread if any."
      detail_level: 简要
    - name: ablation_practices
      description: "Component ablations performed or required; confound controls."
      detail_level: 简要

  critical:
    - name: known_pitfalls_criticisms
      description: "Documented flaws, criticisms, failure modes, retractions."
      detail_level: 详细
    - name: recommended_mitigations
      description: "Fixes / best-practices the source (or critics) prescribe."
      detail_level: 简要

  meta:
    - name: adoption_influence
      description: "Uptake, citations, derived work, leaderboard usage."
      detail_level: 简要
    - name: key_citations
      description: "2–5 canonical references (papers/repos/issues) with URLs."
      detail_level: 简要
    - name: relevance_to_mediator_coevo
      description: "How this bears on evaluating the mediator-coevo agent/coevolution system."
      detail_level: 简要

  actionable:
    - name: actionable_checklist
      description: >
        Concrete do/don't recommendations directly applicable to mediator-coevo's
        own evaluation harness (the user-requested universal field). Bullet list.
      detail_level: 详细

# ---------------------------------------------------------------------
# CONDITIONAL FIELD GROUPS — applied only to matching categories
# ---------------------------------------------------------------------
conditional_fields:

  # --- For all benchmark items ---------------------------------------
  - group: benchmark_properties
    applies_to: *all_benchmarks
    fields:
      - name: harness_coupling
        description: "Ships own harness vs runs on third-party (Inspect/HAL/Harbor/BrowserGym/lm-eval)."
        detail_level: 简要
      - name: scaffold_vs_model_attribution
        description: "Does it separate base-model from agent-scaffold contribution (HAL 3-D analysis)?"
        detail_level: 简要
      - name: cost_token_accounting
        description: "Reports $/token cost and Pareto cost-accuracy frontier?"
        detail_level: 简要
      - name: agent_evaluator_isolation
        description: "Is the system-under-test sandboxed from the scoring environment? (BenchJack Pattern #1)."
        detail_level: 简要
      - name: answer_secrecy_heldout
        description: "Public-answer leakage status; private held-out / commercial split present?"
        detail_level: 简要
      - name: task_freshness_update
        description: "Static snapshot vs continuously-refreshed / date-gated pipeline."
        detail_level: 简要
      - name: llm_judge_robustness
        description: "If LLM-judge: human-agreement %, injection sanitization, judge reproducibility."
        detail_level: 简要
      - name: interaction_mode
        description: "Turn-based vs async; single/multi-turn; dual-control / user-simulator presence."
        detail_level: 简要
      - name: state_vs_outcome_eval
        description: "DB/system-state + collateral-damage checks vs final-answer matching."
        detail_level: 简要
      - name: human_baseline_horizon
        description: "Measured human success rate / completion-time anchor (e.g. METR time-horizon)."
        detail_level: 简要
      - name: parallelization_latency
        description: "Wall-clock to run the full benchmark; parallelization story."
        detail_level: 极简
      - name: reward_hacking_resistance
        description: "Adversarially tested (null/random/injection/state-tampering; oracle-solver requirement)?"
        detail_level: 简要

  # --- For contamination detection methods ---------------------------
  - group: detection_method_properties
    applies_to: [contamination_detection]
    fields:
      - name: access_assumption
        description: "白盒 logits/loss · 灰盒 token-prob · 纯黑盒 generation. Determines API applicability."
        detail_level: 简要
      - name: reference_requirement
        description: "Needs reference model/corpus/benchmark (reference-based) vs reference-free."
        detail_level: 简要
      - name: detection_granularity
        description: "instance / partition / model level; detect-only vs estimate-% of contamination."
        detail_level: 简要
      - name: contamination_stage_covered
        description: "pretraining · SFT/instruction-tuning · RL/RLVR post-training."
        detail_level: 简要
      - name: evasion_resistance
        description: "Resistance to deliberate evasion (rephrase/translate/reorder/EAL)."
        detail_level: 简要
      - name: false_positive_rate_guarantee
        description: "Formal/statistical FPR guarantee or p-value, vs heuristic."
        detail_level: 简要
      - name: empirical_failure_evidence
        description: "Independent rebuttal showing it fails/over-estimated (e.g. MIMIR, Test-of-Time)."
        detail_level: 简要
      - name: computational_cost
        description: "Cost/scalability (multi-sample / prefix-concat / corpus-wide n-gram index vs single forward)."
        detail_level: 极简

  # --- For contamination controls ------------------------------------
  - group: control_properties
    applies_to: [contamination_controls]
    fields:
      - name: control_type
        description: "prevent (canary/encryption/private held-out) · mitigate (score recovery) · govern (registry)."
        detail_level: 简要
      - name: benchmark_refresh_mechanism
        description: "static · private held-out · rolling/time-stamped live · programmatic generation."
        detail_level: 简要
      - name: effectiveness_evidence
        description: "Demonstrated effectiveness AND known bypasses (e.g. canary scrubbing, rephrase evasion)."
        detail_level: 简要
      - name: operational_cost
        description: "Adoption cost for benchmark authors / evaluators."
        detail_level: 极简

  # --- For documented leakage / reward-hacking cases -----------------
  - group: leakage_case_properties
    applies_to: [leakage_reward_hacking]
    fields:
      - name: leakage_vector_type
        description: >
          git-history · same-container-no-isolation · answer-shipped-with-config ·
          public-web-answer · environment-state-residue · eval-awareness-decryption ·
          inter-agent-trace.
        detail_level: 简要
      - name: answer_accessibility_in_env
        description: "Are gold answer/tests/config reachable inside the sandbox (path/URL/git-ref)?"
        detail_level: 简要
      - name: internet_access_during_eval
        description: "Network access during eval and its constraints (pip-only vs open)."
        detail_level: 极简
      - name: documented_incident
        description: "Reporter, date, affected models, instance IDs, before/after scores."
        detail_level: 详细
      - name: leakage_magnitude_quantified
        description: "Quantified magnitude (% trajectories affected, score inflation, decontam drop)."
        detail_level: 简要
      - name: eval_awareness_susceptibility
        description: "Does the model actively infer 'being evaluated' and reverse the answer-key?"
        detail_level: 简要
      - name: patch_status_fix_pr
        description: "Fixed? Fix PR / version. Known-unfixed vs patched."
        detail_level: 简要
      - name: grader_gaming_surface
        description: "Manipulable scorer surface (LLM-judge injection, weak match, trusts container test output)."
        detail_level: 简要

  # --- For reproducibility & nondeterminism items --------------------
  - group: reproducibility_properties_ext
    applies_to: [reproducibility_nondeterminism]
    fields:
      - name: nondeterminism_source
        description: "sampling · batch-invariance(server-load) · TP/parallel-config · kernel/FP · provider-drift · agent-scaffold-compounding."
        detail_level: 简要
      - name: determinism_level
        description: "bitwise-identical · sequence-level · distribution-level (aggregate within CI)."
        detail_level: 简要
      - name: variance_magnitude_quantified
        description: "Measured spread (std/range, e.g. ±5%, 9% accuracy drift, 75.76% non-identical)."
        detail_level: 简要
      - name: determinism_controllability
        description: "Eliminable by engineering (batch-invariant kernels/TBIK/greedy/seed) vs irreducible (provider drift)."
        detail_level: 简要
      - name: inference_settings_disclosure
        description: "temperature/top-p/top-k/seed/max_tokens/engine/precision exposure expected."
        detail_level: 简要
      - name: harness_version_stamping
        description: "Harness git-commit/version + content-addressed eval-image digest."
        detail_level: 简要
      - name: model_version_pinning_policy
        description: "Dated snapshot vs alias; retirement window; drift-recalibration plan."
        detail_level: 简要
      - name: repeats_seeds_recommended
        description: "Recommended # repeats/seeds and how pass@1 is estimated from them."
        detail_level: 简要

  # --- For statistical methodology & metrics -------------------------
  - group: statistics_properties
    applies_to: [statistics_metrics]
    fields:
      - name: estimand_definition
        description: "Targets benchmark accuracy (fixed items) vs generalized accuracy (super-population)?"
        detail_level: 简要
      - name: uncertainty_interval_method
        description: "Wald/CLT-SEM · Wilson · Clopper-Pearson · Agresti-Coull/Jeffreys · bootstrap · Bayesian Beta-Bernoulli."
        detail_level: 简要
      - name: variance_source_decomposition
        description: "Which variance components separated (item/prompt/temp/judge/scaffold/seed/run)."
        detail_level: 简要
      - name: clustering_structure
        description: "Is question/turn/session clustering corrected (design-effect, hierarchical bootstrap)?"
        detail_level: 简要
      - name: paired_vs_unpaired_inference
        description: "Question-level paired diffs (McNemar/permutation) vs naive independent proportions."
        detail_level: 简要
      - name: multiplicity_correction
        description: "Family-wise/FDR correction for multi-model/metric/leaderboard (Bonferroni/Holm/BH)."
        detail_level: 极简
      - name: power_and_sample_size
        description: "Power / minimum-detectable-effect / required-runs reported."
        detail_level: 简要
      - name: reliability_metric_family
        description: "pass@1 / pass@k / pass^k / G-Pass@k_τ / Cover@τ; is the pass@k–pass^k gap quantified?"
        detail_level: 简要
      - name: cost_controlled_reporting
        description: "Accuracy×cost Pareto with significance on both axes?"
        detail_level: 极简
      - name: ranking_uncertainty_treatment
        description: "Bradley-Terry/Elo bootstrap CIs + rank stability (Kendall τ, top-k under perturbation)."
        detail_level: 简要

  # --- For ablation methodology items --------------------------------
  - group: ablation_properties
    applies_to: [ablation_methodology]
    fields:
      - name: component_isolation_method
        description: "remove-one-module · additive build-up · swap-with-baseline · oracle-vs-self feedback."
        detail_level: 简要
      - name: confound_controls
        description: "Held constant when ablating (base model, prompt/token/cost budget, rollouts, oracle signal, retrieval corpus)."
        detail_level: 简要
      - name: cost_compute_normalization
        description: "Reports accuracy at FIXED cost/compute (USD/tokens/rollouts)?"
        detail_level: 简要
      - name: effect_size_magnitude
        description: "Quantified delta from removing the component (pp gain/loss, x-fold), not just 'contributes'."
        detail_level: 简要
      - name: negative_result_flag
        description: "Did the ablation find the component unhelpful/harmful?"
        detail_level: 极简
      - name: base_model_interaction
        description: "Does the component's contribution depend on base-model strength?"
        detail_level: 简要
      - name: task_horizon_dependence
        description: "Matters only for long-horizon/multi-turn vs single-turn tasks?"
        detail_level: 极简
      - name: failure_mode_attribution
        description: "Where removal causes failure (MAST spec / inter-agent / verification categories)."
        detail_level: 简要

  # --- For frameworks / harnesses / tooling --------------------------
  - group: framework_properties
    applies_to: [frameworks_tooling]
    fields:
      - name: harness_vs_benchmark_separation
        description: "Is it a harness/framework vs a task set; how scaffold/prompt/parser/tools decouple from content."
        detail_level: 简要
      - name: cost_controlled
        description: "Tracks token/$ cost by default; Pareto reporting?"
        detail_level: 极简
      - name: parallelism_scalability
        description: "Parallel execution (container/VM count, cloud integration: Daytona/Modal/Ray)."
        detail_level: 极简
      - name: trajectory_logging_observability
        description: "Full trajectory/tool-call logging; log viewer; LLM-aided log inspection."
        detail_level: 简要
      - name: governance_versioning
        description: "Spec/task version governance (SemVer, register, checklist revisions)."
        detail_level: 极简
      - name: adoption_ecosystem_consolidation
        description: "Industry consolidation signal (e.g. Vivaria→Inspect, lighteval→Inspect backend)."
        detail_level: 简要
      - name: safety_capability_scope
        description: "Targets dangerous-capability/safety eval (CBRN, cyber, self-proliferation)?"
        detail_level: 极简

  # --- For position / meta papers & surveys --------------------------
  - group: position_paper_properties
    applies_to: [position_meta_surveys]
    fields:
      - name: core_thesis
        description: "The paper's central argument / position in one sentence."
        detail_level: 简要
      - name: construct_validity_treatment
        description: "Does it define/operationalize the measured construct and discuss validity?"
        detail_level: 简要
      - name: prescriptions_checklist
        description: "Concrete recommendations / checklist items it offers."
        detail_level: 详细
      - name: scoring_design_pitfalls
        description: "Scoring/reward design flaws it surfaces (empty-as-success, weak match, solvable-without-solving)."
        detail_level: 简要

# ---------------------------------------------------------------------
# UNCERTAIN — reserved fields the deep phase auto-fills / flags.
# Per skill: deep agents skip-and-flag uncertain values here rather
# than fabricating. Populated per-item during /research-deep.
# ---------------------------------------------------------------------
uncertain: []
