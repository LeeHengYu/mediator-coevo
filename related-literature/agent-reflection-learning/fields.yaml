# fields.yaml — field definitions for deep research of each item
# Topic: Self-reflection & learning-from-failure in LLM agents
# detail_level: minimal -> brief -> detailed (deep phase fills progressively)
# Fields marked NEW were surfaced + cross-validated by the three search agents
# (general-web / academic-citation-graph / frontier-failure) and are the load-bearing
# discriminators in the 2024-2026 literature.

topic: "Self-reflection & learning-from-failure in LLM agents"

# NOTE: top-level key is `field_categories` (not field_groups) so that
# ~/.claude/skills/research/validate_json.py loads these field definitions.
field_categories:

  basic_info:
    description: "Identification and provenance"
    fields:
      - name: name
        description: "Canonical method/paper name"
        detail_level: minimal
      - name: year
        description: "Publication year (arXiv first-submission year if unpublished)"
        detail_level: minimal
      - name: authors
        description: "First author et al. + lead affiliation"
        detail_level: brief
      - name: venue
        description: "Peer-reviewed venue (NeurIPS/ICLR/ACL/TACL/Nature/...) or 'arXiv preprint'"
        detail_level: brief
      - name: paper_url
        description: "Canonical URL (arXiv abstract / ACL Anthology / OpenReview / proceedings)"
        detail_level: brief
      - name: code_url
        description: "Official code/model release if any"
        detail_level: brief

  core_mechanism:
    description: "How reflection / self-correction actually works"
    fields:
      - name: reflection_type
        description: "verbal-self-critique | tool-verified | learned-critic-model | search-guided | multi-agent-debate | calibration/probing | none"
        detail_level: brief
      - name: feedback_source
        description: "self-generated | external-tool (compiler/interpreter/search) | unit-tests | environment-reward | ground-truth-oracle | human | hidden-state-probe"
        detail_level: brief
      - name: iteration_structure
        description: "single-shot | iterative-refine | episodic-retry-with-reset | tree/MCTS-search | population/evolutionary"
        detail_level: brief
      - name: reflection_object        # NEW
        description: "What is being reflected on/modified: output content | reasoning chain | action trajectory | prompt/context | reusable skill/workflow | structured rules/constitution | agent's own code/architecture | model weights"
        detail_level: detailed

  learning_paradigm:
    description: "Where the learning signal lives (the core lens of this survey)"
    fields:
      - name: learning_locus           # NEW — top-level discriminator
        description: "in_context_verbal (no weight update) | gradient_weight_update | hybrid | n/a (analysis/survey)"
        detail_level: minimal
      - name: requires_training
        description: "none | SFT | RL (PPO/GRPO/online) | DPO/preference | nested-RL+SFT"
        detail_level: brief
      - name: reward_or_critic_model
        description: "What provides the improvement signal: none | self-as-judge | trained reward model | verifiable reward | separate retrospective model | meta-judge"
        detail_level: brief
      - name: distillation_target      # NEW
        description: "If reflection is distilled into a reusable artifact, what form: none | episodic-memory | reusable-skill/workflow | structured-rules/constitution | prompt | model-weights"
        detail_level: detailed
      - name: emergent_vs_engineered   # NEW
        description: "Is the reflective behavior RL-emergent (e.g. R1 'aha') or prompt/scaffold-engineered (e.g. Reflexion)?"
        detail_level: detailed

  memory_mechanism:
    description: "Memory and experience persistence"
    fields:
      - name: memory_type
        description: "none | short-term/scratchpad | long-term-episodic | skill-library | structured-notes/graph | playbook/cheatsheet"
        detail_level: brief
      - name: memory_persistence
        description: "within-episode | cross-episode | cross-task | cross-session (production)"
        detail_level: brief
      - name: memory_curation_mechanism   # NEW
        description: "How memory is kept from ballooning / what is retained: n/a | append-only | self-summarized/curated | population-or-Pareto-selected | retrieval-gated | overwrite/evolution (self-relinking)"
        detail_level: detailed

  reflection_granularity:             # NEW group
    description: "Granularity and timing of the corrective signal"
    fields:
      - name: error_localization_granularity
        description: "holistic/outcome-level | response-level | step-level | block-level (code) | token-level | agent-level (multi-agent)"
        detail_level: detailed
      - name: intra_task_vs_inter_task
        description: "intra-task (refine within one task, e.g. Self-Refine) | inter-task (transfer experience across tasks, e.g. Reflexion/ExpeL/AWM)"
        detail_level: detailed
      - name: failure_recovery_vs_avoidance
        description: "avoidance-only (retry next episode) | mid-trajectory-recovery (correct in-flight, e.g. Agent-R) | post-hoc-revision"
        detail_level: detailed

  application_domain:
    description: "Where it is applied and evaluated"
    fields:
      - name: task_domains
        description: "code | math | QA/reasoning | web-navigation | embodied/games | tool-use | dialogue | decision-making | general-alignment"
        detail_level: brief
      - name: benchmarks
        description: "HumanEval, MBPP, SWE-bench, GSM8K, MATH, AIME, ALFWorld, WebArena, Mind2Web, HotpotQA, GAIA, Game-of-24, etc."
        detail_level: brief

  evaluation_results:
    description: "Reported performance"
    fields:
      - name: headline_result
        description: "Primary quantitative gain (with metric + base model)"
        detail_level: brief
      - name: baselines
        description: "What it is compared against"
        detail_level: brief
      - name: gains_vs_baseline
        description: "Delta vs the strongest comparable baseline"
        detail_level: detailed
      - name: compute_cost_profile      # NEW
        description: "Inference token/API-call multiplier and/or training cost (rollouts, gradient steps) vs single-pass baseline"
        detail_level: detailed

  limitations_and_critique:
    description: "Honesty about when/why it works"
    fields:
      - name: known_limitations
        description: "Documented failure modes and scope limits"
        detail_level: brief
      - name: oracle_or_external_feedback_dependency   # NEW — encodes Huang/Kamoi critique
        description: "intrinsic-only | self-verify | external-tool/verifier | oracle-label/ground-truth | env-reward. THE discriminating variable for whether self-correction actually works."
        detail_level: detailed
      - name: self_correction_efficacy
        description: "net-positive | net-negative (correction degrades) | task-dependent | requires-oracle. Does it improve without label leakage?"
        detail_level: detailed
      - name: calibration_effect          # NEW (reasoning-model lens)
        description: "improves | degrades/overconfident ('reasoning tax') | mixed | not-measured"
        detail_level: detailed

  failure_analysis:                    # NEW group — for Category I items
    description: "For failure-analysis/attribution objects"
    fields:
      - name: failure_attribution_capability
        description: "n/a | classifies-failure-mode (taxonomy) | attributes-responsible-agent | attributes-failing-step | counterfactual-localization"
        detail_level: detailed
      - name: failure_mode_addressed
        description: "Which failure modes the method targets/exposes; cross-link to MAST's 14 modes where possible (e.g. inter-agent misalignment, premature termination, superficial self-reflection, underthinking, overthinking, error-loops)"
        detail_level: detailed
      - name: dataset_or_benchmark_released
        description: "Reusable resource released (e.g. MAST traces, Who&When 184, TracerTraj-2.5K)"
        detail_level: detailed

  relations:
    description: "Position in the citation graph"
    fields:
      - name: builds_on
        description: "Direct predecessors it extends"
        detail_level: brief
      - name: extended_by_or_inspired
        description: "Notable follow-ups / direct successors"
        detail_level: detailed
      - name: citation_count
        description: "Approx. citations (Semantic Scholar) as a rough impact proxy"
        detail_level: detailed

# Uncertain / reserved fields — deep phase attempts to fill; leave blank if not applicable
uncertain:
  - reasoning_model_native        # bool: does it target/hold for o1/R1-style models with built-in reflection?
  - on_policy_distillation_link   # OPD-relevance lens: relation to on-policy distillation / skill-optimization (for cross-thread synthesis)
  - sample_efficiency             # #trials / #iterations to reach reported gain
