# outline.yaml — Self-reflection & learning-from-failure in LLM agents
# Generated by /research. All 78 items verified against real sources
# (arXiv/venue/year) on 2026-06-07 by a 10-agent Opus verification pass:
# 58 candidate items checked -> 41 confirmed, 17 metadata-corrected, 0 hallucinated;
# plus 20 canonical anchor papers cross-confirmed via the academic citation graph.

topic: "Self-reflection & learning-from-failure in LLM agents"
topic_slug: agent-reflection-learning
research_date: "2026-06-07"
time_range: "2022-present (incl. foundational)"

# Item categories (organizing taxonomy)
categories:
  A: "Foundational reasoning–acting substrate"
  B: "Core verbal self-reflection / self-refinement (training-free)"
  C: "Critiques & limits of self-correction"
  D: "Search + reflection hybrids"
  E: "Parametric / learned reflection (training-based)"
  F: "Reasoning-model self-reflection (o1/R1-era) & its analysis"
  G: "Memory, experience-distillation & lifelong agents"
  H: "Self-evolving / self-modifying agents"
  I: "Failure analysis & attribution"
  J: "Surveys & roadmaps"

execution:
  batch_size: 4              # parallel deep-research agents at once
  items_per_agent: 1         # deepest per-item coverage
  output_dir: ./related-literature/agent-reflection-learning/results
  model: opus                # use Opus 4.8 max-reasoning for deep agents
  tools: [firecrawl, exa, academic-search-mcp]

