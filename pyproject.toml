[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mediated-coevo"
version = "0.1.0"
description = "Fixed-skill context mediation and diffusion experiments"
requires-python = ">=3.13"
license = {text = "MIT"}

dependencies = [
    "langchain>=1.0.0",
    "langchain-openrouter>=0.0.1",
    "litellm>=1.70.0",
    "tiktoken>=0.7.0",
    "pydantic>=2.5.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "tomli-w>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.16.0",
    "mypy>=1.13.0",
]

[project.scripts]
medcoevo = "mediated_coevo.main:app"

[tool.setuptools]
packages = {find = {where = ["src"], include = ["mediated_coevo*"]}}

[tool.ruff]
extend-exclude = ["data", "tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires the harbor CLI on PATH; opt-in.",
]
asyncio_mode = "auto"
