[models]
planner = "openrouter/anthropic/claude-opus-4.6"
executor = "openai/gpt-5.5"
mediator = "openrouter/google/gemini-3-flash-preview"
judge = "openrouter/openai/gpt-oss-120b"

[budgets]
max_skill_tokens = 4000
max_diffusion_context_tokens = 4000
trace_excerpt_tokens = 6000
historical_summary_tokens = 3000
mediator_report_tokens = 4000
planner_context_tokens = 24000
skill_update_diff_tokens = 6000
mediator_prompt_tokens = 16000
advisor_prompt_tokens = 12000
reflector_prompt_tokens = 16000
judge_prompt_tokens = 16000
planner_completion_tokens = 32768
mediator_completion_tokens = 8192
advisor_completion_tokens = 1024
reflector_completion_tokens = 4096
judge_completion_tokens = 4096

[experiment]
num_iterations = 3
coevo_interval = 99
seed = 42
advisor_buffer_max = 99
condition_name = "no_feedback"

[experiment.skill_updates]
executor = false
planner = false
mediator = false

[experiment.skill_validation]
min_mean_delta = 0.01
reward_tolerance = 1e-09
require_all_tasks_usable = true
sample_size = 3
tasks = []
allow_contributing_fallback = true
min_tag_overlap = 1

[experiment.benchmark_selection]
tasks = [
    "Weighted-Risk-Assessment/api-sla-at-risk-calc",
    "Weighted-Risk-Assessment/campus-budget-at-risk-calc",
    "Weighted-Risk-Assessment/factory-output-at-risk-calc",
    "Weighted-Risk-Assessment/hospital-capacity-at-risk-calc",
    "Weighted-Risk-Assessment/weighted-campus-energy-balance-calc",
    "Weighted-Risk-Assessment/weighted-cloud-reliability-calc",
    "Weighted-Risk-Assessment/weighted-hospital-bedflow-calc",
    "Weighted-Risk-Assessment/weighted-port-throughput-calc",
]
family = "Weighted-Risk-Assessment"

[diffusion]
enabled = true
policy = "top_k_similarity"
graph = "task_similarity"
max_artifacts = 3
top_k_neighbors = 3

[judge]
rubric_version = "rar-v1"

[paths]
skills_dir = "skills"
data_dir = "data"
benchmarks_dir = "benchmarks/skillflow"

[executor_runtime]
jobs_dir = "jobs"
task_dirs = [
    "tasks",
]
injected_skill_name = "executor"
sync_enabled = false
dataset = "zhang-ziao/SkillFlow-Task"
dataset_repo_type = "dataset"
harbor_timeout_sec = 5400.0
harbor_agent_setup_timeout_multiplier = 3.0
harbor_required = true
