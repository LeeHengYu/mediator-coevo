[models]
planner = "openrouter/anthropic/claude-opus-4.6"
executor = "moonshotai/kimi-k2.5"
mediator = "openrouter/google/gemini-3-flash-preview"
judge = "openrouter/openai/gpt-oss-120b"

[budgets]
max_skill_tokens = 4000
max_same_task_prior_tokens = 300
max_transfer_context_tokens = 900
trace_excerpt_tokens = 6000
historical_summary_tokens = 3000
mediator_report_tokens = 1200
planner_context_tokens = 24000
skill_update_diff_tokens = 6000
mediator_prompt_tokens = 16000
advisor_prompt_tokens = 12000
reflector_prompt_tokens = 16000
judge_prompt_tokens = 16000
planner_completion_tokens = 32768
mediator_completion_tokens = 8192
advisor_completion_tokens = 1024
reflector_completion_tokens = 4096
judge_completion_tokens = 4096

[experiment]
num_iterations = 3
coevo_interval = 99
seed = 42
advisor_buffer_max = 99
condition_name = "learned_mediator"
baseline_preset = "skill_none_random_k"

[experiment.skill_updates]
executor = false
planner = false
mediator = false

[experiment.skill_validation]
min_mean_delta = 0.01
reward_tolerance = 1e-09
require_all_tasks_usable = true
sample_size = 3
tasks = []
allow_contributing_fallback = true
min_tag_overlap = 1

[experiment.benchmark_selection]
tasks = []

[diffusion]
enabled = true
policy = "random_k"
graph = "none"
max_artifacts = 3
top_k_neighbors = 5
avoid_recheck_max_artifacts = 1
softmax_temperature = 0.35
softmax_top_k_candidates = 3
llm_router_model = "openrouter/openai/gpt-5.2"
llm_router_weight = 0.3
logical_seed_count = 3
logical_min_active_tasks = 2
consecutive_iteration_limit = 2

[judge]
rubric_version = "rar-v1"

[paths]
skills_dir = "skills"
data_dir = "data"
benchmarks_dir = "benchmarks/skillflow"

[executor_runtime]
jobs_dir = "jobs"
task_dirs = [
    "tasks",
]
agent_name = "claude-code"
injected_skill_name = "executor"
sync_enabled = false
dataset = "zhang-ziao/SkillFlow-Task"
dataset_repo_type = "dataset"
harbor_base_image = "skillflow/harbor-cli-base:ubuntu24.04"
legacy_harbor_base_images = [
    "skillevlove/harbor-cli-openhands:ubuntu24.04",
]
harbor_timeout_sec = 5400.0
harbor_agent_setup_timeout_multiplier = 2.0
harbor_required = true

[executor_runtime.agent_env]
ANTHROPIC_API_KEY = ""
ANTHROPIC_AUTH_TOKEN = "${OPENROUTER_API_KEY}"
ANTHROPIC_BASE_URL = "https://openrouter.ai/api"
