<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">HL5 reward evolution across six episodes</title>
  <desc id="desc">Line plot of 18 iteration weighted mean rewards. Three iterations form each episode. Dashed vertical markers show update checkpoints after each episode.</desc>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #172033;
      --muted: #5d687a;
      --grid: #d8dee9;
      --band: #edf2ff;
      --series: #2563eb;
      --checkpoint: #c25b12;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --fg: #f3f4f6;
        --muted: #c1c8d4;
        --grid: #384152;
        --band: #172554;
        --series: #60a5fa;
        --checkpoint: #fb923c;
      }
    }
    .background { fill: var(--bg); }
    .episode-band { fill: var(--band); opacity: 0.58; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--fg); stroke-width: 1.4; }
    .reward-line { fill: none; stroke: var(--series); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .reward-point { fill: var(--bg); stroke: var(--series); stroke-width: 3; }
    .checkpoint { stroke: var(--checkpoint); stroke-width: 2; stroke-dasharray: 6 6; }
    .checkpoint-diamond { fill: var(--checkpoint); stroke: var(--bg); stroke-width: 1.5; }
    .fg { fill: var(--fg); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: var(--muted); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .checkpoint-label { fill: var(--checkpoint); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 500; }
    .title { font-size: 22px; font-weight: 500; }
    .subtitle { font-size: 13px; }
    .tick { font-size: 12px; }
    .value { font-size: 11px; font-weight: 500; }
    .episode { font-size: 12px; font-weight: 500; }
  </style>

  <rect class="background" width="1100" height="650" />
  <text class="fg title" x="80" y="30">HL5 reward evolution: 18 iteration means across six episodes</text>
  <text class="muted subtitle" x="80" y="52">Blue line: weighted mean reward · dashed amber marker: promoted update checkpoint after the episode</text>

  <rect class="episode-band" x="62.5" y="100" width="165" height="410" />
  <rect class="episode-band" x="392.5" y="100" width="165" height="410" />
  <rect class="episode-band" x="722.5" y="100" width="165" height="410" />

  <line class="grid" x1="80" y1="110" x2="1055" y2="110" />
  <line class="grid" x1="80" y1="190" x2="1055" y2="190" />
  <line class="grid" x1="80" y1="270" x2="1055" y2="270" />
  <line class="grid" x1="80" y1="350" x2="1055" y2="350" />
  <line class="grid" x1="80" y1="430" x2="1055" y2="430" />
  <line class="grid" x1="80" y1="510" x2="1055" y2="510" />

  <line class="checkpoint" x1="227.5" y1="78" x2="227.5" y2="510" />
  <line class="checkpoint" x1="392.5" y1="78" x2="392.5" y2="510" />
  <line class="checkpoint" x1="557.5" y1="78" x2="557.5" y2="510" />
  <line class="checkpoint" x1="722.5" y1="78" x2="722.5" y2="510" />
  <line class="checkpoint" x1="887.5" y1="78" x2="887.5" y2="510" />
  <line class="checkpoint" x1="1052.5" y1="78" x2="1052.5" y2="510" />
  <text class="checkpoint-label" x="227.5" y="73" text-anchor="middle">update_0001</text>
  <text class="checkpoint-label" x="392.5" y="73" text-anchor="middle">update_0002</text>
  <text class="checkpoint-label" x="557.5" y="73" text-anchor="middle">update_0003</text>
  <text class="checkpoint-label" x="722.5" y="73" text-anchor="middle">update_0004</text>
  <text class="checkpoint-label" x="887.5" y="73" text-anchor="middle">update_0005</text>
  <text class="checkpoint-label" x="1060" y="73" text-anchor="end">update_0006</text>

  <line class="axis" x1="80" y1="110" x2="80" y2="510" />
  <line class="axis" x1="80" y1="510" x2="1055" y2="510" />
  <text class="muted tick" x="68" y="114" text-anchor="end">1.0</text>
  <text class="muted tick" x="68" y="194" text-anchor="end">0.8</text>
  <text class="muted tick" x="68" y="274" text-anchor="end">0.6</text>
  <text class="muted tick" x="68" y="354" text-anchor="end">0.4</text>
  <text class="muted tick" x="68" y="434" text-anchor="end">0.2</text>
  <text class="muted tick" x="68" y="514" text-anchor="end">0.0</text>
  <text class="muted tick" transform="translate(22 310) rotate(-90)" text-anchor="middle">Weighted mean reward</text>

  <path class="reward-line" d="M 90 281.4 L 145 338.6 L 200 224.3 L 255 395.7 L 310 395.7 L 365 167.1 L 420 281.4 L 475 224.3 L 530 281.4 L 585 338.6 L 640 281.4 L 695 167.1 L 750 224.3 L 805 167.1 L 860 281.4 L 915 281.4 L 970 452.9 L 1025 338.6" />

  <g aria-label="Iteration reward points">
    <circle class="reward-point" cx="90" cy="281.4" r="5" /><text class="fg value" x="90" y="267" text-anchor="middle">.571</text>
    <circle class="reward-point" cx="145" cy="338.6" r="5" /><text class="fg value" x="145" y="324" text-anchor="middle">.429</text>
    <circle class="reward-point" cx="200" cy="224.3" r="5" /><text class="fg value" x="200" y="210" text-anchor="middle">.714</text>
    <circle class="reward-point" cx="255" cy="395.7" r="5" /><text class="fg value" x="255" y="381" text-anchor="middle">.286</text>
    <circle class="reward-point" cx="310" cy="395.7" r="5" /><text class="fg value" x="310" y="417" text-anchor="middle">.286</text>
    <circle class="reward-point" cx="365" cy="167.1" r="5" /><text class="fg value" x="365" y="153" text-anchor="middle">.857</text>
    <circle class="reward-point" cx="420" cy="281.4" r="5" /><text class="fg value" x="420" y="267" text-anchor="middle">.571</text>
    <circle class="reward-point" cx="475" cy="224.3" r="5" /><text class="fg value" x="475" y="210" text-anchor="middle">.714</text>
    <circle class="reward-point" cx="530" cy="281.4" r="5" /><text class="fg value" x="530" y="267" text-anchor="middle">.571</text>
    <circle class="reward-point" cx="585" cy="338.6" r="5" /><text class="fg value" x="585" y="324" text-anchor="middle">.429</text>
    <circle class="reward-point" cx="640" cy="281.4" r="5" /><text class="fg value" x="640" y="267" text-anchor="middle">.571</text>
    <circle class="reward-point" cx="695" cy="167.1" r="5" /><text class="fg value" x="695" y="153" text-anchor="middle">.857</text>
    <circle class="reward-point" cx="750" cy="224.3" r="5" /><text class="fg value" x="750" y="210" text-anchor="middle">.714</text>
    <circle class="reward-point" cx="805" cy="167.1" r="5" /><text class="fg value" x="805" y="153" text-anchor="middle">.857</text>
    <circle class="reward-point" cx="860" cy="281.4" r="5" /><text class="fg value" x="860" y="267" text-anchor="middle">.571</text>
    <circle class="reward-point" cx="915" cy="281.4" r="5" /><text class="fg value" x="915" y="267" text-anchor="middle">.571</text>
    <circle class="reward-point" cx="970" cy="452.9" r="5" /><text class="fg value" x="970" y="439" text-anchor="middle">.143</text>
    <circle class="reward-point" cx="1025" cy="338.6" r="5" /><text class="fg value" x="1025" y="324" text-anchor="middle">.429</text>
  </g>

  <g aria-label="Update checkpoint diamonds">
    <polygon class="checkpoint-diamond" points="200,215.3 209,224.3 200,233.3 191,224.3" />
    <polygon class="checkpoint-diamond" points="365,158.1 374,167.1 365,176.1 356,167.1" />
    <polygon class="checkpoint-diamond" points="530,272.4 539,281.4 530,290.4 521,281.4" />
    <polygon class="checkpoint-diamond" points="695,158.1 704,167.1 695,176.1 686,167.1" />
    <polygon class="checkpoint-diamond" points="860,272.4 869,281.4 860,290.4 851,281.4" />
    <polygon class="checkpoint-diamond" points="1025,329.6 1034,338.6 1025,347.6 1016,338.6" />
  </g>

  <g aria-label="Point numbers">
    <text class="muted tick" x="90" y="532" text-anchor="middle">1</text><text class="muted tick" x="145" y="532" text-anchor="middle">2</text><text class="muted tick" x="200" y="532" text-anchor="middle">3</text>
    <text class="muted tick" x="255" y="532" text-anchor="middle">4</text><text class="muted tick" x="310" y="532" text-anchor="middle">5</text><text class="muted tick" x="365" y="532" text-anchor="middle">6</text>
    <text class="muted tick" x="420" y="532" text-anchor="middle">7</text><text class="muted tick" x="475" y="532" text-anchor="middle">8</text><text class="muted tick" x="530" y="532" text-anchor="middle">9</text>
    <text class="muted tick" x="585" y="532" text-anchor="middle">10</text><text class="muted tick" x="640" y="532" text-anchor="middle">11</text><text class="muted tick" x="695" y="532" text-anchor="middle">12</text>
    <text class="muted tick" x="750" y="532" text-anchor="middle">13</text><text class="muted tick" x="805" y="532" text-anchor="middle">14</text><text class="muted tick" x="860" y="532" text-anchor="middle">15</text>
    <text class="muted tick" x="915" y="532" text-anchor="middle">16</text><text class="muted tick" x="970" y="532" text-anchor="middle">17</text><text class="muted tick" x="1025" y="532" text-anchor="middle">18</text>
  </g>

  <text class="fg episode" x="145" y="562" text-anchor="middle">E1 · baseline · mean .571</text>
  <text class="fg episode" x="310" y="562" text-anchor="middle">E2 · u1 · mean .476</text>
  <text class="fg episode" x="475" y="562" text-anchor="middle">E3 · u2 · mean .619</text>
  <text class="fg episode" x="640" y="562" text-anchor="middle">E4 · u3 · mean .619</text>
  <text class="fg episode" x="805" y="562" text-anchor="middle">E5 · u4 · mean .714</text>
  <text class="fg episode" x="970" y="562" text-anchor="middle">E6 · u5 · mean .381</text>
  <text class="muted tick" x="567" y="610" text-anchor="middle">Scored iteration in chronological order (three valid results per episode)</text>
</svg>
